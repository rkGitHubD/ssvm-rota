// ─── Volunteer Requests Tab ───────────────────────────────────────────────────
// ─── Volunteer Requests Tab ───────────────────────────────────────────────────
function VolunteerRequests({ members=[], rotas, upRotas, allSlots, activities, generalOffers, upGeneralOffers, currentUser, showToast }) {
  if (!currentUser) return null;

  const [offerNote, setOfferNote]   = useState("");
  const [sending, setSending]       = useState(false);
  const [replyText, setReplyText]   = useState({});   // cardId -> volunteer clarify reply text

  const getSlot = key => allSlots.find(s => s.key === key);
  const getAct  = id  => activities.find(a => a.id === id);
  const today0  = new Date(); today0.setHours(0,0,0,0);

  // Open help-wanted items this volunteer has not responded to yet
  const openRequests = [];
  Object.entries(rotas).forEach(([slotKey, r]) => {
    const slot = getSlot(slotKey);
    if (!slot || new Date(slot.date) < today0) return;
    (r.helpWanted||[]).forEach(actId => {
      const interest = (r.actInterest||{})[actId];
      // Show if no one has volunteered for this activity yet (or the volunteer themselves haven't responded)
      if (!interest || interest.memberId !== currentUser.memberId)
        openRequests.push({ slotKey, slot, actId, act: getAct(actId), rota: r });
    });
  });
  openRequests.sort((a,b) => new Date(a.slot.date) - new Date(b.slot.date));

  // My submitted responses
  const myResponses = [];
  Object.entries(rotas).forEach(([slotKey, r]) => {
    (r.slotRequests||[]).filter(req => req.memberId === currentUser.memberId).forEach(req => {
      myResponses.push({ type:"slot", slotKey, slot: getSlot(slotKey), req, rota: r });
    });
    Object.entries(r.actInterest||{}).filter(([,i]) => i.memberId === currentUser.memberId).forEach(([actId, interest]) => {
      myResponses.push({ type:"act", slotKey, slot: getSlot(slotKey), actId, act: getAct(actId), interest, rota: r });
    });
  });

  const needsReply = myResponses.filter(x =>
    (x.type==="slot" ? x.req.status : x.interest.status) === "clarify"
  ).length;

  // Respond to an open help-wanted activity
  const respond = (slotKey, actId, actName, note) => {
    const r = rotas[slotKey]||{};
    upRotas({ ...rotas, [slotKey]: { ...r, actInterest: { ...(r.actInterest||{}),
      [actId]: { memberId: currentUser.memberId, name: currentUser.name,
                 message: note.trim(), status:"pending", createdAt: new Date().toISOString(), thread:[] }
    }}});
    showToast(`Response sent for "${actName}"`);
  };

  // Volunteer sends a reply to a clarification message
  const sendReply = (type, slotKey, reqIdOrActId, cardId) => {
    const text = (replyText[cardId]||"").trim();
    if (!text) return showToast("Please write a reply first","error");
    const msg = { from:"volunteer", memberId: currentUser.memberId, name: currentUser.name,
                  text, createdAt: new Date().toISOString() };
    upRotas(prev => {
      const r = prev[slotKey]||{};
      let updated;
      if (type === "slot") {
        updated = {...prev, [slotKey]: {...r, slotRequests: (r.slotRequests||[]).map(x =>
          x.id === reqIdOrActId ? {...x, status:"pending", thread:[...(x.thread||[]), msg]} : x
        )}};
      } else {
        const cur = (r.actInterest||{})[reqIdOrActId]||{};
        updated = {...prev, [slotKey]: {...r, actInterest: {...(r.actInterest||{}),
          [reqIdOrActId]: {...cur, status:"pending", thread:[...(cur.thread||[]), msg]}
        }}};
      }
      return updated;
    });
    setReplyText(p => ({...p, [cardId]:""}));
    showToast("Reply sent");
  };

  // Volunteer reply to offer clarification
  const sendReplyOffer = (offerId, cardId) => {
    const text = (replyText[cardId]||"").trim();
    if (!text) return showToast("Please write a reply first","error");
    const msg = { from:"volunteer", memberId:currentUser.memberId, name:currentUser.name, text, createdAt:new Date().toISOString() };
    upGeneralOffers((generalOffers||[]).map(o =>
      o.id === offerId ? {...o, status:"pending", thread:[...(o.thread||[]), msg]} : o
    ));
    setReplyText(p => ({...p, [cardId]:""}));
    showToast("Reply sent");
  };

  // General availability
  const submitOffer = () => {
    if (!offerNote.trim()) return showToast("Please write a note first","error");
    setSending(true);
    const offer = { id: uid(), memberId: currentUser.memberId, name: currentUser.name,
                    message: offerNote.trim(), status:"pending", createdAt: new Date().toISOString() };
    upGeneralOffers([...generalOffers, offer]);
    setOfferNote(""); setSending(false);
    showToast("Your availability message has been sent");
  };

  const myOffers = generalOffers.filter(o => o.memberId === currentUser.memberId && !isSwap(o));

  const STATUS_CFG = {
    pending:  { pill:"bg-amber-100 text-amber-700 border-amber-200",      icon:"⏳", label:"Pending" },
    accepted: { pill:"bg-emerald-100 text-emerald-700 border-emerald-200", icon:"✅", label:"Confirmed" },
    rejected: { pill:"bg-red-100 text-red-600 border-red-200",            icon:"❌", label:"Not accepted" },
    clarify:  { pill:"bg-blue-100 text-blue-700 border-blue-200",         icon:"💬", label:"Clarification needed" },
  };

  // ── filter helpers ──────────────────────────────────────────────────────────
  const allMyItems = [
    ...myOffers.slice().reverse().map(o => ({ kind:"offer", id:"offer-"+o.id, o })),
    ...myResponses.map(item => {
      const isSlot = item.type==="slot";
      const status = isSlot ? item.req.status : item.interest.status;
      const id     = isSlot ? item.req.id     : item.slotKey+item.actId;
      return { kind:"submission", id, item, isSlot, status };
    }),
  ];

  const [myFilter, setMyFilter]   = useState("all");
  const [expandedMy, setExpandedMy] = useState(null);

  const getMyStatus = row => row.kind==="offer" ? row.o.status : row.status;

  const MY_FILTER_TABS = [
    { key:"all",      label:"All" },
    { key:"pending",  label:"⏳ Pending" },
    { key:"clarify",  label:"💬 Clarify" },
    { key:"accepted", label:"✅ Accepted" },
    { key:"rejected", label:"❌ Declined" },
  ];
  const filteredMy = myFilter==="all" ? allMyItems : allMyItems.filter(r => getMyStatus(r)===myFilter);

  const needsReplyOffers = myOffers.filter(o => {
    const t=o.thread||[]; const last=t[t.length-1];
    return o.status==="clarify" && (!last||last.from!=="volunteer");
  }).length;
  const totalNeedsReply = needsReply + needsReplyOffers;

  return (
    <div className="space-y-5 max-w-3xl">

      {/* Header */}
      <div className="flex items-center gap-3 flex-wrap">
        <div>
          <h2 className="text-xl font-bold text-slate-800">📥 Requests</h2>
          <p className="text-sm text-slate-500 mt-0.5">Help requests from the team and your submissions</p>
        </div>
        {openRequests.length > 0 && (
          <span className="ml-auto bg-red-500 text-white text-sm font-bold px-3 py-1 rounded-full">{openRequests.length} new</span>
        )}
        {openRequests.length === 0 && totalNeedsReply > 0 && (
          <div className="ml-auto flex items-center gap-2 bg-blue-50 border border-blue-200 text-blue-700 rounded-xl px-3 py-1.5">
            <span>💬</span>
            <span className="text-sm font-bold">{totalNeedsReply} need{totalNeedsReply===1?"s":""} your reply</span>
          </div>
        )}
      </div>

      {/* Open help-wanted from admin/rota-lead */}
      {openRequests.length > 0 && (
        <div className="space-y-3">
          <div className="flex items-center gap-2">
            <h3 className="text-xs font-bold text-slate-500 uppercase tracking-wider">🙌 Help Wanted — respond below</h3>
            <span className="bg-red-100 text-red-600 text-xs font-bold px-2 py-0.5 rounded-full">{openRequests.length}</span>
          </div>
          {openRequests.map(item => (
            <VolOpenCard key={item.slotKey+item.actId} item={item} onRespond={respond}/>
          ))}
        </div>
      )}

      {/* Swap one of my Rota Lead / Secondary weeks */}
      <SwapRequestForm rotas={rotas} allSlots={allSlots} members={members} generalOffers={generalOffers} upGeneralOffers={upGeneralOffers} currentUser={currentUser} showToast={showToast}/>

      {/* General availability box */}
      <div className="bg-gradient-to-br from-indigo-50 to-violet-50 border border-indigo-200 rounded-2xl p-5">
        <div className="flex items-start gap-3 mb-3">
          <span className="text-2xl">🙋</span>
          <div>
            <h3 className="font-bold text-indigo-800 text-sm">Let the team know you are available</h3>
            <p className="text-xs text-indigo-600 mt-0.5">Send a general availability message. Admin or Rota Lead will reach out if there is a slot for you.</p>
          </div>
        </div>
        <textarea value={offerNote} onChange={e=>setOfferNote(e.target.value)} rows={3}
          placeholder="e.g. I am free most Sundays and happy to help with setup, refreshments or register duty. Just let me know!"
          className="w-full border border-indigo-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 resize-none bg-white"/>
        <button onClick={submitOffer} disabled={sending}
          className="mt-2 w-full bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl py-2.5 text-sm font-bold transition-colors disabled:opacity-50">
          Send Availability Message
        </button>
      </div>

      {/* My submissions + offers — compact list with expand */}
      {allMyItems.length > 0 && (
        <div className="space-y-3">
          <div className="flex items-center justify-between gap-2 flex-wrap">
            <h3 className="text-xs font-bold text-slate-500 uppercase tracking-wider">📋 My Submissions & Messages</h3>
            <div className="flex gap-1.5 flex-wrap overflow-x-auto scrollbar-hide">
              {MY_FILTER_TABS.map(f => {
                const cnt = f.key==="all" ? allMyItems.length : allMyItems.filter(r=>getMyStatus(r)===f.key).length;
                if (cnt===0 && f.key!=="all") return null;
                return (
                  <button key={f.key} onClick={()=>{setMyFilter(f.key);setExpandedMy(null);}}
                    className={`text-xs px-2.5 py-1 rounded-full font-semibold border transition-colors
                      ${myFilter===f.key?"bg-indigo-600 text-white border-indigo-600":"bg-white border-slate-200 text-slate-600 hover:bg-slate-50"}`}>
                    {f.label} {cnt>0&&<span className={`ml-1 px-1 rounded-full text-xs ${myFilter===f.key?"bg-white bg-opacity-20":"bg-slate-100 text-slate-500"}`}>{cnt}</span>}
                  </button>
                );
              })}
            </div>
          </div>

          <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            {filteredMy.length === 0 && (
              <div className="px-5 py-8 text-center text-slate-400 text-sm">No {myFilter} submissions</div>
            )}
            {filteredMy.map((row, idx) => {
              const isOpen  = expandedMy === row.id;
              const isLast  = idx === filteredMy.length - 1;
              const myStatus = getMyStatus(row);
              const cfg     = STATUS_CFG[myStatus]||STATUS_CFG.pending;

              // ── derive compact row display fields ──
              let rowIcon="", rowLabel="", rowSub="", awaitingReply=false;
              if (row.kind==="offer") {
                const o=row.o; const t=o.thread||[]; const last=t[t.length-1];
                rowIcon="📣"; rowLabel="General Availability";
                rowSub=o.message?.slice(0,70)+(o.message?.length>70?"…":"");
                awaitingReply = myStatus==="clarify" && (!last||last.from!=="volunteer");
              } else {
                const {item,isSlot}=row;
                if (isSlot) {
                  rowIcon="🙋"; rowLabel="Slot Join";
                  rowSub=(item.slot?.label||item.slotKey)+(item.slot?" · "+new Date(item.slot.date).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}):"");
                  const t=item.req.thread||[]; const last=t[t.length-1];
                  awaitingReply = myStatus==="clarify" && (!last||last.from!=="volunteer");
                } else {
                  rowIcon="📌"; rowLabel=item.act?.name||item.actId;
                  rowSub=(item.slot?.label||item.slotKey)+(item.slot?" · "+new Date(item.slot.date).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}):"");
                  const t=item.interest.thread||[]; const last=t[t.length-1];
                  awaitingReply = myStatus==="clarify" && (!last||last.from!=="volunteer");
                }
              }

              return (
                <div key={row.id} className={`${!isLast?"border-b border-slate-100":""}`}>

                  {/* Compact row */}
                  {!isOpen && (
                    <button onClick={()=>setExpandedMy(row.id)}
                      className="w-full text-left px-4 py-3 flex items-center gap-3 hover:bg-slate-50 transition-colors group">
                      <span className="text-base flex-shrink-0">{rowIcon}</span>
                      <span className="font-semibold text-slate-800 text-sm flex-shrink-0 w-28 truncate hidden sm:block">{rowLabel}</span>
                      <span className="text-xs text-slate-500 flex-1 min-w-0 truncate">{rowSub}</span>
                      <span className={`text-xs px-2 py-0.5 rounded-full font-semibold border flex-shrink-0 ${cfg.pill}`}>
                        {awaitingReply ? "💬 Reply needed" : cfg.icon+" "+cfg.label}
                      </span>
                      <span className="text-slate-300 text-sm flex-shrink-0 group-hover:text-slate-500 transition-colors">▼</span>
                    </button>
                  )}

                  {/* Expanded detail */}
                  {isOpen && (
                    <div className="bg-slate-50 bg-opacity-60 fade-in">
                      {/* Collapse bar */}
                      <button onClick={()=>setExpandedMy(null)}
                        className="w-full flex items-center gap-3 px-4 py-2.5 bg-indigo-50 border-b border-indigo-100 hover:bg-indigo-100 transition-colors text-left">
                        <span className="text-base">{rowIcon}</span>
                        <span className="font-semibold text-indigo-800 text-sm flex-1 truncate">{rowLabel}</span>
                        <span className={`text-xs px-2 py-0.5 rounded-full font-semibold border flex-shrink-0 ${cfg.pill}`}>
                          {awaitingReply ? "💬 Reply needed" : cfg.icon+" "+cfg.label}
                        </span>
                        <span className="text-indigo-400 text-sm flex-shrink-0">▲ collapse</span>
                      </button>

                      <div className="px-4 py-4 space-y-3">

                      {/* ── OFFER DETAIL ── */}
                      {row.kind==="offer" && (() => {
                        const o=row.o; const thread=o.thread||[];
                        const lastMsg=thread.length>0?thread[thread.length-1]:null;
                        const awaitMyReply=o.status==="clarify"&&(!lastMsg||lastMsg.from!=="volunteer");
                        const cardId="offer-"+o.id;
                        return (
                          <div className="space-y-2">
                            {/* My message */}
                            <div className="flex gap-2 items-start">
                              <div className="w-6 h-6 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center text-xs font-bold flex-shrink-0">{currentUser.name[0]}</div>
                              <div className="flex-1 bg-indigo-50 border border-indigo-100 rounded-xl px-3 py-2 text-sm">
                                <span className="text-xs font-semibold text-indigo-600 block mb-0.5">You · 📣 Availability · {new Date(o.createdAt).toLocaleDateString("en-GB",{day:"numeric",month:"short"})}</span>
                                <span className="text-slate-700">{o.message}</span>
                              </div>
                            </div>
                            {/* Manager note */}
                            {o.managerNote && o.respondedBy && (
                              <div className="flex gap-2 items-start flex-row-reverse">
                                <div className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold flex-shrink-0 ${o.respondedBy.role==="admin"?"bg-amber-100 text-amber-700":"bg-emerald-100 text-emerald-700"}`}>{(o.respondedBy.name||"?")[0]}</div>
                                <div className={`flex-1 rounded-xl px-3 py-2 text-sm border ${o.status==="accepted"?"bg-emerald-50 border-emerald-200":o.status==="rejected"?"bg-red-50 border-red-200":"bg-blue-50 border-blue-200"}`}>
                                  <span className={`text-xs font-bold block mb-0.5 ${o.respondedBy.role==="admin"?"text-amber-700":"text-emerald-700"}`}>{o.respondedBy.role==="admin"?"⚙️ Admin":"🎯 Rota Lead"} · {o.respondedBy.name}</span>
                                  <p className="text-slate-700">{o.managerNote}</p>
                                </div>
                              </div>
                            )}
                            {/* Thread */}
                            {thread.map((msg,i2)=>{
                              const isMe=msg.from==="volunteer";
                              return (
                                <div key={i2} className={`flex gap-2 items-start ${isMe?"":"flex-row-reverse"}`}>
                                  <div className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold flex-shrink-0 ${isMe?"bg-indigo-100 text-indigo-700":msg.role==="admin"?"bg-amber-100 text-amber-700":"bg-emerald-100 text-emerald-700"}`}>{(msg.name||"?")[0]}</div>
                                  <div className={`flex-1 rounded-xl px-3 py-2 text-sm border ${isMe?"bg-indigo-50 border-indigo-100":"bg-blue-50 border-blue-200"}`}>
                                    <span className={`text-xs font-semibold block mb-0.5 ${isMe?"text-indigo-600":"text-blue-700"}`}>{isMe?"You":msg.name} <span className="ml-1 text-slate-400 font-normal">{new Date(msg.createdAt).toLocaleDateString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</span></span>
                                    {msg.text}
                                  </div>
                                </div>
                              );
                            })}
                            {/* Reply box */}
                            {awaitMyReply && (
                              <div className="bg-blue-50 border border-blue-200 rounded-xl p-3 space-y-2">
                                <p className="text-xs font-bold text-blue-700">💬 Reply to clarification</p>
                                <textarea value={replyText[cardId]||""} onChange={e=>setReplyText(p=>({...p,[cardId]:e.target.value}))}
                                  rows={2} placeholder="Type your reply here…"
                                  className="w-full border border-blue-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300 resize-none bg-white"/>
                                <button onClick={()=>sendReplyOffer(o.id,cardId)}
                                  className="w-full bg-blue-600 hover:bg-blue-700 text-white rounded-lg py-2 text-sm font-bold">Send Reply</button>
                              </div>
                            )}
                            {o.status==="clarify"&&lastMsg&&lastMsg.from==="volunteer"&&(
                              <div className="text-center text-xs text-blue-600 font-semibold py-1">⏳ Reply sent — waiting for response</div>
                            )}
                            {o.status==="accepted"&&!o.managerNote&&(
                              <div className="bg-emerald-600 text-white rounded-xl px-4 py-2 text-sm font-semibold text-center">🎉 Accepted — we'll be in touch!</div>
                            )}
                          </div>
                        );
                      })()}

                      {/* ── SLOT / ACTIVITY SUBMISSION DETAIL ── */}
                      {row.kind==="submission" && (() => {
                        const {item,isSlot}=row;
                        const status  = isSlot ? item.req.status       : item.interest.status;
                        const thread  = isSlot ? (item.req.thread||[]) : (item.interest.thread||[]);
                        const manNote = isSlot ? item.req.managerNote  : item.interest.managerNote;
                        const respBy  = isSlot ? item.req.respondedBy  : item.interest.respondedBy;
                        const respAt  = isSlot ? item.req.respondedAt  : item.interest.respondedAt;
                        const myMsg   = isSlot ? item.req.message      : item.interest.message;
                        const cardId  = row.id;
                        const lastMsg = thread.length>0?thread[thread.length-1]:null;
                        const awaitMyReply = status==="clarify"&&(!lastMsg||lastMsg.from!=="volunteer");
                        const slotDate = item.slot ? new Date(item.slot.date).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"}) : "";
                        return (
                          <div className="space-y-2">
                            {/* Slot/act meta */}
                            <div className="flex flex-wrap gap-1.5 text-xs mb-1">
                              <span className="bg-slate-100 text-slate-600 px-2 py-0.5 rounded-lg">{item.slot?.label||item.slotKey}{slotDate&&" · "+slotDate}</span>
                              {!isSlot&&item.act&&<span className="bg-violet-50 text-violet-600 px-2 py-0.5 rounded-lg">📌 {item.act.name}</span>}
                              {isSlot&&item.req.requestedRole&&<span className="bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded-lg capitalize">As: {item.req.requestedRole}</span>}
                            </div>
                            {/* My message */}
                            {myMsg && (
                              <div className="flex gap-2 items-start">
                                <div className="w-6 h-6 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center text-xs font-bold flex-shrink-0">{currentUser.name[0]}</div>
                                <div className="flex-1 bg-indigo-50 border border-indigo-100 rounded-xl px-3 py-2 text-sm">
                                  <span className="text-xs font-semibold text-indigo-600 block mb-0.5">You</span>
                                  <span className="text-slate-700">{myMsg}</span>
                                </div>
                              </div>
                            )}
                            {/* Manager note */}
                            {manNote && respBy && (
                              <div className="flex gap-2 items-start flex-row-reverse">
                                <div className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold flex-shrink-0 ${respBy.role==="admin"?"bg-amber-100 text-amber-700":"bg-emerald-100 text-emerald-700"}`}>{(respBy.name||"?")[0]}</div>
                                <div className={`flex-1 rounded-xl px-3 py-2 text-sm border ${status==="accepted"?"bg-emerald-50 border-emerald-200":status==="rejected"?"bg-red-50 border-red-200":"bg-blue-50 border-blue-200"}`}>
                                  <div className="flex items-center gap-1.5 mb-0.5 flex-row-reverse">
                                    <span className={`text-xs font-bold ${respBy.role==="admin"?"text-amber-700":"text-emerald-700"}`}>{respBy.role==="admin"?"Admin":"Rota Lead"}{respBy.name?" · "+respBy.name:""}</span>
                                    {respAt&&<span className="text-xs text-slate-400 mr-auto">{new Date(respAt).toLocaleDateString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</span>}
                                  </div>
                                  <div className={`text-xs font-bold mb-1 ${status==="accepted"?"text-emerald-700":status==="rejected"?"text-red-600":"text-blue-700"}`}>
                                    {status==="accepted"?"✅ Accepted":status==="rejected"?"❌ Declined":"💬 Clarification requested"}
                                  </div>
                                  <p className="text-slate-700">{manNote}</p>
                                </div>
                              </div>
                            )}
                            {/* Thread */}
                            {thread.map((msg,i2)=>{
                              const isMe=msg.from==="volunteer";
                              return (
                                <div key={i2} className={`flex gap-2 items-start ${isMe?"":"flex-row-reverse"}`}>
                                  <div className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold flex-shrink-0 ${isMe?"bg-indigo-100 text-indigo-700":msg.role==="admin"?"bg-amber-100 text-amber-700":"bg-emerald-100 text-emerald-700"}`}>{(msg.name||"?")[0]}</div>
                                  <div className={`flex-1 rounded-xl px-3 py-2 text-sm border ${isMe?"bg-indigo-50 border-indigo-100":"bg-blue-50 border-blue-200"}`}>
                                    <span className={`text-xs font-semibold block mb-0.5 ${isMe?"text-indigo-600":"text-blue-700"}`}>{isMe?"You":msg.name} <span className="ml-1 text-slate-400 font-normal">{new Date(msg.createdAt).toLocaleDateString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</span></span>
                                    {msg.text}
                                  </div>
                                </div>
                              );
                            })}
                            {/* Reply box */}
                            {awaitMyReply && (
                              <div className="bg-blue-50 border border-blue-200 rounded-xl p-3 space-y-2">
                                <p className="text-xs font-bold text-blue-700">💬 Reply to clarification</p>
                                <textarea value={replyText[cardId]||""} onChange={e=>setReplyText(p=>({...p,[cardId]:e.target.value}))}
                                  rows={2} placeholder="Type your reply here…"
                                  className="w-full border border-blue-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300 resize-none bg-white"/>
                                <button onClick={()=>sendReply(item.type==="slot"?"slot":"act", item.slotKey, isSlot?item.req.id:item.actId, cardId)}
                                  className="w-full bg-blue-600 hover:bg-blue-700 text-white rounded-lg py-2 text-sm font-bold">Send Reply</button>
                              </div>
                            )}
                            {status==="clarify"&&lastMsg&&lastMsg.from==="volunteer"&&(
                              <div className="text-center text-xs text-blue-600 font-semibold py-1">⏳ Reply sent — waiting for response</div>
                            )}
                            {status==="accepted"&&!manNote&&(
                              <div className="bg-emerald-600 text-white rounded-xl px-4 py-2 text-sm font-semibold text-center">🎉 Confirmed — see you there!</div>
                            )}
                          </div>
                        );
                      })()}

                      </div>{/* /px-4 py-4 */}
                    </div>
                  )}{/* /isOpen */}

                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* Empty state */}
      {openRequests.length === 0 && allMyItems.length === 0 && (
        <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-16 text-center text-slate-400">
          <div className="text-5xl mb-3">📭</div>
          <p className="text-lg font-semibold text-slate-500">No requests yet</p>
          <p className="text-sm mt-1">When Admin or a Rota Lead posts a help request it will appear here. You can also send your availability using the box above.</p>
        </div>
      )}
    </div>
  );
}

function VolOpenCard({ item, onRespond }) {
  const [note, setNote] = useState("");
  const [open, setOpen] = useState(false);
  const slotDate = item.slot ? new Date(item.slot.date).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"}) : "";
  return (
    <div className="bg-white rounded-2xl border-2 border-amber-300 shadow-sm overflow-hidden">
      <div className="px-5 py-4 flex items-start gap-3">
        <div className="w-10 h-10 rounded-xl bg-amber-100 text-amber-700 flex items-center justify-center text-xl flex-shrink-0">🙌</div>
        <div className="flex-1 min-w-0">
          <div className="font-bold text-slate-800">{item.act?.name||item.actId}</div>
          <div className="text-sm text-slate-600 mt-0.5">{item.slot?.isSpecial?"⭐ ":""}{item.slot?.label||item.slotKey}</div>
          <div className="text-xs text-slate-400 mt-0.5">📅 {slotDate}</div>
        </div>
        <span className="flex-shrink-0 text-xs bg-amber-100 text-amber-700 border border-amber-200 px-2 py-0.5 rounded-full font-bold">Help Needed</span>
      </div>
      {!open ? (
        <div className="px-5 pb-4">
          <button onClick={()=>setOpen(true)} className="w-full bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl py-2 text-sm font-bold">
            ✋ I can help — respond
          </button>
        </div>
      ) : (
        <div className="px-5 pb-4 space-y-2">
          <textarea value={note} onChange={e=>setNote(e.target.value)} rows={2} autoFocus
            placeholder="Add a note (optional) — e.g. happy to help, free all day…"
            className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 resize-none bg-white"/>
          <div className="flex gap-2">
            <button onClick={()=>onRespond(item.slotKey, item.actId, item.act?.name||item.actId, note)}
              className="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl py-2 text-sm font-bold">Send Response</button>
            <button onClick={()=>setOpen(false)}
              className="px-4 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl py-2 text-sm font-semibold">Cancel</button>
          </div>
        </div>
      )}
    </div>
  );
}


// ─── Requests Inbox ──────────────────────────────────────────────────────────

function RequestsInbox({ rotas, upRotas, allSlots, members, upMembers, activities, generalOffers, upGeneralOffers, showToast, currentUser, isAdmin, canManage=true }) {
  // canManage = admin or rota-lead (both see action panel)
  // isAdmin distinguishes admin from rota-lead for display only
  const [filter, setFilter]       = useState("all");
  const [expandedId, setExpandedId] = useState(null);
  const [replyNote, setReplyNote]   = useState({});  // manager's note per card
  const [assignRole, setAssignRole] = useState({});

  const getSlot = key => allSlots.find(s => s.key === key);
  const getAct  = id  => activities.find(a => a.id === id);
  const getMember = id => members.find(m => m.id === id);

  // Gather ALL requests across every rota + general offers
  const allRequests = [];
  Object.entries(rotas).forEach(([slotKey, r]) => {
    (r.slotRequests||[]).forEach(req => {
      allRequests.push({ type:"slot", slotKey, req, rota:r });
    });
    Object.entries(r.actInterest||{}).forEach(([actId, interest]) => {
      allRequests.push({ type:"activity", slotKey, actId, interest, rota:r });
    });
  });
  (generalOffers||[]).filter(o => !isSwap(o)).forEach(offer => {
    allRequests.push({ type:"offer", offer });
  });

  // Sort newest first
  allRequests.sort((a,b) => {
    const aT = a.type==="slot" ? a.req.createdAt : a.type==="activity" ? a.interest.createdAt||"" : a.offer.createdAt;
    const bT = b.type==="slot" ? b.req.createdAt : b.type==="activity" ? b.interest.createdAt||"" : b.offer.createdAt;
    return bT.localeCompare(aT);
  });

  const getStatus = item => item.type==="slot" ? item.req.status : item.type==="activity" ? item.interest.status : item.offer.status;

  const filtered = filter === "all" ? allRequests : allRequests.filter(x => getStatus(x) === filter);

  const counts = { pending:0, clarify:0, accepted:0, rejected:0, seen:0 };
  allRequests.forEach(x => { const s = getStatus(x); if (counts[s] !== undefined) counts[s]++; });

  const actOffer = (offerId, action, note) => {
    const by  = { memberId: currentUser?.memberId||"admin", name: currentUser?.name||"Admin", role: isAdmin?"admin":"rota-lead" };
    const now = new Date().toISOString();
    const trimNote = (note||"").trim();
    if (action === "clarify" && !trimNote) { showToast("Please write a clarification note first","error"); return; }
    upGeneralOffers((generalOffers||[]).map(o => {
      if (o.id !== offerId) return o;
      if (action === "accept") return {...o, status:"accepted", managerNote:trimNote||o.managerNote||"", respondedBy:by, respondedAt:now};
      if (action === "reject") return {...o, status:"rejected", managerNote:trimNote||o.managerNote||"", respondedBy:by, respondedAt:now};
      if (action === "clarify") {
        const threadMsg = { from:"manager", role:by.role, memberId:by.memberId, name:by.name, text:trimNote, createdAt:now };
        // First clarify goes into managerNote; subsequent ones append to thread
        const newThread = o.managerNote ? [...(o.thread||[]), threadMsg] : (o.thread||[]);
        return {...o, status:"clarify", managerNote:o.managerNote||trimNote, thread:newThread, respondedBy:by, respondedAt:now};
      }
      return o;
    }));
    if (action==="accept") showToast("General request accepted");
    else if (action==="reject") showToast("General request declined");
    else showToast("Clarification sent to volunteer");
  };

  const STATUS_PILL  = { pending:"bg-amber-100 text-amber-700 border-amber-200", accepted:"bg-emerald-100 text-emerald-700 border-emerald-200", rejected:"bg-red-100 text-red-600 border-red-200", clarify:"bg-blue-100 text-blue-700 border-blue-200", seen:"bg-slate-100 text-slate-500 border-slate-200" };
  const STATUS_LABEL = { pending:"⏳ Pending", accepted:"✅ Accepted", rejected:"❌ Rejected", clarify:"💬 Clarify sent", seen:"👀 Seen" };
  const BORDER_CLS   = { pending:"border-amber-200", accepted:"border-emerald-200", rejected:"border-red-200", clarify:"border-blue-300", seen:"border-slate-100" };

  const respondedByLabel = (respondedBy) => {
    if (!respondedBy) return "";
    const m = getMember(respondedBy.memberId);
    const name = m ? m.name : respondedBy.name || "Someone";
    const rLabel = respondedBy.role === "admin" ? "Admin" : respondedBy.role === "rota-lead" ? "Rota Lead" : name;
    return rLabel;
  };

  // ── Slot request actions ──────────────────────────────────────────────────
  const actSlotReq = (slotKey, reqId, action) => {
    const note = (replyNote[reqId]||"").trim();
    const by   = { memberId: currentUser?.memberId||"admin", name: currentUser?.name||"Admin", role: isAdmin?"admin":"rota-lead" };
    const now  = new Date().toISOString();
    if (action === "clarify" && !note) { showToast("Please write a clarification note first","error"); return; }
    upRotas(prev => {
      const r   = prev[slotKey]||{};
      const req = (r.slotRequests||[]).find(x => x.id === reqId);
      if (!req) return prev;
      let updated;
      if (action === "accept") {
        const role = assignRole[reqId] || req.requestedRole;
        const mId  = req.memberId;
        const newReqs = (r.slotRequests||[]).map(x => x.id===reqId
          ? {...x, status:"accepted", assignedRole:role, managerNote:note||x.managerNote||"", respondedBy:by, respondedAt:now} : x);
        let patch = { slotRequests: newReqs };
        if (role==="primary") patch.primary   = [...new Set([...(r.primary||[]),   mId])];
        else                  patch.secondary = [...new Set([...(r.secondary||[]), mId])];
        if (req.activityId)   patch.actOwners = {...(r.actOwners||{}), [req.activityId]: mId};
        updated = {...prev, [slotKey]:{...r, ...patch}};
      } else if (action === "reject") {
        updated = {...prev, [slotKey]:{...r, slotRequests:(r.slotRequests||[]).map(x => x.id===reqId
          ? {...x, status:"rejected", managerNote:note||x.managerNote||"", respondedBy:by, respondedAt:now} : x)}};
      } else {
        const threadMsg = { from:"manager", role:by.role, memberId:by.memberId, name:by.name, text:note, createdAt:now };
        updated = {...prev, [slotKey]:{...r, slotRequests:(r.slotRequests||[]).map(x => {
          if (x.id !== reqId) return x;
          const newThread = x.managerNote ? [...(x.thread||[]), threadMsg] : [];
          return {...x, status:"clarify", managerNote:x.managerNote||note, thread:newThread, respondedBy:by, respondedAt:now};
        })}};
      }
      return updated;
    });
    if (action==="accept") showToast("Request accepted");
    else if (action==="reject") showToast("Request declined");
    else showToast("Clarification sent to volunteer");
    setReplyNote(p => ({...p, [reqId]:""}));
  };

  // ── Activity interest actions ─────────────────────────────────────────────
  const actActInterest = (slotKey, actId, action) => {
    const note = (replyNote[slotKey+actId]||"").trim();
    const by   = { memberId: currentUser?.memberId||"admin", name: currentUser?.name||"Admin", role: isAdmin?"admin":"rota-lead" };
    const now  = new Date().toISOString();
    if (action === "clarify" && !note) { showToast("Please write a clarification note first","error"); return; }
    upRotas(prev => {
      const r        = prev[slotKey]||{};
      const interest = (r.actInterest||{})[actId];
      if (!interest) return prev;
      let updated;
      if (action === "accept") {
        const role = assignRole[slotKey+actId] || "secondary";
        const mId  = interest.memberId;
        let patch = {
          actOwners:   {...(r.actOwners||{}),   [actId]: mId},
          actInterest: {...(r.actInterest||{}), [actId]: {...interest, status:"accepted", managerNote:note||interest.managerNote||"", respondedBy:by, respondedAt:now}},
        };
        if (role==="primary") patch.primary   = [...new Set([...(r.primary||[]),   mId])];
        else                  patch.secondary = [...new Set([...(r.secondary||[]), mId])];
        updated = {...prev, [slotKey]:{...r, ...patch}};
      } else if (action === "reject") {
        updated = {...prev, [slotKey]:{...r, actInterest:{...(r.actInterest||{}),
          [actId]:{...interest, status:"rejected", managerNote:note||interest.managerNote||"", respondedBy:by, respondedAt:now}}}};
      } else {
        const threadMsg = { from:"manager", role:by.role, memberId:by.memberId, name:by.name, text:note, createdAt:now };
        const newThread = interest.managerNote ? [...(interest.thread||[]), threadMsg] : [];
        updated = {...prev, [slotKey]:{...r, actInterest:{...(r.actInterest||{}),
          [actId]:{...interest, status:"clarify", managerNote:interest.managerNote||note, thread:newThread, respondedBy:by, respondedAt:now}}}};
      }
      return updated;
    });
    if (action==="accept") showToast("Activity request accepted");
    else if (action==="reject") showToast("Request declined");
    else showToast("Clarification sent to volunteer");
    setReplyNote(p => ({...p, [slotKey+actId]:""}));
  };
  const FILTER_TABS = [
    { key:"all",      label:"All",         count: allRequests.length },
    { key:"pending",  label:"⏳ Pending",  count: counts.pending },
    { key:"clarify",  label:"💬 Clarify",  count: counts.clarify },
    { key:"accepted", label:"✅ Accepted", count: counts.accepted },
    { key:"rejected", label:"❌ Rejected", count: counts.rejected },
    { key:"seen",     label:"👀 Seen",     count: counts.seen },
  ];

  var pendingMembers = (members||[]).filter(function(m){ return m.approved === false; });
  var rejectedMembers = (members||[]).filter(function(m){ return m.approved === "rejected"; });

  var approveMember = function(id) {
    var updated = members.map(function(m){ return m.id===id ? {...m, approved:true} : m; });
    upMembers(updated);
    showToast("Member approved — they can now sign in");
  };
  var declineMember = function(id) {
    var updated = members.map(function(m){ return m.id===id ? {...m, approved:"rejected"} : m; });
    upMembers(updated);
    showToast("Registration declined");
  };

  return (
    <div className="space-y-4 max-w-4xl">

      {/* ── Registration Requests (admin only) ── */}
      {isAdmin && (pendingMembers.length > 0 || rejectedMembers.length > 0) && (
        <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
          <div className="px-5 py-3 border-b border-slate-100 bg-amber-50 flex items-center justify-between">
            <div className="flex items-center gap-2">
              <span className="text-lg">👤</span>
              <span className="font-bold text-slate-800">Registration Requests</span>
              {pendingMembers.length > 0 && <span className="bg-amber-500 text-white text-xs font-bold px-2 py-0.5 rounded-full">{pendingMembers.length} pending</span>}
            </div>
          </div>
          <div className="divide-y divide-slate-100">
            {pendingMembers.map(function(m) {
              return (
                <div key={m.id} className="px-5 py-4 flex items-start gap-4 bg-amber-50">
                  <div className="w-10 h-10 rounded-full bg-amber-200 text-amber-800 flex items-center justify-center font-bold text-sm flex-shrink-0">
                    {m.name.charAt(0).toUpperCase()}
                  </div>
                  <div className="flex-1 min-w-0">
                    <div className="font-bold text-slate-800">{m.name}</div>
                    <div className="text-xs text-slate-500 mt-0.5">{m.email}</div>
                    <div className="flex flex-wrap gap-3 text-xs text-slate-400 mt-1">
                      {m.phone && <span>📱 {m.phone}</span>}
                      {(m.area||m.city) && <span>📍 {[m.area,m.city].filter(Boolean).join(", ")}</span>}
                    </div>
                    <div className="text-xs text-amber-600 mt-1 font-medium">⏳ Pending approval</div>
                  </div>
                  <div className="flex gap-2 flex-shrink-0">
                    <button onClick={function(){approveMember(m.id);}}
                      className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg">✓ Approve</button>
                    <button onClick={function(){declineMember(m.id);}}
                      className="bg-red-50 hover:bg-red-100 border border-red-200 text-red-600 text-xs font-bold px-3 py-1.5 rounded-lg">✗ Decline</button>
                  </div>
                </div>
              );
            })}
            {rejectedMembers.map(function(m) {
              return (
                <div key={m.id} className="px-5 py-4 flex items-start gap-4 bg-red-50">
                  <div className="w-10 h-10 rounded-full bg-red-200 text-red-800 flex items-center justify-center font-bold text-sm flex-shrink-0">
                    {m.name.charAt(0).toUpperCase()}
                  </div>
                  <div className="flex-1 min-w-0">
                    <div className="font-bold text-slate-800">{m.name}</div>
                    <div className="text-xs text-slate-500 mt-0.5">{m.email}</div>
                    <div className="text-xs text-red-500 mt-1 font-medium">✗ Declined</div>
                  </div>
                  <button onClick={function(){approveMember(m.id);}}
                    className="bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 text-emerald-700 text-xs font-bold px-3 py-1.5 rounded-lg flex-shrink-0">↩ Approve</button>
                </div>
              );
            })}
          </div>
        </div>
      )}


      {/* ── Help Wanted flags raised by Rota Lead ── */}
      {(function(){
        var today0 = new Date(); today0.setHours(0,0,0,0);
        var hwItems = [];
        Object.entries(rotas).forEach(function(entry){
          var slotKey = entry[0]; var r = entry[1];
          var slot = allSlots.find(function(s){return s.key===slotKey;});
          if (!slot || new Date(slot.date) < today0) return;
          (r.helpWanted||[]).forEach(function(actId){
            var act = activities.find(function(a){return a.id===actId;});
            var interest = (r.actInterest||{})[actId];
            hwItems.push({slotKey, slot, actId, act, r, interest});
          });
        });
        hwItems.sort(function(a,b){return new Date(a.slot.date)-new Date(b.slot.date);});
        if (hwItems.length===0) return null;
        return (
          <div className="bg-white rounded-2xl border border-amber-200 shadow-sm overflow-hidden">
            <div className="px-5 py-3 border-b border-amber-100 bg-amber-50 flex items-center gap-2">
              <span className="text-lg">🙌</span>
              <span className="font-bold text-slate-800">Help Wanted — Raised by Rota Lead</span>
              <span className="bg-amber-500 text-white text-xs font-bold px-2 py-0.5 rounded-full ml-1">{hwItems.length}</span>
            </div>
            <div className="divide-y divide-slate-100">
              {hwItems.map(function(item){
                var d = new Date(item.slot.date);
                var dateStr = d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
                var interest = item.interest;
                return (
                  <div key={item.slotKey+item.actId} className="px-5 py-3 flex items-center gap-4">
                    <div className="flex-1 min-w-0">
                      <div className="font-semibold text-slate-800 text-sm">{item.act ? item.act.name : item.actId}</div>
                      <div className="text-xs text-slate-400 mt-0.5">{item.slot.label} · 📅 {dateStr}</div>
                    </div>
                    {interest ? (
                      <div className="flex items-center gap-2 flex-shrink-0">
                        <span className={"text-xs font-bold px-2.5 py-1 rounded-full "+(interest.status==="pending"?"bg-amber-100 text-amber-700":interest.status==="accepted"?"bg-emerald-100 text-emerald-700":"bg-slate-100 text-slate-500")}>
                          {interest.status==="pending"?"⏳ "+interest.name+" responded":interest.status==="accepted"?"✓ "+interest.name+" confirmed":"⚠ "+interest.status}
                        </span>
                        {interest.status==="pending" && (
                          <div className="flex gap-1">
                            <button onClick={function(){actActInterest(item.slotKey, item.actId, "accept");}}
                              className="text-xs bg-emerald-600 hover:bg-emerald-700 text-white px-2.5 py-1 rounded-lg font-semibold">✓ Accept</button>
                            <button onClick={function(){actActInterest(item.slotKey, item.actId, "reject");}}
                              className="text-xs bg-red-100 hover:bg-red-200 text-red-600 px-2.5 py-1 rounded-lg font-semibold">✕</button>
                          </div>
                        )}
                      </div>
                    ) : (
                      <span className="text-xs text-slate-400 flex-shrink-0 italic">Waiting for volunteer response</span>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        );
      })()}

      {/* Header */}
      <div className="flex flex-wrap items-center gap-3">
        <div>
          <h2 className="text-xl font-bold text-slate-800">📬 Volunteer Requests</h2>
          <p className="text-sm text-slate-500 mt-0.5">Click any row to expand — respond then collapse</p>
        </div>
        {counts.pending > 0 && (
          <span className="ml-auto bg-red-500 text-white text-sm font-bold px-3 py-1 rounded-full">
            {counts.pending} pending
          </span>
        )}
      </div>

      {/* Filter tabs */}
      <div className="flex gap-2 flex-wrap">
        {FILTER_TABS.map(f => (
          <button key={f.key} onClick={() => { setFilter(f.key); setExpandedId(null); }}
            className={`text-xs px-3 py-1.5 rounded-full font-semibold border transition-colors
              ${filter===f.key ? "bg-indigo-600 text-white border-indigo-600" : "bg-white border-slate-200 text-slate-600 hover:bg-slate-50"}`}>
            {f.label}
            {f.count > 0 && <span className={`ml-1.5 px-1.5 py-0.5 rounded-full text-xs font-bold ${filter===f.key?"bg-white bg-opacity-20":"bg-slate-100 text-slate-500"}`}>{f.count}</span>}
          </button>
        ))}
      </div>

      {/* Empty state */}
      {filtered.length === 0 && (
        <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-16 text-center">
          <div className="text-5xl mb-3">📭</div>
          <p className="text-lg font-semibold text-slate-500">No {filter==="all"?"requests":filter+" requests"}</p>
          <p className="text-sm text-slate-400 mt-1">Volunteer requests will appear here when submitted</p>
        </div>
      )}

      {/* Request list */}
      <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
        {filtered.map((item, idx) => {
          const slot      = getSlot(item.slotKey);
          const slotLabel = slot ? slot.label : (item.slotKey||"");
          const slotDate  = slot ? new Date(slot.date).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}) : "";
          const status    = getStatus(item);
          const cardId    = item.type==="slot" ? item.req.id : item.type==="activity" ? item.slotKey+item.actId : item.offer.id;
          const isOpen    = expandedId === cardId;
          const isLast    = idx === filtered.length - 1;

          // ── derive display fields ──
          let name="", typeLabel="", typeIcon="", subLabel="", hasReply=false;
          if (item.type==="slot") {
            name=item.req.name; typeLabel="Slot Join"; typeIcon="🙋";
            subLabel=slotLabel+(slotDate?" · "+slotDate:"");
            const t=item.req.thread||[];
            hasReply = status==="pending" && t.length>0 && t[t.length-1].from==="volunteer";
          } else if (item.type==="activity") {
            const act=getAct(item.actId);
            name=item.interest.name; typeLabel=act?act.name:"Activity"; typeIcon="📌";
            subLabel=slotLabel+(slotDate?" · "+slotDate:"");
            const t=item.interest.thread||[];
            hasReply = status==="pending" && t.length>0 && t[t.length-1].from==="volunteer";
          } else {
            name=item.offer.name; typeLabel="General Availability"; typeIcon="📣";
            subLabel=item.offer.message?.slice(0,60)+(item.offer.message?.length>60?"…":"");
            const t=item.offer.thread||[];
            hasReply = status==="pending" && t.length>0 && t[t.length-1].from==="volunteer";
          }

          const createdAt = item.type==="slot" ? item.req.createdAt : item.type==="activity" ? item.interest.createdAt : item.offer.createdAt;

          return (
            <div key={cardId} className={`${!isLast?"border-b border-slate-100":""}`}>

              {/* ── Compact list row ── */}
              {!isOpen && (
                <button onClick={() => setExpandedId(cardId)}
                  className="w-full text-left px-4 py-3 flex items-center gap-3 hover:bg-slate-50 transition-colors group">
                  {/* Avatar */}
                  <div className={`w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs flex-shrink-0
                    ${item.type==="slot"?"bg-indigo-100 text-indigo-700":item.type==="activity"?"bg-violet-100 text-violet-700":"bg-pink-100 text-pink-700"}`}>
                    {(name||"?")[0].toUpperCase()}
                  </div>
                  {/* Name */}
                  <span className="font-semibold text-slate-800 text-sm w-32 flex-shrink-0 truncate">{name}</span>
                  {/* Type badge */}
                  <span className={`text-xs px-2 py-0.5 rounded-full font-medium flex-shrink-0 hidden sm:inline-block
                    ${item.type==="slot"?"bg-indigo-50 text-indigo-600":item.type==="activity"?"bg-violet-50 text-violet-600":"bg-pink-50 text-pink-600"}`}>
                    {typeIcon} {typeLabel}
                  </span>
                  {/* Sub-label */}
                  <span className="text-xs text-slate-500 flex-1 min-w-0 truncate hidden md:block">{subLabel}</span>
                  {/* Status pill */}
                  <span className={`text-xs px-2 py-0.5 rounded-full font-semibold border flex-shrink-0 ${STATUS_PILL[status]||STATUS_PILL.pending}`}>
                    {hasReply ? "💬 Replied" : (STATUS_LABEL[status]||"⏳ Pending")}
                  </span>
                  {/* Date */}
                  {createdAt && <span className="text-xs text-slate-400 flex-shrink-0 hidden lg:block">{new Date(createdAt).toLocaleDateString("en-GB",{day:"numeric",month:"short"})}</span>}
                  {/* Expand hint */}

function MyRotaSlotRow({ item, isPast, today, onSelectSlot }) {
  const { slot, roles } = item;
  const d        = new Date(slot.date);
  const diffDays = Math.floor((d - today) / 86400000);
  const isNow    = diffDays >= 0 && diffDays < 7;
  const dateStr  = d.toLocaleDateString("en-GB", { weekday:"short", day:"numeric", month:"short", year:"numeric" });
  return (
    <div onClick={() => !isPast && onSelectSlot(slot.key)}
      className={`flex items-center gap-3 px-4 py-3 rounded-xl border transition-all
        ${isPast  ? "bg-slate-50 border-slate-100 opacity-40 cursor-default"
        : isNow   ? "bg-indigo-50 border-indigo-300 hover:bg-indigo-100 cursor-pointer"
                  : "bg-white border-slate-200 hover:border-indigo-200 hover:bg-slate-50 cursor-pointer"}`}>
      <div className={`flex-shrink-0 w-11 rounded-xl py-2 text-center ${isPast?"bg-slate-100":isNow?"bg-indigo-600":"bg-slate-100"}`}>
        <div className={`text-sm font-black leading-none ${isPast?"text-slate-400":isNow?"text-white":"text-slate-700"}`}>{d.getDate()}</div>
        <div className={`text-xs font-semibold ${isPast?"text-slate-400":isNow?"text-indigo-200":"text-slate-500"}`}>
          {d.toLocaleDateString("en-GB",{month:"short"})}
        </div>
      </div>
      <div className="flex-1 min-w-0">
        <div className="flex items-center gap-2 flex-wrap">
          <span className={`text-sm font-semibold truncate ${isPast?"text-slate-400":"text-slate-800"}`}>
            {slot.isSpecial?"⭐ ":""}{slot.label}
          </span>
          {isNow && !isPast && <span className="text-xs bg-indigo-600 text-white px-2 py-0.5 rounded-full font-bold shrink-0">This week</span>}
        </div>
        <div className={`text-xs mt-0.5 ${isPast?"text-slate-400":"text-slate-500"}`}>{dateStr}</div>
        <div className="flex flex-wrap gap-1 mt-1.5">
          {roles.map((r,i) => (
            <span key={i} className={`text-xs px-2 py-0.5 rounded-full border font-semibold ${MYROTA_PILL[r.color]}`}>{r.label}</span>
          ))}
        </div>
      </div>
      {!isPast && <span className="text-slate-300 text-lg shrink-0">›</span>}
    </div>
  );
}

// ─── My Rota View ────────────────────────────────────────────────────────────
function MyRotaView({ allSlots, rotas, members, activities, config, currentUser, isAdmin, today, onSelectSlot }) {

  const sortedMembers = [...members].sort((a,b) => a.name.localeCompare(b.name));

  // For admin: start with first member; for volunteer: start empty (resolved below)
  const [adminPickId, setAdminPickId] = useState(sortedMembers[0]?.id || "");

  // Keep admin default in sync when members first load
  useEffect(() => {
    if (isAdmin && !adminPickId && sortedMembers.length > 0) setAdminPickId(sortedMembers[0].id);
  }, [members.length]);

  // Resolve volunteer's member record by memberId then by name
  const volunteerMember = (() => {
    if (!currentUser) return null;
    // Try direct ID match
    const byId = members.find(m => m.id === currentUser.memberId);
    if (byId) return byId;
    // Fallback: case-insensitive name match
    return members.find(m => m.name.trim().toLowerCase() === (currentUser.name||"").trim().toLowerCase()) || null;
  })();

  const selectedId  = isAdmin ? adminPickId : (volunteerMember?.id || "");

  const getAct = id => activities.find(a => a.id === id);
  const viewMember = members.find(m => m.id === selectedId);

  // Build slot list for any memberId
  const buildSlots = (mid) => {
    if (!mid) return [];
    return allSlots.map(slot => {
      const r = rotas[slot.key] || {};
      const roles = [];
      if (r.lead === mid)
        roles.push({ label: "🎯 Rota Lead", color: "indigo" });
      else if ((r.primary||[]).includes(mid))
        roles.push({ label: "🎯 Rota Lead", color: "indigo" });
      if ((r.secondary||[]).includes(mid))
        roles.push({ label: "🟣 Secondary", color: "violet" });
      Object.entries(r.actOwners||{}).forEach(([actId, ownerId]) => {
        if (ownerId === mid) {
          const act = getAct(actId);
          roles.push({ label: `📌 ${act?.name||"Activity"}`, color: "emerald" });
        }
      });
      (r.slotRequests||[]).forEach(req => {
        if (req.memberId === mid && req.status === "accepted")
          roles.push({ label: `✅ ${req.assignedRole||req.requestedRole}`, color: "green" });
      });
      return roles.length ? { slot, rota: r, roles } : null;
    }).filter(Boolean);
  };

  const allMySlots = buildSlots(selectedId);
  const upcoming   = allMySlots.filter(x => new Date(x.slot.date) >= today);
  const past       = allMySlots.filter(x => new Date(x.slot.date) <  today).reverse();

  const PILL = {
    indigo:  "bg-indigo-100 text-indigo-700 border-indigo-200",
    blue:    "bg-blue-100 text-blue-700 border-blue-200",
    violet:  "bg-violet-100 text-violet-700 border-violet-200",
    emerald: "bg-emerald-100 text-emerald-700 border-emerald-200",
    green:   "bg-green-100 text-green-700 border-green-200",
  };

  // SlotRow is defined below as top-level function MyRotaSlotRow

  const displayName = viewMember?.name || currentUser?.name || "—";

  return (
    <div className="max-w-2xl space-y-4">

      {/* Header card */}
      <div className="bg-white rounded-2xl border border-slate-200 shadow-sm px-5 py-4 space-y-4">
        <div className="flex items-center gap-3">
          <div className={`w-11 h-11 rounded-full flex items-center justify-center font-black text-lg text-white shrink-0
            ${viewMember?.role==="primary"?"bg-indigo-600":"bg-violet-500"}`}>
            {displayName[0]?.toUpperCase()||"?"}
          </div>
          <div className="flex-1 min-w-0">
            <h2 className="text-base font-bold text-slate-800 truncate">{displayName}'s Rota — {config.year}</h2>
            <p className="text-xs text-slate-500 mt-0.5">
              <span className="font-semibold text-indigo-600">{upcoming.length}</span> upcoming &nbsp;·&nbsp;
              <span className="text-slate-400">{past.length} past</span> &nbsp;·&nbsp; {allMySlots.length} total
              {viewMember && <span className="ml-2 text-xs bg-slate-100 text-slate-500 px-2 py-0.5 rounded-full">{roleLabel(viewMember.role)}</span>}
            </p>
          </div>
        </div>

        {/* Admin member picker */}
        {isAdmin && (
          <div className="border-t border-slate-100 pt-3">
            <p className="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-2">View rota for</p>
            <div className="flex flex-wrap gap-1.5">
              {sortedMembers.map(m => (
                <button key={m.id} onClick={() => setAdminPickId(m.id)}
                  className={`text-xs px-3 py-1.5 rounded-xl border font-semibold transition-colors
                    ${selectedId===m.id
                      ? (m.role==="primary"?"bg-indigo-600 text-white border-indigo-600":"bg-violet-500 text-white border-violet-500")
                      : "bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100"}`}>
                  {m.role==="primary"?"🔵":"🟣"} {m.name}
                </button>
              ))}
            </div>
          </div>
        )}
      </div>

      {/* Volunteer not found in members list */}
      {!isAdmin && !selectedId && (
        <div className="bg-amber-50 border border-amber-200 rounded-2xl p-6 text-center">
          <div className="text-3xl mb-2">⚠️</div>
          <p className="font-semibold text-amber-800">Name not found in member list</p>
          <p className="text-sm text-amber-600 mt-1">Ask your admin to add you as a member so your rota appears here.</p>
        </div>
      )}

      {/* No assignments */}
      {selectedId && allMySlots.length === 0 && (
        <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-10 text-center">
          <div className="text-4xl mb-2">📭</div>
          <p className="font-semibold text-slate-500">No assignments found</p>
          <p className="text-sm text-slate-400 mt-1">{displayName} hasn't been assigned to any slots this year.</p>
        </div>
      )}

      {/* Upcoming */}
      {upcoming.length > 0 && (
        <div className="space-y-2">
          <p className="text-xs font-bold text-slate-500 uppercase tracking-wider px-1">Upcoming — {upcoming.length}</p>
          {upcoming.map(item => <MyRotaSlotRow key={item.slot.key} item={item} isPast={false} today={today} onSelectSlot={onSelectSlot}/>)}
        </div>
      )}

      {/* Past */}
      {past.length > 0 && (
        <div className="space-y-2">
          <p className="text-xs font-bold text-slate-400 uppercase tracking-wider px-1">Past — {past.length}</p>
          {past.map(item => <MyRotaSlotRow key={item.slot.key} item={item} isPast={true} today={today} onSelectSlot={onSelectSlot}/>)}
        </div>
      )}
    </div>
  );
}

function RotaDetail({ slot, rota, members, activities, config, onSave, onRemove, showToast, isAdmin=false, isRotaLead=false, currentUser=null, priests=[], prasadham=[] }) {
  const buildActOwners = function(r, acts) {
    var existing = r.actOwners || {};
    var hasAny = Object.keys(existing).some(function(k){ return existing[k]; });
    if (hasAny) return existing;
    if (!r.lead) return existing;
    var filled = {};
    (acts||[]).forEach(function(a){ filled[a.id] = r.lead; });
    return filled;
  };
  const [local, setLocal] = useState({lead:"", primary:[], secondary:[], actOwners:{}, helpWanted:[], notes:"", priestId:(rota.priestId||(priests.find(function(p){return p.isDefault;})||priests[0]||{}).id||""), prasadhamId:rota.prasadhamId||"", ...rota, actOwners:buildActOwners(rota,activities)});
  // Volunteer join-request state — declared at top level (Rules of Hooks)
  const [showJoin, setShowJoin] = useState(false);
  const [joinRole, setJoinRole] = useState("secondary");
  const [joinMsg,  setJoinMsg]  = useState("");

  useEffect(()=>{ setLocal({lead:"",primary:[],secondary:[],actOwners:{},helpWanted:[],priestId:(rota.priestId||(priests.find(function(p){return p.isDefault;})||priests[0]||{}).id||""),prasadhamId:rota.prasadhamId||"",...rota,actOwners:buildActOwners(rota,activities)}); setShowJoin(false); setJoinMsg(""); },[rota,slot.key]);

  const toggle = (type, id) => {
    const arr = local[type]||[];
    setLocal({...local, [type]: arr.includes(id)?arr.filter(x=>x!==id):[...arr,id]});
  };
  const setActOwner = (aId, mId) => setLocal({...local, actOwners:{...(local.actOwners||{}), [aId]:mId}});
  const name = id => members.find(m=>m.id===id)?.name||"—";

  const primaries  = members.filter(m=>m.role==="primary");
  const secondaries= members.filter(m=>m.role==="secondary");

  // Is the logged-in Rota Lead assigned to THIS slot?
  const myId = currentUser ? currentUser.memberId : null;
  const isMySlot = myId && (
    rota.lead === myId ||
    (rota.primary||[]).includes(myId)
  );

  // ── Volunteer read-only view ──────────────────────────────────────────────
  if (!isAdmin && !(isRotaLead && isMySlot)) {
    const lead      = rota.lead ? members.find(m=>m.id===rota.lead) : null;
    const secList   = (rota.secondary||[]).map(id=>members.find(m=>m.id===id)).filter(Boolean);
    const actOwnersSet = Object.values(rota.actOwners||{}).some(Boolean);

    const mySlotReq = currentUser ? (rota.slotRequests||[]).find(r=>r.memberId===currentUser.memberId) : null;

    const submitSlotRequest = () => {
      if (!currentUser) return;
      const req = { id: uid(), memberId: currentUser.memberId, name: currentUser.name,
                    requestedRole: joinRole, message: joinMsg.trim(),
                    status: "pending", createdAt: new Date().toISOString() };
      onSave({ slotRequests: [...(rota.slotRequests||[]), req] });
      setShowJoin(false); setJoinMsg("");
      showToast("Request submitted — awaiting admin approval");
    };

    const withdrawSlotReq = () => {
      onSave({ slotRequests: (rota.slotRequests||[]).filter(r=>r.memberId!==currentUser.memberId) });
      showToast("Request withdrawn");
    };

    // Help-wanted activities (flagged by admin)
    const helpWanted = activities.filter(a => (rota.helpWanted||[]).includes(a.id));

    return (
      <div className="space-y-4 fade-in">

        {/* Slot header */}
        <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-5">
          <h2 className="text-xl font-bold text-slate-800">{slot.isSpecial?"⭐ ":"📅 "}{slot.label}</h2>
          <p className="text-slate-500 text-sm mt-1">
            {new Date(slot.date).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}
            &nbsp;·&nbsp;{config.startTime} ({config.duration}h)&nbsp;·&nbsp;{config.location}
          </p>
          {slot.isSpecial && slot.tag && <span className="mt-2 inline-block text-xs bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full font-medium">{slot.tag}</span>}
        </div>

        {/* ── Help Wanted banner — only for non-Rota-Lead users ── */}
        {!isRotaLead && helpWanted.length > 0 && (
          <div className="bg-amber-50 border border-amber-300 rounded-2xl p-4">
            <div className="flex items-center gap-2 mb-2">
              <span className="text-xl">🙌</span>
              <h3 className="font-bold text-amber-800 text-sm">Volunteers Needed!</h3>
              <span className="ml-auto text-xs bg-amber-200 text-amber-800 px-2 py-0.5 rounded-full font-semibold">Admin request</span>
            </div>
            <p className="text-xs text-amber-700 mb-3">The Rota Lead is looking for help with the following activities. Tap "Volunteer →" to put your hand up.</p>
            <div className="space-y-1.5">
              {helpWanted.map(a => {
                const ownerId    = (rota.actOwners||{})[a.id];
                const interest   = (rota.actInterest||{})[a.id];
                const myInterest = interest && currentUser && interest.memberId === currentUser.memberId;
                const isFilled   = !!ownerId;
                return (
                  <div key={a.id} className={`flex items-center justify-between px-3 py-2 rounded-xl border text-sm
                    ${isFilled?"bg-emerald-50 border-emerald-200":myInterest?"bg-indigo-50 border-indigo-200":"bg-white border-amber-200"}`}>
                    <div>
                      <span className="font-semibold text-slate-800">{a.name}</span>
                      {isFilled && <span className="ml-2 text-xs text-emerald-600 font-semibold">✓ Filled</span>}
                      {!isFilled && myInterest && <span className={`ml-2 text-xs font-semibold ${interest.status==="accepted"?"text-emerald-600":"text-amber-600"}`}>{interest.status==="accepted"?"✓ Confirmed":"⏳ Pending"}</span>}
                      {!isFilled && !myInterest && interest && <span className="ml-2 text-xs text-amber-600">⏳ Someone's pending</span>}
                    </div>
                    {!isFilled && !interest && currentUser && (
                      <button onClick={()=>{
                        onSave({ actInterest: { ...(rota.actInterest||{}), [a.id]: { memberId: currentUser.memberId, name: currentUser.name, status: "pending", createdAt: new Date().toISOString() } } });
                        showToast(`Request sent for "${a.name}"`);
                      }} className="text-xs bg-amber-600 hover:bg-amber-700 text-white px-3 py-1.5 rounded-lg font-semibold flex-shrink-0 ml-2">
                        Volunteer →
                      </button>
                    )}
                    {myInterest && interest.status === "pending" && (
                      <button onClick={()=>{ const n={...(rota.actInterest||{})}; delete n[a.id]; onSave({actInterest:n}); showToast("Withdrawn"); }}
                        className="text-xs bg-slate-200 hover:bg-slate-300 text-slate-600 px-3 py-1.5 rounded-lg font-semibold flex-shrink-0 ml-2">Withdraw</button>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* ── Request to join this rota — only for non-Rota-Lead users ── */}
        {!isRotaLead && (
        <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-5">
          <h3 className="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3">🙋 Join This Rota</h3>
          {mySlotReq ? (
            <div className={`rounded-xl border px-4 py-3 space-y-2
              ${mySlotReq.status==="pending"?"bg-amber-50 border-amber-200":mySlotReq.status==="accepted"?"bg-emerald-50 border-emerald-200":mySlotReq.status==="clarify"?"bg-blue-50 border-blue-200":"bg-red-50 border-red-200"}`}>
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-sm font-semibold text-slate-700">Your request:</span>
                <span className={`text-xs px-2 py-0.5 rounded-full font-semibold border
                  ${mySlotReq.status==="pending"?"bg-amber-100 text-amber-700 border-amber-200":mySlotReq.status==="accepted"?"bg-emerald-100 text-emerald-700 border-emerald-200":mySlotReq.status==="clarify"?"bg-blue-100 text-blue-700 border-blue-200":"bg-red-100 text-red-600 border-red-200"}`}>
                  {mySlotReq.status==="pending"?"⏳ Pending review":mySlotReq.status==="accepted"?"✅ Accepted":mySlotReq.status==="clarify"?"💬 Clarification needed":"❌ Declined"}
                </span>
                <span className="text-xs text-slate-400 capitalize">as {mySlotReq.requestedRole}</span>
              </div>
              {mySlotReq.status==="clarify" && mySlotReq.adminNote && (
                <div className="bg-white border border-blue-200 rounded-lg px-3 py-2">
                  <p className="text-xs font-semibold text-blue-600 mb-0.5">💬 Admin asks:</p>
                  <p className="text-sm text-slate-700">"{mySlotReq.adminNote}"</p>
                </div>
              )}
              {mySlotReq.status==="accepted" && (
                <p className="text-sm font-semibold text-emerald-700">🎉 You're confirmed — see you there!</p>
              )}
              {mySlotReq.status==="rejected" && mySlotReq.adminNote && (
                <p className="text-xs text-slate-600 italic">Admin note: "{mySlotReq.adminNote}"</p>
              )}
              {mySlotReq.status==="pending" && (
                <button onClick={withdrawSlotReq}
                  className="text-xs text-red-400 hover:text-red-600 underline font-medium">Withdraw request</button>
              )}
            </div>
          ) : showJoin ? (
            <div className="space-y-3 fade-in">
              <div>
                <p className="text-xs font-semibold text-slate-500 mb-1.5">I'd like to help as</p>
                <div className="flex gap-2 flex-wrap">
                  {[["secondary","🟣 Secondary"],["primary","🎯 Rota Lead"],["volunteer","🙋 General Volunteer"]].map(([v,l])=>(
                    <button key={v} onClick={()=>setJoinRole(v)}
                      className={`text-xs px-3 py-1.5 rounded-lg font-semibold border transition-colors ${joinRole===v?"bg-indigo-600 text-white border-indigo-600":"border-slate-200 bg-white text-slate-600 hover:bg-slate-50"}`}>

                  ))}
                </div>
              </div>
              <div>
                <p className="text-xs font-semibold text-slate-500 mb-1">Message (optional)</p>
                <textarea value={joinMsg} onChange={e=>setJoinMsg(e.target.value)}

            </div>
          )}
        </div>

              : <p className="text-slate-400 text-sm italic">No lead assigned yet</p>}

                  var pr = priests.find(function(p){return p.id===pid;});

                  return pv ? pv.name : "Not assigned";
                })()}</p>

                <p className="font-semibold text-slate-800 text-sm">{(function(){
                  var pv = rota.prasadhamId ? prasadham.find(function(p){return p.id===rota.prasadhamId;}) : null;

              {activities.map(a=>(
                <div key={a.id} className="border border-slate-200 rounded-xl overflow-hidden">
                  <div className={"flex items-center justify-between px-3 py-2.5 "+((rota.actOwners||{})[a.id]?"bg-emerald-50":"bg-slate-50")}>
                    <div className="flex-1 min-w-0">
                      <div className="text-sm font-medium text-slate-700">{a.name}</div>
                      {(rota.actOwners||{})[a.id] && (
                        <div className="text-xs text-emerald-600 font-semibold mt-0.5">✓ {(members.find(function(m){return m.id===(rota.actOwners||{})[a.id];})||{}).name||"—"}</div>
                      )}
                      {!(rota.actOwners||{})[a.id] && !(rota.actInterest||{})[a.id] && (
                        <div className="text-xs text-slate-400 italic mt-0.5">Open — no one assigned</div>
                      )}
                      {!(rota.actOwners||{})[a.id] && (rota.actInterest||{})[a.id] && (
                        <div className="text-xs text-amber-600 mt-0.5">
                          ⏳ {(rota.actInterest||{})[a.id].name} — {(rota.actInterest||{})[a.id].status==="accepted"?"✓ Confirmed":"Pending"}
                        </div>
                      )}
                    </div>
                    <div className="flex items-center gap-2 flex-shrink-0 ml-3">
                      {/* Rota Lead: Help Wanted toggle */}
                      {isRotaLead && isMySlot && (
                        <button onClick={()=>{ var cur=local.helpWanted||[]; var isHW=cur.includes(a.id); onSave({helpWanted:isHW?cur.filter(function(x){return x!==a.id;}): [...cur,a.id]}); showToast(isHW?"Help request removed":"Help request sent to volunteers"); }}
                          className={"text-xs px-2 py-1 rounded-full border font-semibold "+((local.helpWanted||[]).includes(a.id)?"bg-amber-100 text-amber-700 border-amber-300":"bg-slate-100 text-slate-500 border-slate-200 hover:bg-amber-50 hover:text-amber-600")}>
                          🙌 {(local.helpWanted||[]).includes(a.id)?"Help Wanted":"Request Help"}
                        </button>
                      )}
                      {/* Rota Lead: confirm/decline volunteer */}
                      {isRotaLead && isMySlot && (rota.actInterest||{})[a.id] && (rota.actInterest||{})[a.id].status==="pending" && !(rota.actOwners||{})[a.id] && (
                        <div className="flex gap-1">
                          <button onClick={()=>{ var mId=(rota.actInterest||{})[a.id].memberId; var nO={...(rota.actOwners||{}),[a.id]:mId}; var nI={...(rota.actInterest||{})}; delete nI[a.id]; onSave({actOwners:nO,actInterest:nI}); showToast((rota.actInterest||{})[a.id].name+" confirmed for "+a.name); }}
                            className="text-xs bg-emerald-600 hover:bg-emerald-700 text-white px-2 py-1 rounded-lg font-semibold">✓</button>
                          <button onClick={()=>{ var nI={...(rota.actInterest||{})}; delete nI[a.id]; onSave({actInterest:nI}); showToast("Declined"); }}
                            className="text-xs bg-red-100 hover:bg-red-200 text-red-600 px-2 py-1 rounded-lg font-semibold">✕</button>
                        </div>
                      )}
                    </div>
                  </div>
                  {/* Rota Lead: assign member dropdown */}
                  {isRotaLead && isMySlot && (
                    <div className="px-3 py-2 bg-white border-t border-slate-100">
                      <select value={(local.actOwners||{})[a.id]||""} onChange={e=>setActOwner(a.id,e.target.value)}
                        className="w-full border border-slate-200 rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 bg-white">
                        <option value="">— Assign member</option>
                        {members.map(m=><option key={m.id} value={m.id}>{m.name}</option>)}
                      </select>
                    </div>
                  )}
                </div>
              ))}
            </div>
            {isRotaLead && isMySlot && (
              <button onClick={()=>onSave(local)} className="mt-4 w-full bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl py-2.5 font-bold text-sm">Save Activities</button>

          </div>
        )}

        {rota.notes && (
          <div className="bg-amber-50 border border-amber-200 rounded-2xl p-4">
            <h3 className="text-xs font-semibold text-amber-700 uppercase tracking-wider mb-2">📝 Notes</h3>

  }

  // ── Admin editable view ───────────────────────────────────────────────────

  return (
    <div className="space-y-5 fade-in">

      <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-5">
        <div className="flex items-start justify-between gap-4">

      {/* Rota Lead: read-only lead/secondary info bar */}

            <span className="text-slate-400 text-xs font-medium">🟣 Secondary</span>
            {(local.secondary||[]).length > 0

      {isAdmin && (
        <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-5">
