          </div>
          <div className="grid grid-cols-2 gap-4">
            <Field label="Duration (hours)" type="number" value={form.duration} onChange={v=>setForm({...form,duration:Number(v)})}/>
            <Field label="Rota Year"         type="number" value={form.year}     onChange={v=>setForm({...form,year:Number(v)})}/>
          </div>
          <button onClick={save} className="bg-indigo-600 text-white px-6 py-2.5 rounded-lg text-sm font-semibold hover:bg-indigo-700 shadow-sm">Save Settings</button>
        </div>
      </div>
      {/* ── Advanced: folded away so they aren't opened by accident ── */}
      <Foldable icon="🗄️" title="Database (Supabase)" note="Connection for this device — rarely needs changing">
        <SupabaseConfigPanel showToast={showToast}/>
      </Foldable>
      <Foldable icon="🔧" title="Data Tools" note="Backup download and one-time migration">
        <DataToolsPanel showToast={showToast} allData={allData}/>
      </Foldable>
    </div>
  );
}

// ─── Registers Tab ────────────────────────────────────────────────────────────
const REG_COLORS = {
  violet:  { bg:"bg-violet-50",  border:"border-violet-200",  badge:"bg-violet-100 text-violet-700",  btn:"bg-violet-600 hover:bg-violet-700",  head:"bg-violet-600", light:"bg-violet-50 text-violet-700", dot:"bg-violet-500" },
  emerald: { bg:"bg-emerald-50", border:"border-emerald-200", badge:"bg-emerald-100 text-emerald-700",btn:"bg-emerald-600 hover:bg-emerald-700",head:"bg-emerald-600",light:"bg-emerald-50 text-emerald-700",dot:"bg-emerald-500" },
  amber:   { bg:"bg-amber-50",   border:"border-amber-200",   badge:"bg-amber-100 text-amber-700",    btn:"bg-amber-500 hover:bg-amber-600",    head:"bg-amber-500",  light:"bg-amber-50 text-amber-700",   dot:"bg-amber-500"  },
  indigo:  { bg:"bg-indigo-50",  border:"border-indigo-200",  badge:"bg-indigo-100 text-indigo-700",  btn:"bg-indigo-600 hover:bg-indigo-700",  head:"bg-indigo-600", light:"bg-indigo-50 text-indigo-700", dot:"bg-indigo-500" },
  rose:    { bg:"bg-rose-50",    border:"border-rose-200",    badge:"bg-rose-100 text-rose-700",      btn:"bg-rose-600 hover:bg-rose-700",      head:"bg-rose-600",   light:"bg-rose-50 text-rose-700",     dot:"bg-rose-500"   },
};
const COLOR_OPTS = Object.keys(REG_COLORS);

function RegistersTab({ registers, upRegs, regEntries, upRegEntries, allSlots, rotas, members, showToast }) {
  const [view,        setView]        = useState("overview");
  const [selSlotKey,  setSelSlotKey]  = useState(null);
  const [closeModal,  setCloseModal]  = useState(null); // {slotKey, regId}
  const [closeForm,   setCloseForm]   = useState({closedBy:"", notes:""});
  const [adminEdit,   setAdminEdit]   = useState(null);
  const [adminForm,   setAdminForm]   = useState({name:"",prefix:"",color:"violet",ticketPrice:""});

  const today = new Date(); today.setHours(0,0,0,0);

  const upcomingSlots = allSlots.filter(s=>new Date(s.date)>=today).slice(0,15);
  const pastSlots     = allSlots.filter(s=>new Date(s.date)<today)
                          .sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,40);

  const getMember   = id => members.find(m=>m.id===id);
  const getPrimaries= sk => (rotas[sk]?.primary||[]).map(id=>getMember(id)).filter(Boolean);

  // regEntries[slotKey][regId] = { startNum, tickets:[{num,issuedAt,issuedBy}], closed, closedBy, closedAt, notes }
  const getEntry    = (sk,rid) => (regEntries[sk]||{})[rid] || null;

  // How many rota-days have been closed for this register (to compute global running number)
  const globalClosedCount = rid =>
    Object.values(regEntries).filter(se=>se[rid]?.closed).length;

  // Start number for a slot = prefix + (nextNum + count of previously closed sessions before this slot date)
  const getSessionStartNum = (reg, slotKey) => {
    const slotDate = new Date(allSlots.find(s=>s.key===slotKey)?.date || 0);
    // count sessions closed for reg BEFORE this slot date
    const priorClosed = Object.entries(regEntries).filter(([sk, se]) => {
      if (!se[reg.id]?.closed) return false;
      const d = new Date(allSlots.find(s=>s.key===sk)?.date || 0);
      return d < slotDate;
    }).length;
    return reg.nextNum + priorClosed;
  };

  // Latest ticket number issued in a session = startNum + tickets.length - 1; or startNum - 1 if none issued yet
  const getSessionCurrentNum = (entry, startN) => {
    if (!entry) return startN - 1;
    const count = (entry.tickets||[]).length;
    return count === 0 ? startN - 1 : startN + count - 1;
  };

  const getNextTicketNum = (entry, startN) => {
    return startN + (entry?.tickets||[]).length;
  };

  // Issue one ticket for a register in a slot
  const issueTicket = (slotKey, reg, issuedById) => {
    const existing = getEntry(slotKey, reg.id);
    if (existing?.closed) return showToast("Register is already closed","error");
    const startN = getSessionStartNum(reg, slotKey);
    const nextN  = getNextTicketNum(existing, startN);
    const ticket = { num: fmtRegNum(reg.prefix, nextN), issuedAt: new Date().toISOString(), issuedBy: issuedById||"" };
    const updated = {
      ...regEntries,
      [slotKey]: {
        ...(regEntries[slotKey]||{}),
        [reg.id]: {
          startNum: existing?.startNum || fmtRegNum(reg.prefix, startN),
          tickets:  [...(existing?.tickets||[]), ticket],
          closed:   false,
          closedBy: existing?.closedBy||"",
          closedAt: "",
          notes:    existing?.notes||"",
        }
      }
    };
    upRegEntries(updated);
    showToast(`Issued ${ticket.num}`);
  };

  // Undo last ticket
  const undoLastTicket = (slotKey, regId) => {
    const entry = getEntry(slotKey, regId);
    if (!entry || entry.closed || !entry.tickets?.length) return;
    const tickets = entry.tickets.slice(0,-1);
    const updated = {
      ...regEntries,
      [slotKey]: { ...(regEntries[slotKey]||{}), [regId]: {...entry, tickets} }
    };
    upRegEntries(updated);
    showToast("Last ticket undone");
  };

  // Open close-register modal
  const openCloseModal = (slotKey, regId) => {
    const entry = getEntry(slotKey, regId);
    setCloseForm({ closedBy: entry?.closedBy||"", notes: entry?.notes||"" });
    setCloseModal({slotKey, regId});
  };

  const confirmClose = () => {
    if (!closeForm.closedBy) return showToast("Select the rota lead closing this register","error");
    const {slotKey, regId} = closeModal;
    const entry = getEntry(slotKey, regId);
    const updated = {
      ...regEntries,
      [slotKey]: {
        ...(regEntries[slotKey]||{}),
        [regId]: { ...(entry||{}), ...closeForm, closed: true, closedAt: new Date().toISOString() }
      }
    };
    upRegEntries(updated);
    setCloseModal(null);
    showToast(`${registers.find(r=>r.id===regId)?.name} closed ✓`);
  };

  const slotSummary = sk => {
    const se = regEntries[sk]||{};
    const closed = registers.filter(r=>se[r.id]?.closed).length;
    const issued = registers.reduce((t,r)=>t+(se[r.id]?.tickets?.length||0),0);
    return { closed, total: registers.length, issued };
  };

  // ── Admin ──
  const saveAdmin = () => {
    if (!adminForm.name.trim()) return showToast("Name required","error");
    const prefix = (adminForm.prefix||initials(adminForm.name)).toUpperCase();
    if (adminEdit?.id) {
      upRegs(registers.map(r=>r.id===adminEdit.id?{...r,...adminForm,prefix}:r));
      showToast("Register updated");
    } else {
      upRegs([...registers,{id:uid(),...adminForm,prefix,nextNum:1}]);
      showToast("Register added");
    }
    setAdminEdit(null); setAdminForm({name:"",prefix:"",color:"violet",ticketPrice:""});
  };
  const deleteReg = id => {
    if (!confirm("Delete this register?")) return;
    upRegs(registers.filter(r=>r.id!==id)); showToast("Deleted");
  };
  const startAdminEdit = r => { setAdminEdit(r); setAdminForm({name:r.name,prefix:r.prefix,color:r.color,ticketPrice:r.ticketPrice||""}); };
  const cancelAdmin = () => { setAdminEdit(null); setAdminForm({name:"",prefix:"",color:"violet",ticketPrice:""}); };

  // ─────────────────────────────────────────────────────────────────────────────
  return (
    <div className="space-y-5">
      {/* Sub-nav */}
      <div className="flex items-center gap-2 flex-wrap">
        <div className="flex bg-white border border-slate-200 rounded-xl p-1 gap-1 shadow-sm">
          {[
            {k:"overview",  label:"📊 Overview"},
            {k:"rota-day",  label:"🎟 Issue Tickets"},
            {k:"admin",     label:"⚙️ Manage Registers"},
          ].map(v=>(
            <button key={v.k} onClick={()=>setView(v.k)}
              className={`px-4 py-2 rounded-lg text-sm font-medium transition-colors ${view===v.k?"bg-indigo-600 text-white shadow-sm":"text-slate-600 hover:bg-slate-50"}`}>
              {v.label}
            </button>
          ))}
        </div>
        <span className="ml-auto text-sm text-slate-400">{registers.length} registers</span>
      </div>

      {/* ══ OVERVIEW ══ */}
      {view==="overview" && (
        <div className="space-y-5 fade-in">
          <div className="grid md:grid-cols-3 gap-4">
            {registers.map(reg=>{
              const c = REG_COLORS[reg.color]||REG_COLORS.indigo;
              const allSess = Object.entries(regEntries)
                .map(([sk,se])=>se[reg.id]?{slotKey:sk,...se[reg.id]}:null).filter(Boolean);
              const closedSess = allSess.filter(e=>e.closed);
              const totalTickets = allSess.reduce((t,e)=>t+(e.tickets?.length||0),0);
              const latest = closedSess.sort((a,b)=>new Date(b.closedAt)-new Date(a.closedAt))[0];
              const globalNext = reg.nextNum + globalClosedCount(reg.id);
              return (
                <div key={reg.id} className={`bg-white rounded-2xl border ${c.border} shadow-sm overflow-hidden`}>
                  <div className={`${c.head} text-white px-5 py-4 flex items-center justify-between`}>
                    <div>
                      <div className="font-bold text-lg">{reg.name}</div>
                      <div className="text-white text-opacity-70 text-xs mt-0.5">
                        Prefix: <b>{reg.prefix}</b> · Next session starts: <b>{fmtRegNum(reg.prefix, globalNext)}</b>
                        {reg.ticketPrice && <> · <b>£{reg.ticketPrice}</b>/ticket</>}
                      </div>
                    </div>
                    <div className="w-12 h-12 rounded-xl bg-white bg-opacity-20 flex items-center justify-center text-2xl font-black">{reg.prefix}</div>
                  </div>
                  <div className="px-5 py-4 space-y-3">
                    <div className="grid grid-cols-2 md:grid-cols-3 gap-2">
                      <div className={`${c.bg} border ${c.border} rounded-xl p-2 text-center`}>
                        <div className="text-xl font-bold">{totalTickets}</div>
                        <div className="text-xs text-slate-500">Tickets issued</div>
                      </div>
                      <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-2 text-center">
                        <div className="text-xl font-bold text-emerald-700">{closedSess.length}</div>
                        <div className="text-xs text-slate-500">Sessions closed</div>
                      </div>
                      <div className="bg-slate-50 border border-slate-200 rounded-xl p-2 text-center">
                        <div className="text-xl font-bold text-slate-600">{allSess.length-closedSess.length}</div>
                        <div className="text-xs text-slate-500">Open/Draft</div>
                      </div>
                    </div>
                    {latest && (
                      <div className={`${c.bg} border ${c.border} rounded-xl px-3 py-2 text-xs`}>
                        <div className="font-semibold text-slate-500 mb-1">Last closed session</div>
                        <div className="flex justify-between items-center">
                          <span className={`font-bold ${c.light.split(" ")[1]}`}>{latest.startNum} → {fmtRegNum(reg.prefix, reg.nextNum + globalClosedCount(reg.id) - 1)}</span>
                          <span className="text-slate-400">{new Date(latest.closedAt).toLocaleDateString("en-GB")}</span>
                        </div>
                        <div className="text-slate-500 mt-0.5">{latest.tickets?.length||0} tickets · By: {getMember(latest.closedBy)?.name||"—"}</div>
                      </div>
                    )}
                  </div>
                </div>
              );
            })}
          </div>

          {/* History table */}
          <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div className="px-5 py-4 border-b border-slate-100">
              <h3 className="font-semibold text-slate-800">Session History</h3>
            </div>
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead className="bg-slate-50 border-b border-slate-100">
                  <tr>
                    <th className="px-4 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wide">Rota Date</th>
                    {registers.map(r=>{
                      const c=REG_COLORS[r.color]||REG_COLORS.indigo;
                      return <th key={r.id} className="px-4 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wide">{r.name}</th>;
                    })}
                    <th className="px-4 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wide">Overall</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {[...allSlots].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,20).map(slot=>{
                    const {closed,total,issued}=slotSummary(slot.key);
                    return (
                      <tr key={slot.key} className="hover:bg-slate-50 transition-colors cursor-pointer" onClick={()=>{setSelSlotKey(slot.key);setView("rota-day");}}>
                        <td className="px-4 py-3">
                          <div className="font-medium text-slate-700">{slot.isSpecial?"⭐ ":""}{new Date(slot.date).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})}</div>
                          <div className="text-xs text-slate-400">{slot.label.split("—")[0].trim()}</div>
                        </td>
                        {registers.map(reg=>{
                          const e = getEntry(slot.key, reg.id);
                          const c = REG_COLORS[reg.color]||REG_COLORS.indigo;
                          const cnt = e?.tickets?.length||0;
                          return (
                            <td key={reg.id} className="px-4 py-3">
                              {e ? (
                                <div>
                                  <div className={`inline-flex items-center gap-1 text-xs font-bold px-2 py-0.5 rounded-full ${e.closed?c.badge:"bg-slate-100 text-slate-600"}`}>
                                    {e.startNum}{cnt>0?` → ${e.tickets[cnt-1].num}`:""}
                                  </div>
                                  <div className="text-xs text-slate-400 mt-0.5">{cnt} ticket{cnt!==1?"s":""} {e.closed?"· ✓ Closed":""}</div>
                                </div>
                              ) : <span className="text-slate-300 text-xs">—</span>}
                            </td>
                          );
                        })}
                        <td className="px-4 py-3">
                          <span className={`text-xs font-semibold px-2 py-1 rounded-full ${closed===total&&total>0?"bg-emerald-100 text-emerald-700":issued>0?"bg-amber-100 text-amber-700":"bg-slate-100 text-slate-500"}`}>
                            {closed}/{total} closed · {issued} tickets
                          </span>
                        </td>
                      </tr>
                    );
                  })}
                  {allSlots.length===0 && <tr><td colSpan={registers.length+2} className="p-8 text-center text-slate-400">No rota slots yet.</td></tr>}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      )}

      {/* ══ ISSUE TICKETS (ROTA DAY) ══ */}
      {view==="rota-day" && (
        <div className="flex flex-col md:flex-row gap-4 md:gap-5 items-start fade-in">
          {/* Slot list */}
          <div className="w-full md:w-64 flex-shrink-0 bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div className="px-4 py-3 bg-slate-50 border-b border-slate-100">
              <div className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Upcoming</div>
            </div>
            <div className="max-h-72 overflow-y-auto scrollbar-hide divide-y divide-slate-100">
              {upcomingSlots.map(slot=>{
                const {closed,total,issued}=slotSummary(slot.key);
                const isSel=selSlotKey===slot.key;
                return (
                  <button key={slot.key} onClick={()=>setSelSlotKey(slot.key)}
                    className={`w-full text-left px-4 py-3 transition-colors hover:bg-slate-50 ${isSel?"bg-indigo-50":""}`}>
                    <div className="flex items-center justify-between">
                      <span className="text-sm font-medium text-slate-700 truncate">{slot.isSpecial?"⭐ ":""}{new Date(slot.date).toLocaleDateString("en-GB",{day:"2-digit",month:"short"})}</span>
                      <span className={`text-xs px-1.5 py-0.5 rounded-full font-semibold flex-shrink-0 ml-1 ${closed===total&&total>0?"bg-emerald-100 text-emerald-600":issued>0?"bg-amber-100 text-amber-600":"bg-slate-100 text-slate-500"}`}>{closed}/{total}</span>
                    </div>
                    <div className="text-xs text-slate-400 mt-0.5 truncate">{slot.label.split("—")[1]?.trim()}</div>
                    {issued>0 && <div className="text-xs text-indigo-400 mt-0.5">{issued} ticket{issued!==1?"s":""} issued</div>}
                  </button>
                );
              })}
              {upcomingSlots.length===0&&<div className="p-5 text-slate-400 text-sm text-center">No upcoming slots</div>}
            </div>
            <div className="px-4 py-3 bg-slate-50 border-t border-b border-slate-100">
              <div className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Past</div>
            </div>
            <div className="max-h-52 overflow-y-auto scrollbar-hide divide-y divide-slate-100">
              {pastSlots.map(slot=>{
                const {closed,total,issued}=slotSummary(slot.key);
                const isSel=selSlotKey===slot.key;
                return (
                  <button key={slot.key} onClick={()=>setSelSlotKey(slot.key)}
                    className={`w-full text-left px-4 py-2.5 transition-colors hover:bg-slate-50 ${isSel?"bg-indigo-50":""}`}>
                    <div className="flex items-center justify-between">
                      <span className="text-sm text-slate-500 truncate">{new Date(slot.date).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})}</span>
                      <span className={`text-xs px-1.5 py-0.5 rounded-full font-semibold flex-shrink-0 ml-1 ${closed===total&&total>0?"bg-emerald-100 text-emerald-600":issued>0?"bg-amber-100 text-amber-600":"bg-slate-100 text-slate-500"}`}>{closed}/{total}</span>
                    </div>
                  </button>
                );
              })}
            </div>
          </div>

          {/* Register panels */}
          <div className="flex-1 min-w-0">
            {!selSlotKey ? (
              <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-16 text-center text-slate-400">
                <div className="text-6xl mb-4">🎟</div>
                <p className="font-semibold text-lg">Select a rota date</p>
                <p className="text-sm mt-1">Choose a slot to issue tickets and manage registers</p>
              </div>
            ) : (()=>{
              const slot     = allSlots.find(s=>s.key===selSlotKey);
              const rota     = rotas[selSlotKey]||{};
              const primaries= getPrimaries(selSlotKey);
              const lead     = rota.lead ? getMember(rota.lead) : null;
              const {closed,total,issued}=slotSummary(selSlotKey);
              const allClosed= closed===total && total>0;

              return (
                <div className="space-y-4 fade-in">
                  {/* Slot header */}
                  <div className={`rounded-2xl border shadow-sm p-4 ${allClosed?"bg-emerald-50 border-emerald-200":"bg-white border-slate-200"}`}>
                    <div className="flex items-start justify-between gap-3">
                      <div>
                        <h3 className="font-bold text-slate-800 text-lg">{slot?.isSpecial?"⭐ ":"📅 "}{slot?.label}</h3>
                        <p className="text-slate-500 text-xs mt-0.5">{new Date(slot.date).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</p>
                      </div>
                      <div className="text-right flex-shrink-0">
                        <span className={`text-sm font-bold px-3 py-1.5 rounded-full inline-block ${allClosed?"bg-emerald-200 text-emerald-800":issued>0?"bg-amber-100 text-amber-700":"bg-slate-100 text-slate-500"}`}>
                          {allClosed ? "✓ All Closed" : `${closed}/${total} closed`}
                        </span>
                        <div className="text-xs text-slate-400 mt-1">{issued} total tickets issued</div>
                      </div>
                    </div>
                    <div className="flex gap-2 mt-3 flex-wrap">
                      {lead && <span className="text-xs bg-indigo-50 text-indigo-700 border border-indigo-200 px-2 py-1 rounded-full">🎯 Lead: {lead.name}</span>}
                      {primaries.map(p=><span key={p.id} className="text-xs bg-violet-50 text-violet-700 border border-violet-200 px-2 py-1 rounded-full font-medium">🎯 {p.name}</span>)}
                      {primaries.length===0 && <span className="text-xs text-amber-600 bg-amber-50 border border-amber-200 px-2 py-1 rounded-full">⚠ No rota leads on this rota</span>}
                    </div>
                  </div>

                  {/* One card per register */}
                  {registers.map(reg=>{
                    const c       = REG_COLORS[reg.color]||REG_COLORS.indigo;
                    const entry   = getEntry(selSlotKey, reg.id);
                    const startN  = getSessionStartNum(reg, selSlotKey);
                    const tickets = entry?.tickets||[];
                    const ticketCount = tickets.length;
                    const lastTicket  = tickets[ticketCount-1];
                    const currentNum  = getSessionCurrentNum(entry, startN);
                    const nextNum     = getNextTicketNum(entry, startN);
                    const isClosed    = !!entry?.closed;

                    return (
                      <div key={reg.id} className={`bg-white rounded-2xl border ${isClosed?`border-emerald-300`:`${c.border}`} shadow-sm overflow-hidden`}>
                        {/* Register header */}
                        <div className={`${isClosed?"bg-emerald-600":c.head} text-white px-5 py-3 flex items-center justify-between`}>
                          <div className="flex items-center gap-3">
                            <div className="w-10 h-10 rounded-xl bg-white bg-opacity-20 flex items-center justify-center text-xl font-black">{reg.prefix}</div>
                            <div>
                              <div className="font-bold">{reg.name}</div>
                              <div className="text-white text-opacity-70 text-xs">
                                {isClosed
                                  ? `Closed · ${ticketCount} tickets · ${entry.startNum} → ${lastTicket?.num||entry.startNum}`
                                  : `Session starts at ${fmtRegNum(reg.prefix, startN)}${reg.ticketPrice?` · £${reg.ticketPrice}/ticket`:""}`
                                }
                              </div>
                            </div>
                          </div>
                          <span className={`text-xs font-semibold px-3 py-1 rounded-full ${isClosed?"bg-white text-emerald-700":"bg-white bg-opacity-20 text-white"}`}>
                            {isClosed ? "✓ Closed" : ticketCount===0 ? "Not started" : `${ticketCount} issued`}
                          </span>
                        </div>

                        <div className="px-5 py-4">
                          {isClosed ? (
                            /* ── Closed view ── */
                            <div className="space-y-3">
                              <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                                <StatBox label="Start" value={entry.startNum} color={c.light}/>
                                <StatBox label="End" value={lastTicket?.num||entry.startNum} color="bg-emerald-50 text-emerald-700"/>
                                <StatBox label="Tickets" value={ticketCount} color="bg-slate-50 text-slate-700"/>
                              </div>
                              {reg.ticketPrice && (
                                <div className="bg-emerald-50 border border-emerald-200 rounded-xl px-4 py-2 flex justify-between items-center">
                                  <span className="text-sm text-emerald-700">Total collected</span>
                                  <span className="font-bold text-emerald-700 text-lg">£{(ticketCount * parseFloat(reg.ticketPrice)).toFixed(2)}</span>
                                </div>
                              )}
                              <div className="text-xs text-slate-400">
                                Closed by <span className="font-semibold text-slate-600">{getMember(entry.closedBy)?.name||"—"}</span>
                                {" · "}{new Date(entry.closedAt).toLocaleString("en-GB",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})}
                              </div>
                              {entry.notes && <div className="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-500 italic">"{entry.notes}"</div>}
                              {/* Ticket log */}
                              <details className="group">
                                <summary className="text-xs text-indigo-500 cursor-pointer hover:underline font-medium">View all {ticketCount} tickets ▾</summary>
                                <div className="mt-2 max-h-40 overflow-y-auto scrollbar-hide space-y-1">
                                  {tickets.map((t,i)=>(
                                    <div key={i} className="flex items-center justify-between bg-slate-50 rounded-lg px-3 py-1.5 text-xs">
                                      <span className={`font-mono font-bold ${c.light.split(" ")[1]}`}>{t.num}</span>
                                      <span className="text-slate-400">{new Date(t.issuedAt).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}</span>
                                    </div>
                                  ))}
                                </div>
                              </details>
                            </div>
                          ) : (
                            /* ── Active / issuing view ── */
                            <div className="space-y-4">
                              {/* Live counter */}
                              <div className="flex gap-3 items-stretch">
                                <div className={`flex-1 ${c.bg} border ${c.border} rounded-2xl p-4 text-center`}>
                                  <div className="text-xs text-slate-500 mb-1 font-medium">Last issued</div>
                                  <div className={`text-3xl font-black font-mono ${c.light.split(" ")[1]}`}>
                                    {ticketCount===0 ? <span className="text-slate-300">—</span> : lastTicket.num}
                                  </div>
                                  <div className="text-xs text-slate-400 mt-1">{ticketCount} ticket{ticketCount!==1?"s":""} issued</div>
                                </div>
                                <div className="flex-1 bg-slate-50 border border-slate-200 rounded-2xl p-4 text-center">
                                  <div className="text-xs text-slate-500 mb-1 font-medium">Next ticket</div>
                                  <div className="text-3xl font-black font-mono text-slate-700">{fmtRegNum(reg.prefix, nextNum)}</div>
                                  <div className="text-xs text-slate-400 mt-1">ready to issue</div>
                                </div>
                                {reg.ticketPrice && ticketCount>0 && (
                                  <div className="flex-1 bg-emerald-50 border border-emerald-200 rounded-2xl p-4 text-center">
                                    <div className="text-xs text-slate-500 mb-1 font-medium">Collected so far</div>
                                    <div className="text-3xl font-black text-emerald-700">£{(ticketCount*parseFloat(reg.ticketPrice)).toFixed(0)}</div>
                                    <div className="text-xs text-slate-400 mt-1">@ £{reg.ticketPrice} each</div>
                                  </div>
                                )}
                              </div>

                              {/* Issue button — big tap target */}
                              <button
                                onClick={()=>issueTicket(selSlotKey, reg, primaries[0]?.id||"")}
                                className={`w-full ${c.btn} text-white rounded-2xl py-5 text-xl font-black shadow-lg active:scale-95 transition-transform select-none`}>
                                🎟 Issue {fmtRegNum(reg.prefix, nextNum)}
                                {reg.ticketPrice && <span className="text-base font-semibold opacity-80 ml-2">£{reg.ticketPrice}</span>}
                              </button>

                              {/* Recent tickets list */}
                              {ticketCount>0 && (
                                <div className="space-y-1.5">
                                  <div className="text-xs font-semibold text-slate-400 uppercase tracking-wide">Recent tickets</div>
                                  <div className="max-h-32 overflow-y-auto scrollbar-hide space-y-1">
                                    {[...tickets].reverse().slice(0,8).map((t,i)=>(
                                      <div key={i} className={`flex items-center justify-between rounded-xl px-3 py-2 text-sm ${i===0?`${c.bg} border ${c.border}`:"bg-slate-50"}`}>
                                        <span className={`font-mono font-bold ${i===0?c.light.split(" ")[1]:"text-slate-600"}`}>{t.num}</span>
                                        <span className="text-xs text-slate-400">{new Date(t.issuedAt).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}</span>
                                      </div>
                                    ))}
                                  </div>
                                  {ticketCount>8&&<div className="text-xs text-slate-400 text-center">+{ticketCount-8} more</div>}
                                </div>
                              )}

                              {/* Undo + Close buttons */}
                              <div className="flex gap-2 pt-1">
                                {ticketCount>0 && (
                                  <button onClick={()=>undoLastTicket(selSlotKey, reg.id)}
                                    className="flex-1 bg-slate-100 text-slate-600 rounded-xl py-2.5 text-sm font-semibold hover:bg-slate-200 border border-slate-200">
                                    ↩ Undo Last ({lastTicket?.num})

                                )}
                                <button onClick={()=>openCloseModal(selSlotKey, reg.id)}
                                  className="flex-1 bg-emerald-600 text-white rounded-xl py-2.5 text-sm font-semibold hover:bg-emerald-700">
                                  ✓ Close Register ({ticketCount} ticket{ticketCount!==1?"s":""})
                                </button>
                              </div>
                            </div>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              );
            })()}
          </div>
        </div>
      )}

      {/* ══ ADMIN ══ */}
      {view==="admin" && (
        <div className="grid md:grid-cols-5 gap-6 fade-in">
          <div className="md:col-span-2">
            <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 sticky top-4 space-y-3">

              <Field label="Number Prefix (auto-generated)" value={adminForm.prefix}
                onChange={v=>setAdminForm({...adminForm,prefix:v.toUpperCase()})} placeholder="e.g. A"/>
              <Field label="Ticket Price (£, optional)" type="number" value={adminForm.ticketPrice}
                onChange={v=>setAdminForm({...adminForm,ticketPrice:v})} placeholder="e.g. 2.50"/>

                <label className="text-xs font-medium text-slate-500 mb-2 block">Colour Theme</label>
                <div className="flex gap-2 flex-wrap">
                  {COLOR_OPTS.map(col=>{
                    const c=REG_COLORS[col];
                    return (
                      <button key={col} onClick={()=>setAdminForm({...adminForm,color:col})}
                        className={`w-8 h-8 rounded-full ${c.dot} border-4 transition-all ${adminForm.color===col?"border-slate-700 scale-110":"border-transparent"}`}
                        title={col}/>
                    );
                  })}
                </div>
              </div>
              <div className="flex gap-2 pt-1">
                <button onClick={saveAdmin} className="flex-1 bg-indigo-600 text-white rounded-lg py-2 text-sm font-semibold hover:bg-indigo-700">{adminEdit?.id?"Update":"Add"}</button>
                {adminEdit && <button onClick={cancelAdmin} className="flex-1 bg-slate-100 text-slate-600 rounded-lg py-2 text-sm font-semibold">Cancel</button>}
              </div>
              <div className="bg-amber-50 border border-amber-200 rounded-xl p-3 text-xs text-amber-700">
                <strong className="block mb-1">ℹ️ Numbering</strong>

              </div>
            </div>
          </div>
          <div className="md:col-span-3 space-y-3">
            <h3 className="font-semibold text-slate-700">{registers.length} Registers</h3>

                <div className="text-4xl mb-3">📒</div><p>No registers yet.</p>

              const c=REG_COLORS[reg.color]||REG_COLORS.indigo;
              const closed=Object.values(regEntries).filter(se=>se[reg.id]?.closed).length;
              const totalT=Object.values(regEntries).reduce((t,se)=>t+(se[reg.id]?.tickets?.length||0),0);

                <div key={reg.id} className={`bg-white border ${c.border} rounded-2xl px-5 py-4 shadow-sm flex items-center gap-4`}>

                  <div className="flex-1 min-w-0">
                    <div className="font-semibold text-slate-800">{reg.name}</div>
                    <div className="text-xs text-slate-400 mt-0.5">

                      {reg.ticketPrice && <> · £{reg.ticketPrice}/ticket</>}
                      &nbsp;· {totalT} tickets total · {closed} sessions closed
                    </div>
                  </div>
                  <div className="flex gap-2 flex-shrink-0">
                    <button onClick={()=>startAdminEdit(reg)} className="text-xs bg-slate-50 border border-slate-200 text-slate-600 px-3 py-1.5 rounded-lg hover:bg-slate-100 font-medium">Edit</button>
                    <button onClick={()=>deleteReg(reg.id)} className="text-xs bg-red-50 border border-red-200 text-red-500 px-3 py-1.5 rounded-lg hover:bg-red-100 font-medium">Delete</button>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* ══ CLOSE REGISTER MODAL ══ */}
      {closeModal && (()=>{
        const reg      = registers.find(r=>r.id===closeModal.regId);
        const slot     = allSlots.find(s=>s.key===closeModal.slotKey);
        const primaries= getPrimaries(closeModal.slotKey);
        const entry    = getEntry(closeModal.slotKey, closeModal.regId);
        const tickets  = entry?.tickets||[];
        const startN   = getSessionStartNum(reg, closeModal.slotKey);
        const c        = REG_COLORS[reg?.color]||REG_COLORS.indigo;
        return (
          <div className="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4" onClick={()=>setCloseModal(null)}>
            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md fade-in" onClick={e=>e.stopPropagation()}>
              <div className={`${c.head} text-white px-6 py-4 rounded-t-2xl flex items-center justify-between`}>
                <div>
                  <div className="font-bold text-lg">Close {reg?.name}</div>
                  <div className="text-white text-opacity-70 text-sm">{slot?.label}</div>
                </div>
                <button onClick={()=>setCloseModal(null)} className="text-white text-opacity-70 hover:text-white text-2xl leading-none">✕</button>
              </div>
              <div className="p-6 space-y-4">
                {/* Summary */}
                <div className={`${c.bg} border ${c.border} rounded-xl p-4`}>
                  <div className="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-3">Session Summary</div>
                  <div className="grid grid-cols-3 gap-3 text-center">
                    <div>
                      <div className={`text-xl font-black font-mono ${c.light.split(" ")[1]}`}>{fmtRegNum(reg.prefix, startN)}</div>
                      <div className="text-xs text-slate-500 mt-0.5">Start</div>
                    </div>
                    <div>
                      <div className={`text-xl font-black font-mono ${tickets.length>0?c.light.split(" ")[1]:"text-slate-300"}`}>
                        {tickets.length>0 ? tickets[tickets.length-1].num : "—"}
                      </div>
                      <div className="text-xs text-slate-500 mt-0.5">Last issued</div>
                    </div>
                    <div>
                      <div className="text-xl font-black text-slate-700">{tickets.length}</div>
                      <div className="text-xs text-slate-500 mt-0.5">Tickets</div>
                    </div>
                  </div>
                  {reg.ticketPrice && tickets.length>0 && (
                    <div className="mt-3 pt-3 border-t border-slate-200 flex justify-between">
                      <span className="text-sm text-slate-600">Total collected</span>
                      <span className="font-bold text-emerald-700 text-lg">£{(tickets.length*parseFloat(reg.ticketPrice)).toFixed(2)}</span>
                    </div>
                  )}
                </div>

                <div>
                  <label className="text-xs font-semibold text-slate-500 mb-1.5 block">Closed By (Rota Lead) *</label>
                  <select value={closeForm.closedBy} onChange={e=>setCloseForm({...closeForm,closedBy:e.target.value})}
                    className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 bg-white">
                    <option value="">— Select rota lead</option>
                    {primaries.length>0 && <optgroup label="Rota leads on this slot">
                      {primaries.map(m=><option key={m.id} value={m.id}>{m.name}</option>)}
                    </optgroup>}
                    {members.filter(m=>m.role==="primary"&&!primaries.find(p=>p.id===m.id)).length>0 &&
                      <optgroup label="Other rota leads">
                        {members.filter(m=>m.role==="primary"&&!primaries.find(p=>p.id===m.id)).map(m=>(
                          <option key={m.id} value={m.id}>{m.name}</option>
                        ))}
                      </optgroup>
                    }
                  </select>
                </div>
                <div>
                  <label className="text-xs font-semibold text-slate-500 mb-1.5 block">Notes (optional)</label>
                  <textarea value={closeForm.notes} onChange={e=>setCloseForm({...closeForm,notes:e.target.value})}
                    rows={2} placeholder="Any notes for this session…"
                    className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 resize-none"/>
                </div>
                <div className="flex gap-3 pt-1">
                  <button onClick={confirmClose}
                    className={`flex-1 ${c.btn} text-white rounded-xl py-3 font-bold text-sm`}>
                    ✓ Confirm & Close Register
                  </button>
                  <button onClick={()=>setCloseModal(null)}
                    className="flex-1 bg-slate-100 text-slate-600 rounded-xl py-3 font-semibold text-sm hover:bg-slate-200">Cancel</button>
                </div>
              </div>
            </div>
          </div>
        );
      })()}
    </div>
  );
}

function Avatar({ name, size="md" }) {
  const sz = size==="xs" ? "w-5 h-5 text-xs" : size==="sm" ? "w-6 h-6 text-xs" : "w-9 h-9 text-sm";
  const colors = ["bg-indigo-100 text-indigo-700","bg-violet-100 text-violet-700","bg-emerald-100 text-emerald-700","bg-amber-100 text-amber-700","bg-rose-100 text-rose-700"];
  const c = colors[name.charCodeAt(0)%colors.length];
  return <div className={`${sz} ${c} rounded-full flex items-center justify-center font-bold flex-shrink-0`}>{name[0].toUpperCase()}</div>;
}

function Checkbox({ checked, color="indigo" }) {
  const bg = color==="indigo" ? "bg-indigo-600 border-indigo-600" : "bg-violet-600 border-violet-600";
  return (
    <div className={`w-4 h-4 rounded border-2 flex items-center justify-center flex-shrink-0 ${checked?bg:"border-slate-300"}`}>
      {checked && <svg viewBox="0 0 10 8" className="w-2.5 h-2.5"><path d="M1 4l3 3 5-6" stroke="white" strokeWidth="2" fill="none" strokeLinecap="round"/></svg>}
    </div>
  );
}

function Field({ label, value, onChange, placeholder, type="text" }) {

    <div>
      {label && <label className="text-xs font-medium text-slate-500 mb-1 block">{label}</label>}
      <input type={type} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder}
        className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 bg-white"/>
    </div>
  );
}

function MDItinerary({ itineraries, upItineraries, showToast }) {
  var [editId,     setEditId]     = useState(null);
  var [formTitle,  setFormTitle]  = useState("");
  var [formDesc,   setFormDesc]   = useState("");
  var [formPub,    setFormPub]    = useState(false);
  var [formId,     setFormId]     = useState("");
  var [items,      setItems]      = useState([]);
  var [niName,     setNiName]     = useState("");
  var [niTime,     setNiTime]     = useState("");
  var [niNotes,    setNiNotes]    = useState("");
  var [confirmDel, setConfirmDel] = useState(null);

  // Use prop directly — no local copy to go stale
  var list = itineraries||[];
  var saveList = function(newList) { upItineraries(newList); };

  var openNew = function() {
    var id = Math.random().toString(36).slice(2,9);
    setFormId(id); setFormTitle(""); setFormDesc(""); setFormPub(false);
    setItems([]); setNiName(""); setNiTime(""); setNiNotes("");
    setEditId(id);
  };

  var openEdit = function(itin) {
    setFormId(itin.id); setFormTitle(itin.title||""); setFormDesc(itin.description||""); setFormPub(!!itin.published);
    setItems(itin.items||[]); setNiName(""); setNiTime(""); setNiNotes("");
    setEditId(itin.id);
  };

  var save = function() {
    if (!formTitle.trim()) { showToast("Title is required","error"); return; }
    var updated = { id:formId, title:formTitle.trim(), description:formDesc, items:items, published:formPub };
    var others = list.filter(function(x){ return x.id !== formId; });
    saveList([...others, updated]);
    showToast(formPub ? "Saved & published" : "Saved as draft");
    setEditId(null);
  };

  var doDelete = function(id) {
    saveList(list.filter(function(x){ return x.id !== id; }));
    showToast("Deleted"); setConfirmDel(null);
    if (editId === id) setEditId(null);
  };

  var togglePublish = function(id) {
    var newList = list.map(function(x){ return x.id===id ? {...x, published:!x.published} : x; });
    saveList(newList);
    var itin = newList.find(function(x){ return x.id===id; });
    showToast(itin.published ? "Published — visible to all users" : "Unpublished — draft only");
  };

  var addItem = function() {
    if (!niName.trim()) return;
    setItems([...items, { name:niName.trim(), time:niTime, notes:niNotes }]);
    setNiName(""); setNiTime(""); setNiNotes("");
  };
  var removeItem = function(idx) { setItems(items.filter(function(_,i){ return i!==idx; })); };
  var moveUp     = function(idx) { if(idx===0) return; var a=[...items]; var t=a[idx-1]; a[idx-1]=a[idx]; a[idx]=t; setItems(a); };
  var moveDown   = function(idx) { if(idx===items.length-1) return; var a=[...items]; var t=a[idx]; a[idx]=a[idx+1]; a[idx+1]=t; setItems(a); };

  // Edit / New view
  if (editId !== null) {
    var isNew = !list.find(function(x){ return x.id===editId && x.title; });
    return (
      <div className="space-y-4 max-w-2xl">
        <button onClick={function(){setEditId(null);}} className="text-sm text-indigo-600 hover:underline font-medium">← All Itineraries</button>

        <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 space-y-4">
          <h3 className="font-bold text-slate-800">{isNew ? "New Itinerary" : "Edit Itinerary"}</h3>
          <div>
            <label className="text-xs font-semibold text-slate-500 block mb-1">Title *</label>
            <input value={formTitle} onChange={function(e){setFormTitle(e.target.value);}}
              placeholder="e.g. Sunday Pooja — Order of Service"
              className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300"/>
          </div>
          <div>
            <label className="text-xs font-semibold text-slate-500 block mb-1">Description (optional)</label>
            <textarea value={formDesc} onChange={function(e){setFormDesc(e.target.value);}} rows={2}
              placeholder="Any general notes…"
              className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 resize-none"/>
          </div>
          <label className="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" checked={formPub} onChange={function(e){setFormPub(e.target.checked);}} className="accent-emerald-600"/>
            <span className="text-sm font-semibold text-slate-700">Publish (visible to all users)</span>
          </label>
        </div>

        <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
          <div className="px-5 py-3 border-b border-slate-100 bg-slate-50 font-semibold text-slate-700 text-sm">Order of Service ({items.length} items)</div>
          {items.length === 0 && <div className="px-5 py-6 text-center text-slate-400 text-sm">No items yet — add below</div>}
          <div className="divide-y divide-slate-100">
            {items.map(function(item, idx) {
              return (
                <div key={idx} className="px-4 py-3 flex items-center gap-3">
                  <div className="flex-shrink-0 w-6 h-6 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center text-xs font-bold">{idx+1}</div>
                  <div className="flex-1 min-w-0">
                    <div className="font-semibold text-slate-800 text-sm">{item.name}</div>
                    <div className="text-xs text-slate-400 mt-0.5">
                      {item.time ? <span className="mr-3">{item.time}</span> : null}
                      {item.notes ? <span>{item.notes}</span> : null}
                    </div>
                  </div>
                  <div className="flex gap-1 flex-shrink-0">
                    <button onClick={function(){moveUp(idx);}} disabled={idx===0} className="w-6 h-6 rounded bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs flex items-center justify-center disabled:opacity-30">↑</button>
                    <button onClick={function(){moveDown(idx);}} disabled={idx===items.length-1} className="w-6 h-6 rounded bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs flex items-center justify-center disabled:opacity-30">↓</button>
                    <button onClick={function(){removeItem(idx);}} className="w-6 h-6 rounded bg-red-50 hover:bg-red-100 text-red-500 text-xs flex items-center justify-center">✕</button>
                  </div>
                </div>
              );
            })}
          </div>
          <div className="px-4 py-4 border-t border-slate-100 bg-slate-50 space-y-2">
            <div className="text-xs font-semibold text-slate-500 uppercase tracking-wide">Add Item</div>
            <input value={niName} onChange={function(e){setNiName(e.target.value);}}
              placeholder="Item name e.g. Ganapathi Pooja *"
              className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 bg-white"/>
            <div className="grid grid-cols-2 gap-2">
              <input value={niTime} onChange={function(e){setNiTime(e.target.value);}} placeholder="Time e.g. 10:00 AM"
                className="border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 bg-white"/>
              <input value={niNotes} onChange={function(e){setNiNotes(e.target.value);}} placeholder="Notes (optional)"
                className="border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 bg-white"/>
            </div>
            <button onClick={addItem} disabled={!niName.trim()}
              className="w-full bg-indigo-600 text-white rounded-lg py-2 text-sm font-bold hover:bg-indigo-700 disabled:opacity-40">
              + Add to Itinerary
            </button>
          </div>
        </div>

        <div className="flex gap-3">
          <button onClick={save} className="flex-1 bg-emerald-600 text-white rounded-xl py-3 text-sm font-bold hover:bg-emerald-700">Save Itinerary</button>
          <button onClick={function(){setEditId(null);}} className="px-5 bg-slate-100 text-slate-600 rounded-xl py-3 text-sm font-semibold hover:bg-slate-200">Cancel</button>
        </div>
      </div>
    );
  }

  // List view
  return (
    <div className="space-y-4 max-w-2xl">
      <div className="flex items-center justify-between gap-3">
        <div>
          <h2 className="text-xl font-bold text-slate-800">Pooja Itineraries</h2>
          <p className="text-sm text-slate-500 mt-0.5">{list.filter(function(x){return x.published;}).length} published · {list.length} total</p>
        </div>
        <button onClick={openNew} className="bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-bold hover:bg-indigo-700">+ New</button>
      </div>

      {list.length === 0 ? (
        <div className="bg-white rounded-2xl border border-slate-200 p-12 text-center text-slate-400">
          <div className="text-4xl mb-2">🕉</div>
          <p className="font-semibold">No itineraries yet</p>
          <p className="text-sm mt-1">Click New to create one</p>
        </div>
      ) : (
        <div className="space-y-3">
          {list.map(function(itin) {
            return (
              <div key={itin.id} className="bg-white rounded-2xl border border-slate-200 shadow-sm p-4">
                <div className="flex items-start gap-3">
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center gap-2 flex-wrap">
                      <span className="font-bold text-slate-800">{itin.title||"Untitled"}</span>
                      {itin.published
                        ? <span className="text-xs bg-emerald-100 text-emerald-700 border border-emerald-200 px-2 py-0.5 rounded-full font-bold">✓ Published</span>
                        : <span className="text-xs bg-slate-100 text-slate-500 border border-slate-200 px-2 py-0.5 rounded-full">Draft</span>
                      }
                    </div>
                    {itin.description ? <p className="text-xs text-slate-400 mt-0.5">{itin.description}</p> : null}
                    <p className="text-xs text-slate-400 mt-1">{(itin.items||[]).length} items</p>
                  </div>
                  <div className="flex gap-2 flex-shrink-0 flex-wrap justify-end">
                    <button onClick={function(){togglePublish(itin.id);}}
                      className={"text-xs px-3 py-1.5 rounded-lg font-semibold border " + (itin.published ? "bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100" : "bg-emerald-50 border-emerald-200 text-emerald-700 hover:bg-emerald-100")}>
                      {itin.published ? "Unpublish" : "Publish"}
                    </button>
                    <button onClick={function(){openEdit(itin);}} className="text-xs bg-slate-50 border border-slate-200 text-slate-600 px-3 py-1.5 rounded-lg hover:bg-slate-100 font-semibold">Edit</button>
                    <button onClick={function(){setConfirmDel(itin);}} className="text-xs bg-red-50 border border-red-200 text-red-500 px-3 py-1.5 rounded-lg hover:bg-red-100 font-semibold">Delete</button>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {confirmDel ? (
        <div className="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50 p-4">
          <div className="bg-white rounded-2xl shadow-xl p-6 max-w-sm w-full space-y-4">
            <h3 className="font-bold text-slate-800">Delete itinerary?</h3>
            <p className="text-sm text-slate-500">"{confirmDel.title}" will be permanently deleted.</p>
            <div className="flex gap-3">
              <button onClick={function(){doDelete(confirmDel.id);}} className="flex-1 bg-red-600 text-white rounded-xl py-2.5 font-bold text-sm hover:bg-red-700">Delete</button>
              <button onClick={function(){setConfirmDel(null);}} className="flex-1 bg-slate-100 text-slate-700 rounded-xl py-2.5 font-semibold text-sm hover:bg-slate-200">Cancel</button>
            </div>
          </div>
        </div>
      ) : null}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));

    root.render(<App/>);
</script>
</body>
</html>
