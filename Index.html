<body class="bg-slate-50">
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ─── helpers ────────────────────────────────────────────────────────────────
const uid = () => Math.random().toString(36).slice(2,9);
const roleLabel = r => r==="primary" ? "Rota Lead" : r==="secondary" ? "Secondary" : r==="volunteer" ? "Volunteer" : (r||"");

const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

function getWeeksForYear(year) {
  const weeks = [];
  let d = new Date(year, 0, 1);
  while (d.getDay() !== 0) d.setDate(d.getDate()+1);
  for (let n=1; n<=53; n++) {
    if (d.getFullYear() > year) break;
    weeks.push({
      key: `${year}-w${n}`,
      weekNum: n,
      date: new Date(d.getTime()),
      label: `Week ${n} — ${d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})}`,
      isSpecial: false,
    });
    d.setDate(d.getDate()+7);
  }
  return weeks;
}

// ─── local storage helpers ───────────────────────────────────────────────────
// ─── LocalStorage helper (kept for migration only) ───────────────────────────
const LS = {
  get:  (k, fallback) => { try { const v=localStorage.getItem(k); return v?JSON.parse(v):fallback; } catch{ return fallback; } },
  set:  (k, v)        => { try { localStorage.setItem(k, JSON.stringify(v)); } catch{} },
  keys: ()            => { try { return Object.keys(localStorage).filter(k=>k.startsWith("rota-")); } catch{ return []; } },
  del:  (k)           => { try { localStorage.removeItem(k); } catch{} },
};

// ─── Supabase config (stored in localStorage so each device can set its own) ──
const SUPA_CFG_KEY = "rota-supabase-cfg";
// Default project — used on every device unless overridden in Settings
const DEFAULT_SUPA_CFG = {
  url: "https://gumjguhocrnrkukwopkb.supabase.co",
  key: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd1bWpndWhvY3Jucmt1a3dvcGtiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMyNzY5MDIsImV4cCI6MjA4ODg1MjkwMn0.bM_wt5f--Ky1Z9THeZDWOKICYfuPXG4eI4NO9WZRa2Q",
};
const getSupaCfg   = () => { const c = LS.get(SUPA_CFG_KEY, null); return (c && c.url && c.key) ? c : DEFAULT_SUPA_CFG; };
const isConfigured = () => { const c=getSupaCfg(); return !!(c.url && c.key); };

// ─── Supabase DB helper ───────────────────────────────────────────────────────
// Data lives in table app_data, which the browser cannot read or write directly.
// All access goes through server functions (supabase/lockdown.sql): rota_public,
// rota_login, rota_register, rota_reset_pin, rota_load, rota_save, rota_logout.
// Falls back to localStorage if Supabase not configured
const DB = {
  token: null,      // session token from rota_login
  onError: null,    // set by App to surface save failures
  rpc: async (fn, args) => {
    const c = getSupaCfg();
    const r = await fetch(c.url.replace(/\/+$/,"") + "/rest/v1/rpc/" + fn, {
      method: "POST",
      headers: { "Content-Type":"application/json", "apikey": c.key, "Authorization": "Bearer " + c.key },
      body: JSON.stringify(args || {}),
    });
    if (!r.ok) throw new Error("Error " + r.status + ": " + (await r.text()).slice(0, 150));
    return r.json();
  },
  // Org config for the sign-in screen — called on startup
  loadPublic: async () => {
    if (!isConfigured()) return null;
    try { return await DB.rpc("rota_public"); }
    catch(e) { console.error("DB.loadPublic failed:", e); return null; }
  },
  // Load all keys at once — called after sign-in
  loadAll: async () => {
    if (!isConfigured()) return null; // signal: use localStorage
    try {
      const res = await DB.rpc("rota_load", { p_token: DB.token });
      if (res.error) throw new Error(res.error);
      return res.data;
    } catch(e) { console.error("DB.loadAll failed:", e); return null; }
  },
  // Save a single key
  set: async (key, value) => {
    if (!isConfigured()) { LS.set(key, value); return; }
    if (!DB.token) return;
    try {
      const res = await DB.rpc("rota_save", { p_token: DB.token, p_key: key, p_value: value });
      if (res.error) { console.error("DB.set error:", key, res.error); if (DB.onError) DB.onError(res.error); }
    } catch(e) { console.error("DB.set failed:", e); if (DB.onError) DB.onError(e.message); }
  },
  logout: async () => {
    if (isConfigured() && DB.token) { try { await DB.rpc("rota_logout", { p_token: DB.token }); } catch(e) {} }
    DB.token = null;
  },
  // Read single key (used for offline fallback only)
  get: (key, fallback) => LS.get(key, fallback),
};

const DEFAULT_CONFIG = {
  orgName: "Volunteer Rota", location: "Community Hall, Main Street",
  day: "Sunday", startTime: "10:00", duration: 3, year: 2026,
};

// Organisation name made safe for file names, e.g. "St Mary's Hall" → "St_Marys_Hall"
const fileSlug = name => (name || "Rota").replace(/[^A-Za-z0-9 _-]/g, "").trim().replace(/\s+/g, "_") || "Rota";

// ─── Organisation logo (config.logo = small data URL, set in Settings) ───────
// Shrinks an uploaded picture to at most 256px so it stays small in the config.
const resizeLogo = file => new Promise((resolve, reject) => {
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    const scale = Math.min(1, 256 / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    resolve(file.type === "image/png" ? c.toDataURL("image/png") : c.toDataURL("image/jpeg", 0.9));
  };
  img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("That file isn't a picture we can read")); };
  img.src = url;
});

// Logo on a white tile (shows on any background); `fallback` when no logo is set
function OrgLogo({ config, size = "w-10 h-10", fallback = null }) {
  if (!config.logo) return fallback;
  return (
    <div className={size + " rounded-xl bg-white flex items-center justify-center overflow-hidden flex-shrink-0 shadow-sm"}>
      <img src={config.logo} alt={config.orgName || "Logo"} className="max-w-full max-h-full object-contain p-0.5"/>
    </div>
  );
}

// A new organisation starts empty; everything is added by its admin.
const DEFAULT_ACTIVITIES = [];

// Register prefix = first letter of each word (e.g. "Archanai" → "A", "Donation" → "D")
const initials = name => name.trim().split(/\s+/).map(w=>w[0].toUpperCase()).join("");
const fmtRegNum = (prefix, n) => `${prefix}${String(n).padStart(3,"0")}`;

const DEFAULT_REGISTERS = [];

// ─── Toast ───────────────────────────────────────────────────────────────────
function Toast({ msg, type }) {
  return (
    <div className={`fixed top-5 right-5 z-50 px-5 py-3 rounded-xl shadow-2xl text-white text-sm font-semibold fade-in pointer-events-none ${type==="error"?"bg-red-500":"bg-emerald-500"}`}>
      {type==="error"?"⚠️ ":"✓ "}{msg}
    </div>
  );
}

// ─── App ─────────────────────────────────────────────────────────────────────

function App() {
  // ── DB loading state ──────────────────────────────────────────────────────
  const [dbLoaded,  setDbLoaded]  = useState(false);
  const [dbError,   setDbError]   = useState(null);
  const [showSetup, setShowSetup] = useState(!LS.get("rota-skip-setup", false));

  const [config, setConfig]   = useState(DEFAULT_CONFIG);
  const [activities, setActs] = useState(DEFAULT_ACTIVITIES);
  const [members, setMembers] = useState([]);
  const [rotas, setRotas]     = useState({});
  const [specials, setSpec]   = useState([]);
  const [registers, setRegs]  = useState(DEFAULT_REGISTERS);
  const [regEntries, setRegEntries] = useState({});
  const [rotaSheets, setRotaSheets] = useState([]);
  const [generalOffers, setGeneralOffers] = useState([]);
  const [toast, setToast]     = useState(null);
  const toastTimer            = useRef(null);

  // Auth: userRole = null | "admin" | "rota-lead" | "secondary" | "volunteer"
  const [authMode, setAuthMode] = useState("choose");
  const [userRole, setUserRole] = useState(null);
  const [currentUser, setCurrentUser] = useState(null); // { name, email, memberId, memberRole }

  // Nav
  const [topTab, setTopTab] = useState("Volunteer");
  const [subTab, setSubTab] = useState("Requests");

  // ── Financial/inventory state (must be before any non-hook code) ────────────
  const [cashInHand,    setCashInHand]    = useState(Object.fromEntries([["£50",""],["£20",""],["£10",""],["£5",""],["£2",""],["£1",""],["50p",""],["20p",""],["10p",""],["5p",""]]));
  const [sevas,         setServices]      = useState([]);
  const [sponsorships,  setSponsorships]  = useState([]);
  const [inventory,     setInventory]     = useState([]);
  const [itineraries,   setItineraries]   = useState([]);
  const [prasadham,     setPrasadham]     = useState([]);
  const [priests,       setPriests]       = useState([]);
  const showToast = (msg, type="success") => {
    clearTimeout(toastTimer.current);
    setToast({msg,type});
    toastTimer.current = setTimeout(()=>setToast(null), 2800);
  };

  const upConfig     = v => { const { adminPin, ...rest } = v; setConfig(isConfigured() ? rest : v); DB.set("rota-config", v); };
  const upActs       = v => { setActs(v);        DB.set("rota-acts",      v); };
  const upMembers    = v => { setMembers(v);     DB.set("rota-members",   v); };
  const upRotas      = updater => { if (typeof updater === "function") { setRotas(prev => { const next = updater(prev); DB.set("rota-rotas", next); return next; }); } else { DB.set("rota-rotas", updater); setRotas(updater); } };
  const upSpecials   = v => { setSpec(v);        DB.set("rota-specials",  v); };
  const upRegs       = v => { setRegs(v);        DB.set("rota-registers", v); };
  const upRegEntries = v => { setRegEntries(v);  DB.set("rota-regentries",v); };
  const upRotaSheets = v => { setRotaSheets(v);  DB.set("rota-sheets",    v); };
  const upGeneralOffers = v => { setGeneralOffers(v); DB.set("rota-offers", v); };
  const upCashInHand   = v => { setCashInHand(v);   DB.set("rota-cash",         v); };
  const upServices     = v => { setServices(v);     DB.set("rota-sevas",        v); };
  const upSponsorships = v => { setSponsorships(v); DB.set("rota-sponsorships", v); };
  const upInventory    = v => { setInventory(v);    DB.set("rota-inventory",    v); };
  const upItineraries  = v => { setItineraries(v);  DB.set("rota-itineraries",  v); };
  const upPrasadham    = v => { setPrasadham(v);    DB.set("rota-prasadham",    v); };
  const upPriests      = v => { setPriests(v);      DB.set("rota-priests",      v); };

  // ── Load all data from Supabase (or localStorage) on mount ────────────────
  useEffect(() => {
    (async () => {
      if (!isConfigured()) {
        // No Supabase — load from localStorage
        const storedConfig  = LS.get("rota-config",      DEFAULT_CONFIG);
        const storedActs    = LS.get("rota-acts",         DEFAULT_ACTIVITIES);
        const storedMembers = LS.get("rota-members",      []);
        const storedRotas   = LS.get("rota-rotas",        {});
        const storedSpec    = LS.get("rota-specials",     []);
        const storedRegs    = LS.get("rota-registers",    DEFAULT_REGISTERS);
        const storedRE      = LS.get("rota-regentries",   {});
        const storedSheets  = LS.get("rota-sheets",       []);
        const storedOffers  = LS.get("rota-offers",       []);
        const storedCash    = LS.get("rota-cash",         Object.fromEntries([["£50",""],["£20",""],["£10",""],["£5",""],["£2",""],["£1",""],["50p",""],["20p",""],["10p",""],["5p",""]]));
        const storedSevas   = LS.get("rota-sevas",        []);
        const storedSpons   = LS.get("rota-sponsorships", []);
        const storedInv     = LS.get("rota-inventory",    []);
        const storedItin    = LS.get("rota-itineraries", []);
    const storedPrasadham = LS.get("rota-prasadham", []);
    const storedPriests   = LS.get("rota-priests",   []);
        setConfig(storedConfig);
        setActs(storedActs);
        setMembers(storedMembers);
        setRotas(storedRotas);
        setSpec(storedSpec);
        setRegs(storedRegs);
        setRegEntries(storedRE);
        setRotaSheets(storedSheets);
        setGeneralOffers(storedOffers);
        setCashInHand(storedCash);
        setServices(storedSevas);
        setSponsorships(storedSpons);
        setInventory(storedInv);
        setItineraries(storedItin);
    setPrasadham(storedPrasadham);
    setPriests(storedPriests);
        setDbLoaded(true);
        return;
      }
      // Supabase configured — sign-in screen only needs the org config
      try {
        const pub = await DB.loadPublic();
        if (!pub) throw new Error("Failed to load from Supabase");
        setConfig({ ...DEFAULT_CONFIG, ...pub["rota-config"] });
        setDbLoaded(true);
      } catch(e) {
        setDbError("Could not connect to Supabase: " + e.message);
        setDbLoaded(true); // show error state
      }
    })();
  }, []);

  // ── Apply all data from Supabase (after sign-in) ──────────────────────────
  const applyData = (map) => {
        const g = (k, fb) => (k in map) ? map[k] : fb;
        setConfig({ ...DEFAULT_CONFIG, ...g("rota-config", {}) });
        setActs(g("rota-acts",          DEFAULT_ACTIVITIES));
        setMembers(g("rota-members",    []));
        setRotas(g("rota-rotas",        {}));
        setSpec(g("rota-specials",      []));
        setRegs(g("rota-registers",     DEFAULT_REGISTERS));
        setRegEntries(g("rota-regentries", {}));
        setRotaSheets(g("rota-sheets",  []));
        setGeneralOffers(g("rota-offers", []));
        setCashInHand(g("rota-cash",    Object.fromEntries([["£50",""],["£20",""],["£10",""],["£5",""],["£2",""],["£1",""],["50p",""],["20p",""],["10p",""],["5p",""]])));
        setServices(g("rota-sevas", []));
        setSponsorships(g("rota-sponsorships", []));
        setInventory(g("rota-inventory", []));
        setItineraries(g("rota-itineraries", []));
        setPrasadham(g("rota-prasadham", []));
        setPriests(g("rota-priests", []));
  };

  const weeks = getWeeksForYear(config.year);
  const allSlots = [...weeks, ...specials.map(s=>({...s,isSpecial:true}))].sort((a,b)=>new Date(a.date)-new Date(b.date));

  // ── Role flags ────────────────────────────────────────────────────────────
  const isAdmin      = userRole === "admin";
  const isRotaLead   = userRole === "rota-lead";
  const isSecondary  = userRole === "secondary";
  const isVolunteer  = userRole === "volunteer";
  const canManage    = isAdmin || isRotaLead;  // can accept/reject/clarify
  const isApproved   = isAdmin || isRotaLead || isSecondary || (currentUser && currentUser.approved !== false);

  // ── Nav tables per role ────────────────────────────────────────────────────
  // Admin: everything · Rota Lead: Rota + Volunteer · Secondary/Volunteer: Volunteer only
  const TOP_TABS = isAdmin ? ["Admin","Rota","Volunteer"]
               : isRotaLead ? ["Rota","Volunteer"]
               : ["Volunteer"];
  const volunteerTabs = isApproved
    ? ["Pooja Itinerary","Services","My Requests"]
    : ["My Requests"];
  const rotaTabs = ["Rota Calendar","Rota Sheet","Requests"];
  const SUB_TABS = {
    Admin:     ["Dashboard","Master Data","Settings"],
    Rota:      rotaTabs,
    Volunteer: volunteerTabs,
  };

  const switchTop = t => { setTopTab(t); setSubTab((SUB_TABS[t]||[])[0]||"Requests"); };
  const setTab = name => {
    const tops = Object.keys(SUB_TABS);
    for (let ti=0; ti<tops.length; ti++) {
      const top = tops[ti]; const subs = SUB_TABS[top];
      if (subs.includes(name)) { setTopTab(top); setSubTab(name); return; }
    }
  };

  // ── Badge counts ──────────────────────────────────────────────────────────
  // For managers: pending volunteer responses (actInterest pending) + new general offers
  const pendingApprovals = members.filter(function(m){return m.approved===false;}).length;
  const totalPendingRequests = Object.values(rotas).reduce((s,r) =>
    s + (r.slotRequests||[]).filter(x=>x.status==="pending").length
      + Object.values(r.actInterest||{}).filter(x=>x.status==="pending").length, 0)
    + generalOffers.filter(x=>x.status==="pending" && !isSwap(x)).length
    + pendingApprovals;
  // For the admin: swap requests waiting on the Assignments screen
  const pendingSwaps = isAdmin ? generalOffers.filter(x=>isSwap(x) && x.status==="pending").length : 0;

  // For volunteers: count of help-wanted items they haven't yet responded to
  const today0 = new Date(); today0.setHours(0,0,0,0);
  const newRequestsForMe = currentUser ? Object.values(rotas).reduce((s, r) => {
    const hwCount = (r.helpWanted||[]).filter(actId => {
      const ownerId  = (r.actOwners||{})[actId];
      const interest = (r.actInterest||{})[actId];
      return !ownerId && (!interest || interest.memberId !== currentUser.memberId);
    }).length;
    return s + hwCount;
  }, 0) : 0;

  // Clarify count: how many of my responses need attention
  const myPendingClarify = currentUser ? Object.values(rotas).reduce((s,r) =>
    s + (r.slotRequests||[]).filter(x=>x.memberId===currentUser.memberId&&x.status==="clarify").length
      + Object.values(r.actInterest||{}).filter(x=>x.memberId===currentUser.memberId&&x.status==="clarify").length, 0) : 0;

  DB.onError = msg => showToast(msg === "session" ? "Session expired — please sign out and sign in again" : "Couldn't save: " + msg, "error");

  const logout = () => {
    if (isConfigured()) { DB.logout().then(() => window.location.reload()); return; }
    setUserRole(null); setCurrentUser(null); setAuthMode("choose");
    setTopTab("Volunteer"); setSubTab("Rota Calendar");
  };

  // ── Loading / setup gates ─────────────────────────────────────────────────
  if (!dbLoaded) {
    return (
      <div className="min-h-screen bg-gradient-to-br from-indigo-50 to-violet-50 flex flex-col items-center justify-center gap-5">
        <OrgLogo config={config} size="w-20 h-20" fallback={
          <div className="w-16 h-16 rounded-2xl bg-indigo-600 flex items-center justify-center text-3xl shadow-lg">🕉️</div>}/>
        <div className="text-center">
          <div className="font-bold text-slate-800 text-xl">{config.orgName || "Volunteer Rota"}</div>
          <div className="text-slate-500 text-sm mt-1">{isConfigured() ? "Connecting to database…" : "Loading…"}</div>
        </div>
        <div className="flex gap-1.5">
          {[0,1,2].map(i=>(
            <div key={i} className="w-2 h-2 rounded-full bg-indigo-400 animate-bounce" style={{animationDelay:i*0.15+"s"}}/>
          ))}
        </div>
        {dbError && (
          <div className="bg-red-50 border border-red-200 rounded-xl px-5 py-3 text-red-700 text-sm max-w-sm text-center">
            <strong>Connection error</strong><br/>{dbError}
          </div>
        )}
      </div>
    );
  }

  if (!isConfigured() && showSetup) {
    return <SupabaseSetup onDone={()=>{ window.location.reload(); }} onSkip={()=>{ LS.set("rota-skip-setup", true); setShowSetup(false); }}/>;
  }

  // ── Auth gate ─────────────────────────────────────────────────────────────
  if (!userRole) {
    return (
      <AuthScreen
        authMode={authMode} setAuthMode={setAuthMode}
        members={members} upMembers={upMembers}
        config={config}
        onLogin={async (user) => {
          if (isConfigured()) {
            const map = await DB.loadAll();
            if (!map) { DB.token = null; showToast("Could not load data — please try again", "error"); return; }
            applyData(map);
          }
          setCurrentUser(user);
          const role = user.isAdmin ? "admin"
                     : user.memberRole === "primary" ? "rota-lead"
                     : user.memberRole === "secondary" ? "secondary"
                     : "volunteer";
          setUserRole(role);
          if (role === "admin") { setTopTab("Admin"); setSubTab("Dashboard"); }
          else if (role === "rota-lead") { setTopTab("Rota"); setSubTab("Rota Calendar"); }
          else {
            setTopTab("Volunteer");
            const approved = user.memberRole === "secondary" || user.approved !== false;
            setSubTab(approved ? "Pooja Itinerary" : "My Requests");
          }
          setAuthMode("done");
        }}
        showToast={showToast}
      />
    );
  }

  const roleBadge = isAdmin
    ? { icon:"⚙️", label:"Administrator", cls:"bg-amber-500 bg-opacity-70 border-amber-400 border-opacity-40 text-amber-100" }
    : isRotaLead
    ? { icon:"🎯", label:"Rota Lead",     cls:"bg-emerald-500 bg-opacity-70 border-emerald-400 border-opacity-40 text-emerald-100" }
    : isSecondary
    ? { icon:"🟣", label:"Secondary",     cls:"bg-violet-500 bg-opacity-70 border-violet-400 border-opacity-40 text-violet-100" }
    : { icon:"🙋", label:"Volunteer",     cls:"bg-indigo-500 bg-opacity-60 border-indigo-400 border-opacity-40 text-indigo-100" };

  return (
    <div className="min-h-screen bg-slate-50 pb-24 md:pb-0">

      <header className="bg-indigo-700 text-white shadow-lg sticky top-0 z-40">
        <div className="max-w-7xl mx-auto px-3 md:px-4 pt-3 pb-0">

              <OrgLogo config={config} size="w-9 h-9 md:w-12 md:h-12"/>

                <h1 className="text-base md:text-2xl font-bold tracking-tight truncate leading-tight">{config.logo ? "" : "📋 "}{config.orgName}</h1>
                <p className="text-indigo-300 text-xs mt-0.5 truncate hidden md:block">📍 {config.location} &nbsp;·&nbsp; {config.day}s &nbsp;·&nbsp; {config.startTime}</p>

            <div className="flex items-center gap-2 flex-shrink-0">
              <div className="text-right">
                <div className="text-xs md:text-sm font-bold text-white leading-tight">{roleBadge.icon} {currentUser?.name || "Admin"}</div>
                <span className={`text-xs font-semibold px-2 py-0.5 rounded-full border ${roleBadge.cls}`}>{roleBadge.label}</span>
              </div>
              <button onClick={logout} className="text-indigo-300 hover:text-white text-xs border border-indigo-500 rounded-lg px-2 py-1 ml-1">Out</button>
            </div>
          </div>

          {/* Desktop top tabs — hidden on mobile */}
          <div className="hidden md:flex gap-1">
            {TOP_TABS.map(t => {
              const badge = t==="Admin" && pendingSwaps>0 ? pendingSwaps
                          : t==="Rota" && canManage && totalPendingRequests>0 ? totalPendingRequests
                          : t==="Volunteer" && (newRequestsForMe+myPendingClarify)>0 ? (newRequestsForMe+myPendingClarify) : 0;
              const icons = { Admin:"⚙️", Rota:"📅", Volunteer:"🙋" };
              return (
                <button key={t} onClick={()=>switchTop(t)}
                  className={"relative px-5 py-2.5 text-sm font-semibold rounded-t-xl transition-all "+(topTab===t?"bg-white text-indigo-700 shadow-sm":"text-indigo-200 hover:bg-indigo-600 hover:text-white")}>
                  {icons[t]} {t}
                  {badge > 0 && <span className="absolute -top-1 -right-1 bg-red-500 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold leading-none">{badge}</span>}
                </button>
              );
            })}
          </div>

          {/* Mobile: current section label */}
          <div className="md:hidden flex items-center gap-2 pb-2">
            <span className="text-xs text-indigo-300 font-medium">{topTab} &rsaquo; {subTab}</span>
          </div>
        </div>

        {/* Sub-tab bar */}
        <div className="bg-white border-b border-slate-200">
          <div className="max-w-7xl mx-auto px-2 flex gap-1.5 md:gap-0.5 py-2 md:py-0 md:pt-1 md:overflow-x-auto scrollbar-hide">
            {(SUB_TABS[topTab]||[]).map(s => {
              const icons2 = {"Dashboard":"📊","Requests":"📥","My Requests":"📥","Master Data":"🗂️","Settings":"⚙️","Rota Calendar":"📅","Rota Sheet":"📋","Services":"🙏","Pooja Itinerary":"🕉️"};
              const badge = s==="Master Data" && pendingSwaps>0 ? pendingSwaps
                          : s==="Requests" && canManage && totalPendingRequests>0 ? totalPendingRequests
                          : s==="My Requests" && (newRequestsForMe+myPendingClarify)>0 ? (newRequestsForMe+myPendingClarify) : 0;
              return (
                <button key={s} onClick={()=>setSubTab(s)}
                  className={"relative flex-1 md:flex-none flex flex-col md:block items-center gap-0.5 px-1 md:px-3 py-1.5 md:py-2 text-xs md:text-sm font-semibold md:font-medium whitespace-nowrap transition-colors rounded-xl md:rounded-none border md:border-0 md:border-b-2 "+(subTab===s
                    ?"bg-indigo-600 text-white border-indigo-600 shadow-sm md:bg-transparent md:shadow-none md:text-indigo-700"
                    :"bg-slate-100 text-slate-700 border-slate-200 md:bg-transparent md:border-transparent md:text-slate-500 hover:text-slate-800 md:hover:border-slate-300")}>
                  <span className="text-lg md:text-sm leading-none">{icons2[s]}</span> {s}
                  {badge > 0 && <span className="absolute -top-1 -right-1 bg-red-500 text-white text-xs w-4 h-4 rounded-full flex items-center justify-center font-bold leading-none">{badge}</span>}
                </button>
              );
            })}
          </div>
        </div>
      </header>

      {toast && <Toast {...toast}/>}

      <main className="max-w-7xl mx-auto px-3 md:px-4 py-3 md:py-6">
        {isVolunteer && !isApproved && (
          <div className="mb-4 bg-amber-50 border border-amber-200 rounded-2xl px-5 py-4 flex items-start gap-3">
            <span className="text-2xl flex-shrink-0">⏳</span>
            <div>
              <div className="font-bold text-amber-800">Account pending approval</div>
              <p className="text-sm text-amber-700 mt-0.5">Your registration is awaiting admin approval. Once approved you will be able to see Services and Pooja Itinerary. You can still send availability requests below.</p>
            </div>
          </div>
        )}
        {subTab==="Dashboard"    && <Dashboard allSlots={allSlots} rotas={rotas} members={members} activities={activities} config={config} setTab={setTab} sponsorships={sponsorships} prasadham={prasadham} priests={priests} rotaSheets={rotaSheets}/>}
        {subTab==="Rota Calendar"&& <RotaCalendarWithSettings allSlots={allSlots} rotas={rotas} upRotas={upRotas} members={members} activities={activities} config={config} upConfig={upConfig} specials={specials} upSpecials={upSpecials} showToast={showToast} isAdmin={isAdmin} isRotaLead={isRotaLead} currentUser={currentUser} priests={priests} prasadham={prasadham}/>}
        {subTab==="Requests"     && canManage && <RequestsInbox rotas={rotas} upRotas={upRotas} allSlots={allSlots} members={members} upMembers={upMembers} activities={activities} generalOffers={generalOffers} upGeneralOffers={upGeneralOffers} showToast={showToast} currentUser={currentUser} isAdmin={isAdmin} canManage={canManage}/>}
        {subTab==="My Requests"  && <VolunteerRequests members={members} rotas={rotas} upRotas={upRotas} allSlots={allSlots} activities={activities} generalOffers={generalOffers} upGeneralOffers={upGeneralOffers} currentUser={currentUser} showToast={showToast}/>}
        {subTab==="Services"        && <VolunteerServices sevas={sevas}/>}
        {subTab==="Pooja Itinerary" && <VolunteerItinerary itineraries={itineraries}/>}
        {subTab==="Master Data"  && <MasterData generalOffers={generalOffers} upGeneralOffers={upGeneralOffers} members={members} upMembers={upMembers} specials={specials} upSpecials={upSpecials} activities={activities} upActs={upActs} registers={registers} upRegs={upRegs} regEntries={regEntries} showToast={showToast} rotas={rotas} upRotas={upRotas} allSlots={allSlots} cashInHand={cashInHand} upCashInHand={upCashInHand} sevas={sevas} upServices={upServices} sponsorships={sponsorships} upSponsorships={upSponsorships} inventory={inventory} upInventory={upInventory} rotaSheets={rotaSheets} itineraries={itineraries} upItineraries={upItineraries} prasadham={prasadham} upPrasadham={upPrasadham} priests={priests} upPriests={upPriests}/>}
        {subTab==="Rota Sheet"   && <RotaSheetTab rotaSheets={rotaSheets} upRotaSheets={upRotaSheets} members={members} registers={registers} upRegs={upRegs} regEntries={regEntries} upRegEntries={upRegEntries} rotas={rotas} config={config} allSlots={allSlots} showToast={showToast} sevas={sevas} sponsorships={sponsorships} inventory={inventory} cashInHand={cashInHand} upCashInHand={upCashInHand} isAdmin={isAdmin} priests={priests} prasadham={prasadham} currentUser={currentUser}/>}
        {subTab==="Settings"     && <Settings config={config} upConfig={upConfig} showToast={showToast}
    allData={{config,activities,members,rotas,specials,registers,regEntries,rotaSheets,generalOffers,cashInHand,sevas,sponsorships,inventory,itineraries,prasadham,priests}}/>}
      </main>

      {/* ── Mobile bottom nav — hidden on desktop ── */}
      <nav className="md:hidden fixed bottom-0 left-0 right-0 z-50 bg-white border-t border-slate-200 shadow-lg safe-area-bottom">
        <div className="flex items-stretch gap-2 px-2 py-2">
          {TOP_TABS.map(t => {
            const badge = t==="Admin" && pendingSwaps>0 ? pendingSwaps
                        : t==="Rota" && canManage && totalPendingRequests>0 ? totalPendingRequests
                        : t==="Volunteer" && (newRequestsForMe+myPendingClarify)>0 ? (newRequestsForMe+myPendingClarify) : 0;
            const icons = { Admin:"⚙️", Rota:"📅", Volunteer:"🙋" };
            const active = topTab===t;
            return (
              <button key={t} onClick={()=>switchTop(t)}
                className={"flex-1 flex flex-col items-center justify-center py-2 gap-0.5 relative rounded-xl border transition-colors "+(active?"bg-indigo-600 border-indigo-600 text-white shadow":"bg-slate-100 border-slate-200 text-slate-700 active:bg-slate-200")}>
                <span className="text-xl leading-none">{icons[t]}</span>
                <span className="text-sm font-bold leading-tight">{t}</span>
                {badge > 0 && <span className="absolute top-1 right-3 bg-red-500 text-white text-xs w-4 h-4 rounded-full flex items-center justify-center font-bold leading-none">{badge}</span>}
              </button>
            );
          })}
        </div>
      </nav>
    </div>
  );
}

// ─── Security question + date of birth (used to reset a forgotten PIN) ───────
const SECURITY_QUESTIONS = [
  "Name of your first school",
  "Your mother's maiden name",
  "The town or village where you were born",
  "Name of your first pet",
  "Your favourite temple",
];
const OWN_QUESTION = "__own__";
// value = { q, own, a, dob }; question sent to the server is pickQuestion(value)
const pickQuestion = v => v.q === OWN_QUESTION ? v.own.trim() : v.q;

function RecoveryFields({ value, onChange, ic }) {
  const set = patch => onChange({ ...value, ...patch });
  return (
    <div className="space-y-2">
      <div>
        <label className="text-xs font-semibold text-slate-500 block mb-1">Security Question *</label>
        <select value={value.q} onChange={e=>set({q:e.target.value})} className={ic}>
          <option value="">Choose a question…</option>
          {SECURITY_QUESTIONS.map(q => <option key={q} value={q}>{q}</option>)}
          <option value={OWN_QUESTION}>Write my own question…</option>
        </select>
      </div>
      {value.q === OWN_QUESTION && (
        <input value={value.own} onChange={e=>set({own:e.target.value})} placeholder="Your question" className={ic}/>
      )}
      <div>
        <label className="text-xs font-semibold text-slate-500 block mb-1">Your Answer *</label>
        <input value={value.a} onChange={e=>set({a:e.target.value})} placeholder="Something only you would know" autoComplete="off" className={ic}/>
      </div>
      <div>
        <label className="text-xs font-semibold text-slate-500 block mb-1">Date of Birth *</label>
        <input value={value.dob} onChange={e=>set({dob:e.target.value})} type="date" className={ic}/>
      </div>
      <p className="text-xs text-slate-400">Used only if you forget your PIN. Stored securely — nobody, including the admin, can see your answer or date of birth.</p>
    </div>
  );
}
const BLANK_RECOVERY = { q:"", own:"", a:"", dob:"" };
const recoveryProblem = v => !pickQuestion(v) ? "Please choose or write a security question"
                           : !v.a.trim() ? "Please answer your security question"
                           : !v.dob ? "Please enter your date of birth" : "";

// ─── Auth Screen ─────────────────────────────────────────────────────────────
// onLogin(user): user={name,email,memberId,memberRole,isAdmin}
function AuthScreen({ authMode, setAuthMode, members, upMembers, config, onLogin, showToast }) {
  var [siEmail, setSiEmail] = useState("");
  var [siPin,   setSiPin]   = useState("");
  var [siErr,   setSiErr]   = useState("");
  var [suName,  setSuName]  = useState("");
  var [suEmail, setSuEmail] = useState("");
  var [suPin,   setSuPin]   = useState("");
  var [suPin2,  setSuPin2]  = useState("");
  var [suPhone, setSuPhone] = useState("");
  var [suArea,  setSuArea]  = useState("");
  var [suCity,  setSuCity]  = useState("");
  var [suErr,   setSuErr]   = useState("");
  var [suDone,  setSuDone]  = useState(false);
  var [suRec,   setSuRec]   = useState(BLANK_RECOVERY);
  // One-time security question setup after sign-in (existing members)
  var [rcUser,  setRcUser]  = useState(null);
  var [rcRec,   setRcRec]   = useState(BLANK_RECOVERY);
  var [rcErr,   setRcErr]   = useState("");
  // Forgot PIN
  var [fpQuestion, setFpQuestion] = useState("");
  var [fpAnswer,   setFpAnswer]   = useState("");
  var [fpDob,      setFpDob]      = useState("");
  var [fpQuery, setFpQuery] = useState("");
  var [fpEmail, setFpEmail] = useState("");
  var [fpPin1,  setFpPin1]  = useState("");
  var [fpPin2,  setFpPin2]  = useState("");
  var [fpErr,   setFpErr]   = useState("");
  var [fpStep,  setFpStep]  = useState(1); // 1=find user, 2=set new pin, 3=done

  var [busy, setBusy] = useState(false);

  var handleSignIn = function() {
    if (isConfigured()) {
      if (!siEmail.trim()) return setSiErr("Please enter your name or email");
      if (!siPin.trim()) return setSiErr("Please enter your PIN");
      setBusy(true); setSiErr("");
      DB.rpc("rota_login", { p_ident: siEmail.trim(), p_pin: siPin.trim() }).then(function(res) {
        setBusy(false);
        if (res.error) return setSiErr(res.error);
        DB.token = res.token;
        var user = { name: res.member.name, email: res.member.email, memberId: res.member.id, memberRole: res.member.role, isAdmin: !!res.member.isAdmin, approved: true };
        if (res.needsRecovery) { setRcUser(user); setRcRec(BLANK_RECOVERY); setRcErr(""); setAuthMode("set-recovery"); return; }
        onLogin(user);
      }).catch(function(e) { setBusy(false); setSiErr("Could not connect: " + e.message); });
      return;
    }
    var q = siEmail.trim().toLowerCase();
    if (!q) return setSiErr("Please enter your name or email");
    if (!siPin.trim()) return setSiErr("Please enter your PIN");
    var found = members.find(function(m) {
      return (m.email && m.email.toLowerCase() === q) || m.name.toLowerCase() === q;
    });
    if (!found) return setSiErr("No account found. Please check your name/email or sign up.");
    if (!found.pin || found.pin !== siPin.trim()) return setSiErr("Incorrect PIN. Please try again.");
    if (found.approved === "rejected") return setSiErr("Your registration was declined. Please sign up again to re-apply.");
    if (found.approved === false) return setSiErr("Your registration is pending admin approval. You will be notified once approved.");
    setSiErr("");
    onLogin({ name: found.name, email: found.email, memberId: found.id, memberRole: found.role, isAdmin: !!found.isAdmin, approved: true });
  };

  var handleSignUp = function() {
    setSuErr("");
    if (!suName.trim())  return setSuErr("Full name is required");
    if (!suEmail.trim()) return setSuErr("Email address is required");
    var emailRx = /^[^@]+@[^@]+\.[^@]+$/;
    if (!emailRx.test(suEmail.trim())) return setSuErr("Please enter a valid email address");
    if (!suPin.trim() || suPin.trim().length < 4) return setSuErr("PIN must be at least 4 digits");
    if (suPin.trim() !== suPin2.trim()) return setSuErr("PINs do not match");
    if (isConfigured()) {
      var recErr = recoveryProblem(suRec);
      if (recErr) return setSuErr(recErr);
      setBusy(true);
      DB.rpc("rota_register", { p: { name: suName.trim(), email: suEmail.trim(), pin: suPin.trim(), phone: suPhone.trim(), area: suArea.trim(), city: suCity.trim(),
                                     question: pickQuestion(suRec), answer: suRec.a.trim(), dob: suRec.dob } }).then(function(res) {
        setBusy(false);
        if (res.error) return setSuErr(res.error);
        setSuDone(true);
      }).catch(function(e) { setBusy(false); setSuErr("Could not connect: " + e.message); });
      return;
    }
    var emailExists = members.find(function(m) { return m.email && m.email.toLowerCase() === suEmail.trim().toLowerCase(); });
    if (emailExists) {
      if (emailExists.approved === "rejected") {
        var updated = members.map(function(m) {
          if (m.id !== emailExists.id) return m;
          return {...m, name:suName.trim(), pin:suPin.trim(), phone:suPhone.trim(), area:suArea.trim(), city:suCity.trim(), approved:false, notes:"Re-applied after rejection"};
        });
        upMembers(updated);
        setSuDone(true);
        return;
      }
      return setSuErr("An account with this email already exists. Please sign in instead.");
    }
    var newM = { id:uid(), name:suName.trim(), email:suEmail.trim().toLowerCase(), pin:suPin.trim(), phone:suPhone.trim(), area:suArea.trim(), city:suCity.trim(), role:"volunteer", approved:false, notes:"Self sign-up — pending approval" };
    upMembers([...members, newM]);
    setSuDone(true);
  };

  var handleForgotStep1 = function() {
    setFpErr("");
    var q = fpQuery.trim().toLowerCase();
    if (!q) return setFpErr("Please enter your name or email");
    if (isConfigured()) {
      // Server returns the member's own security question
      DB.rpc("rota_recovery_question", { p_ident: fpQuery.trim() }).then(function(res) {
        if (res.error) return setFpErr(res.error);
        setFpQuestion(res.question); setFpAnswer(""); setFpDob(""); setFpStep(2);
      }).catch(function(e) { setFpErr("Could not connect: " + e.message); });
      return;
    }
    var found = members.find(function(m) {
      return (m.email && m.email.toLowerCase() === q) || m.name.toLowerCase() === q;
    });
    if (!found) return setFpErr("No account found with that name or email.");
    if (found.approved === false) return setFpErr("Your account is not yet approved. Contact the admin.");
    if (found.approved === "rejected") return setFpErr("Your account was declined. Please register again.");
    // Need to verify email if query was by name
    if (found.name.toLowerCase() === q && found.email) {
      setFpEmail(found.email);
    }
    setFpQuery(found.id); // reuse state to store found id
    setFpStep(2);
  };

  var handleForgotStep2 = function() {
    setFpErr("");
    if (!fpPin1.trim() || fpPin1.trim().length < 4) return setFpErr("PIN must be at least 4 digits");
    if (fpPin1.trim() !== fpPin2.trim()) return setFpErr("PINs do not match");
    if (isConfigured()) {
      if (!fpAnswer.trim()) return setFpErr("Please answer your security question");
      if (!fpDob) return setFpErr("Please enter your date of birth");
      DB.rpc("rota_reset_pin", { p_ident: fpQuery.trim(), p_answer: fpAnswer.trim(), p_dob: fpDob, p_pin: fpPin1.trim() }).then(function(res) {
        if (res.error) return setFpErr(res.error);
        setFpStep(3);
      }).catch(function(e) { setFpErr("Could not reset your PIN: " + e.message); });
      return;
    }
    var updated = members.map(function(m) { return m.id === fpQuery ? {...m, pin: fpPin1.trim()} : m; });
    upMembers(updated);
    setFpStep(3);
  };

  var handleSetRecovery = function() {
    setRcErr("");
    var recErr = recoveryProblem(rcRec);
    if (recErr) return setRcErr(recErr);
    setBusy(true);
    DB.rpc("rota_set_recovery", { p_token: DB.token, p_question: pickQuestion(rcRec), p_answer: rcRec.a.trim(), p_dob: rcRec.dob }).then(function(res) {
      setBusy(false);
      if (res.error) return setRcErr(res.error === "session" ? "Your session expired — please sign in again." : res.error);
      showToast("Security question saved");
      onLogin(rcUser);
    }).catch(function(e) { setBusy(false); setRcErr("Could not connect: " + e.message); });
  };

  var ic  = "w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 bg-white";
  var ice ="w-full border border-red-400 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-red-200 bg-white";

  return (
    <div className="min-h-screen bg-gradient-to-br from-indigo-900 via-indigo-800 to-violet-900 flex flex-col items-center justify-center p-4">
      <div className="text-center mb-6">
        {config.logo
          ? <div className="flex justify-center mb-3"><OrgLogo config={config} size="w-24 h-24"/></div>
          : <div className="text-5xl mb-3">🕉️</div>}
        <h1 className="text-2xl font-black text-white tracking-tight">{config.orgName}</h1>
        <p className="text-indigo-300 mt-1 text-xs">📍 {config.location} · {config.day}s · {config.startTime}</p>
      </div>
      <div className="w-full max-w-sm">

        {authMode === "choose" && (
          <div className="bg-white rounded-2xl shadow-2xl p-7 space-y-3">
            <h2 className="text-xl font-bold text-slate-800 text-center">Welcome 👋</h2>
            <p className="text-slate-500 text-sm text-center mb-2">How would you like to sign in?</p>
            <button onClick={function(){setAuthMode("member-signin"); setSiErr(""); setSiEmail(""); setSiPin("");}}
              className="w-full bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl py-4 font-bold flex items-center gap-4 px-5 transition-colors shadow-md">
              <span className="text-2xl">🙋</span>
              <div className="text-left">
                <div className="font-bold">Member Sign In</div>
                <div className="text-xs font-normal text-indigo-200 mt-0.5">Sign in with your email and PIN</div>
              </div>
            </button>
            <button onClick={function(){setAuthMode("member-signup"); setSuErr(""); setSuDone(false); setSuName(""); setSuEmail(""); setSuPin(""); setSuPin2(""); setSuPhone(""); setSuArea(""); setSuCity("");}}
              className="w-full bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-xl py-4 font-semibold flex items-center gap-4 px-5 transition-colors border border-indigo-200">
              <span className="text-2xl">✨</span>
              <div className="text-left">
                <div className="font-semibold">New? Register here</div>
                <div className="text-xs font-normal text-indigo-400 mt-0.5">Submit a request — admin will approve</div>
              </div>
            </button>
          </div>
        )}

        {authMode === "member-signin" && (
          <div className="bg-white rounded-2xl shadow-2xl p-7 space-y-4">
            <button onClick={function(){setAuthMode("choose"); setSiErr("");}} className="text-sm text-indigo-600 hover:underline">← Back</button>
            <div className="text-center">
              <div className="text-3xl mb-2">🙋</div>
              <h2 className="text-xl font-bold text-slate-800">Member Sign In</h2>
              <p className="text-sm text-slate-500 mt-1">Sign in with your email and PIN</p>
            </div>
            <div>
              <label className="text-xs font-semibold text-slate-500 block mb-1">Name or Email *</label>
              <input value={siEmail} onChange={function(e){setSiEmail(e.target.value); setSiErr("");}}
                onKeyDown={function(e){if(e.key==="Enter")handleSignIn();}}
                placeholder="Your name or email address" autoFocus className={siErr ? ice : ic}/>
            </div>
            <div>
              <label className="text-xs font-semibold text-slate-500 block mb-1">PIN *</label>

// ─── Dashboard ───────────────────────────────────────────────────────────────
const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const PERIOD_OPTS = [
  {key:"month",   label:"Month"},
  {key:"quarter", label:"Quarter"},
  {key:"half",    label:"Half Year"},
  {key:"year",    label:"Full Year"},
  {key:"custom",  label:"Custom"},
];

function getPeriodRange(period, anchor, customFrom, customTo, year) {
  const y = year;
  const m = anchor; // 0-based month
  if (period==="month")   return { from: new Date(y,m,1),   to: new Date(y,m+1,0) };
  if (period==="quarter") { const q=Math.floor(m/3); return { from: new Date(y,q*3,1), to: new Date(y,q*3+3,0) }; }
  if (period==="half")    { const h=m<6?0:6;          return { from: new Date(y,h,1),   to: new Date(y,h+6,0) }; }
  if (period==="year")    return { from: new Date(y,0,1),   to: new Date(y,11,31) };
  if (period==="custom" && customFrom && customTo) return { from: new Date(customFrom), to: new Date(customTo) };
  return { from: new Date(y,m,1), to: new Date(y,m+1,0) };
}

// Build a grid of calendar months for the range
function buildMonthGrids(from, to, allSlots, rotas) {
  const months = [];
  let cur = new Date(from.getFullYear(), from.getMonth(), 1);
  const end = new Date(to.getFullYear(), to.getMonth(), 1);
  while (cur <= end) {
    const y = cur.getFullYear(), m = cur.getMonth();
    // Build day cells: first day of month weekday offset
    const firstDay = (new Date(y, m, 1).getDay() + 6) % 7; // 0=Mon
    const daysInMonth = new Date(y, m+1, 0).getDate();
    // Find rota slots in this month
    const slots = allSlots.filter(s => {
      const d = new Date(s.date);
      return d.getFullYear()===y && d.getMonth()===m;
    });
    months.push({ year:y, month:m, firstDay, daysInMonth, slots });
    cur = new Date(y, m+1, 1);
  }
  return months;
}

function Dashboard({ allSlots, rotas, members, activities, config, setTab, sponsorships, prasadham=[], priests=[], rotaSheets=[] }) {
  const today = new Date(); today.setHours(0,0,0,0);
  const curMonth = today.getMonth();
  const curYear  = today.getFullYear();

  const [period,      setPeriod]      = useState("month");
  const [anchor,      setAnchor]      = useState(curMonth);   // 0-based month for nav
  const [anchorYear,  setAnchorYear]  = useState(curYear);
  const [customFrom,  setCustomFrom]  = useState("");
  const [customTo,    setCustomTo]    = useState("");
  const [selectedSlot,setSelectedSlot]= useState(null);

  // Derived range
  const range = getPeriodRange(period, anchor, customFrom, customTo, anchorYear);
  const slotsInRange = allSlots.filter(s => {
    const d = new Date(s.date);
    return d >= range.from && d <= range.to;
  });
  const filledInRange   = slotsInRange.filter(s=>rotas[s.key]?.lead).length;
  const unfilledInRange = slotsInRange.length - filledInRange;
  const monthGrids = buildMonthGrids(range.from, range.to, allSlots, rotas);

  // Global stats
  const totalFilled   = allSlots.filter(s=>rotas[s.key]?.lead).length;
  const totalUnfilled = allSlots.length - totalFilled;
  const primary    = members.filter(m=>m.role==="primary").length;
  const secondary  = members.filter(m=>m.role==="secondary").length;

  const getName = id => members.find(m=>m.id===id)?.name||"—";

  // Navigate anchor
  const navPrev = () => {
    if (period==="month")   { if(anchor===0){setAnchor(11);setAnchorYear(y=>y-1);}else setAnchor(a=>a-1); }
    if (period==="quarter") { if(anchor<3){setAnchor(9);setAnchorYear(y=>y-1);}else setAnchor(a=>a-3); }
    if (period==="half")    { if(anchor<6){setAnchor(6);setAnchorYear(y=>y-1);}else setAnchor(0); }
    if (period==="year")    { setAnchorYear(y=>y-1); }
  };
  const navNext = () => {
    if (period==="month")   { if(anchor===11){setAnchor(0);setAnchorYear(y=>y+1);}else setAnchor(a=>a+1); }
    if (period==="quarter") { if(anchor>=9){setAnchor(0);setAnchorYear(y=>y+1);}else setAnchor(a=>a+3); }
    if (period==="half")    { if(anchor>=6){setAnchor(0);setAnchorYear(y=>y+1);}else setAnchor(6); }
    if (period==="year")    { setAnchorYear(y=>y+1); }
  };
  const goToday = () => { setAnchor(curMonth); setAnchorYear(curYear); };

  const periodLabel = () => {
    if (period==="month")   return `${MONTH_NAMES[anchor]} ${anchorYear}`;
    if (period==="quarter") { const q=Math.floor(anchor/3)+1; return `Q${q} ${anchorYear}`; }
    if (period==="half")    return anchor<6 ? `H1 ${anchorYear}` : `H2 ${anchorYear}`;
    if (period==="year")    return `${anchorYear}`;
    if (period==="custom")  return customFrom&&customTo ? `${customFrom} → ${customTo}` : "Select dates";
    return "";
  };

  const selRota = selectedSlot ? (rotas[selectedSlot.key]||{}) : null;

  return (
    <div className="space-y-5">
      {/* ── 1. NEXT ROTA ── */}
      {(() => {
        const next = allSlots.find(s => new Date(s.date) >= today);
        if (!next) return null;
        const r = rotas[next.key] || {};
        const d = new Date(next.date);
        const diffDays = Math.floor((d - today) / 86400000);
        const isThisWeek = diffDays < 7;
        const lead = r.lead ? getName(r.lead) : null;
        const secondaryNames = (r.secondary||[]).map(getName).filter(Boolean);
        // Convert next.date (Date object) to YYYY-MM-DD string for comparison

        const nextDateStr = nd.getFullYear() + "-" + String(nd.getMonth()+1).padStart(2,"0") + "-" + String(nd.getDate()).padStart(2,"0");
        const bookedSponsors = (sponsorships||[]).flatMap(area =>
          (area.donations||[])
            .filter(don => (don.rotaDates||[]).includes(nextDateStr))
            .map(don => ({ area: area.name, donor: don.donor, amount: don.amount }))
        ).concat(servicePaidOn(rotaSheets, nextDateStr));
        const prasadhamProvider = (function(){
          var pid = r.prasadhamId;
          var pv = pid ? prasadham.find(function(p){return p.id===pid;}) : null;
          return pv ? pv.name : "";
        })();
        const priestName = (function(){
          var pid = r.priestId;
          if (!pid) { var def = priests.find(function(p){return p.isDefault;}); pid = def ? def.id : (priests[0]||{}).id; }

        <div className="px-5 py-4 border-b border-slate-100 flex flex-wrap items-center gap-3">

            <div className="flex items-center gap-2 ml-auto">

          {/* Legend */}
          <div className="flex items-center gap-3 text-xs text-slate-500 ml-auto flex-shrink-0">
            <span className="flex items-center gap-1"><span className="w-3 h-3 rounded-full bg-emerald-400 inline-block"></span>Filled</span>
            <span className="flex items-center gap-1"><span className="w-3 h-3 rounded-full bg-red-400 inline-block"></span>Unfilled</span>
            <span className="flex items-center gap-1"><span className="w-3 h-3 rounded-full bg-violet-600 inline-block"></span>Special</span>

        {/* Month grid(s) */}
        <div className={`p-5 ${monthGrids.length>1?"grid gap-6":"" } ${monthGrids.length===2?"grid-cols-2":""} ${monthGrids.length===3?"grid-cols-3":""} ${monthGrids.length>=4?"grid-cols-2 md:grid-cols-3 lg:grid-cols-4":""}`}>
          {monthGrids.map(mg=>(

          {monthGrids.length===0 && (
            <div className="py-12 text-center text-slate-400">
              <div className="text-4xl mb-2">📅</div>

      </div>

      {/* ── Selected slot detail card ── */}
      {selectedSlot && selRota !== null && (
        <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 fade-in">
          <div className="flex items-start justify-between gap-4 mb-4">
            <div>
              <h3 className="font-bold text-slate-800 text-lg">{selectedSlot.isSpecial?"⭐ ":"📅 "}{selectedSlot.label}</h3>
              <p className="text-slate-500 text-sm mt-0.5">
                {new Date(selectedSlot.date).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}
                &nbsp;·&nbsp;{config.location}&nbsp;·&nbsp;{config.startTime} ({config.duration}h)
              </p>
            </div>
            <div className="flex gap-2 flex-shrink-0">
              <button onClick={()=>setSelectedSlot(null)} className="text-xs text-slate-400 hover:text-slate-600 px-2">✕</button>
              <button onClick={()=>setTab("Rota Calendar")} className="text-xs bg-indigo-600 text-white px-4 py-1.5 rounded-lg font-semibold hover:bg-indigo-700">Edit Rota →</button>
            </div>
          </div>
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
            <InfoPill label="Rota Lead" value={selRota.lead ? getName(selRota.lead) : "Not assigned"} filled={!!selRota.lead} icon="🎯"/>
            <InfoPill label="Secondary" value={`${(selRota.secondary||[]).length} member${(selRota.secondary||[]).length!==1?"s":""}`} filled={(selRota.secondary||[]).length>0} icon="🟣"/>
            <InfoPill label="Activities" value={`${Object.values(selRota.actOwners||{}).filter(Boolean).length}/${activities.length} assigned`} filled={Object.values(selRota.actOwners||{}).filter(Boolean).length===activities.length} icon="✅"/>
          </div>
          {selRota.notes && <div className="mt-3 bg-slate-50 rounded-xl px-4 py-2 text-sm text-slate-600 italic">"{selRota.notes}"</div>}
          {!selRota.lead && (
            <div className="mt-3 bg-amber-50 border border-amber-200 rounded-xl px-4 py-2 text-sm text-amber-700 font-medium">
              ⚠️ This slot has no lead assigned. <button onClick={()=>setTab("Rota Calendar")} className="underline ml-1">Assign one now →</button>
            </div>
          )}
        </div>
      )}

      {/* ── 3. ROTA STATUS ── */}
      <div className="space-y-3">
        {unfilledInRange > 0 && (
          <div className="bg-red-50 border border-red-200 rounded-2xl px-5 py-3 flex items-center justify-between fade-in">
            <div className="flex items-center gap-3">
              <span className="text-2xl">⚠️</span>
              <div>
                <span className="font-semibold text-red-700">{unfilledInRange} slot{unfilledInRange>1?"s":""} unfilled</span>
                <span className="text-red-500 text-sm"> in {periodLabel()} — {filledInRange} of {slotsInRange.length} have a lead assigned</span>
              </div>
            </div>
            <button onClick={function(){setTab("Rota Calendar");}} className="text-xs bg-red-600 text-white px-3 py-1.5 rounded-lg font-semibold hover:bg-red-700 flex-shrink-0">Fill Now →</button>
          </div>
        )}
        {unfilledInRange === 0 && slotsInRange.length > 0 && (
          <div className="bg-emerald-50 border border-emerald-200 rounded-2xl px-5 py-3 flex items-center gap-3 fade-in">
            <span className="text-2xl">🎉</span>
            <span className="font-semibold text-emerald-700">All {slotsInRange.length} slots in {periodLabel()} are fully covered!</span>
          </div>
        )}
      </div>
    </div>
  );
}

// ─── Month Calendar Grid ──────────────────────────────────────────────────────
function MonthCalGrid({ mg, rotas, today, selectedKey, onSelectSlot, compact }) {
  const { year, month, firstDay, daysInMonth, slots } = mg;
  const DAY_HDRS = ["Mo","Tu","We","Th","Fr","Sa","Su"];

  // Map day-of-month → slot
  const daySlotMap = {};
  slots.forEach(s => {
    const d = new Date(s.date).getDate();
    if (!daySlotMap[d]) daySlotMap[d] = [];
    daySlotMap[d].push(s);
  });

  const cells = [];
  // Leading blanks
  for (let i=0; i<firstDay; i++) cells.push(null);
  for (let d=1; d<=daysInMonth; d++) cells.push(d);

  const todayDay   = today.getFullYear()===year && today.getMonth()===month ? today.getDate() : -1;

  return (
    <div>
      <div className="flex items-center justify-between mb-3">
        <h3 className={`font-bold text-slate-700 ${compact?"text-xs":"text-sm"}`}>{MONTH_NAMES[month]} {year}</h3>
        {slots.length>0 && (
          <span className="text-xs text-slate-400">
            <span className="text-emerald-600 font-semibold">{slots.filter(s=>rotas[s.key]?.lead).length}</span>/{slots.length}
          </span>
        )}
      </div>
      {/* Day headers */}
      <div className="grid grid-cols-7 mb-1">
        {DAY_HDRS.map(h=>(
          <div key={h} className={`text-center font-semibold text-slate-400 ${compact?"text-xs py-0.5":"text-xs py-1"}`}>{h}</div>
        ))}
      </div>
      {/* Day cells */}
      <div className="grid grid-cols-7 gap-0.5">
        {cells.map((day, idx) => {
          if (!day) return <div key={`blank-${idx}`}/>;
          const daySlots = daySlotMap[day] || [];
          const isToday  = day === todayDay;
          const hasSlot  = daySlots.length > 0;
          const slot     = daySlots[0];
          const filled   = slot ? !!rotas[slot.key]?.lead : false;
          const special  = slot?.isSpecial;
          const isSel    = slot && slot.key === selectedKey;

          let cellCls = `relative flex items-center justify-center rounded-lg font-medium transition-all cursor-default select-none ${compact?"h-7 text-xs":"h-9 text-sm"}`;
          if (isToday)  cellCls += " ring-2 ring-indigo-400 ring-offset-1";
          if (isSel)    cellCls += " ring-2 ring-indigo-600 ring-offset-1";
          if (hasSlot) {
            cellCls += " cursor-pointer ";
            if (special)     cellCls += " bg-violet-600 text-white font-bold hover:bg-violet-700";
            else if (filled) cellCls += " bg-emerald-100 text-emerald-800 hover:bg-emerald-200";
            else             cellCls += " bg-red-100 text-red-700 hover:bg-red-200";
          } else {
            cellCls += " text-slate-400";
            if (isToday) cellCls += " bg-indigo-50 text-indigo-700";
          }

          return (
            <div key={day} className={cellCls}
              onClick={()=>hasSlot && onSelectSlot(slot)}
              title={slot ? slot.label : ""}>
              {day}
              {hasSlot && !filled && (
                <span className="absolute top-0.5 right-0.5 w-1.5 h-1.5 rounded-full bg-red-500"/>
              )}
              {special && (
                <span className="absolute top-0.5 left-0.5 text-xs leading-none">⭐</span>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── Rota Calendar ───────────────────────────────────────────────────────────
function RotaCalendar({ allSlots, rotas, upRotas, members, activities, config, specials, upSpecials, showToast, isAdmin=false, isRotaLead=false, currentUser=null, defaultView="calendar", priests=[], prasadham=[] }) {
  const today = new Date(); today.setHours(0,0,0,0);

  const [selKey,   setSelKey]   = useState(null);
  const [view,     setView]     = useState(defaultView); // "calendar" | "list"
  const [filter,   setFilter]   = useState("upcoming");
  const [search,   setSearch]   = useState("");
  const [personFilter, setPersonFilter] = useState(""); // member id or "" for all

  // Calendar navigation — start on current month
  const [calMonth, setCalMonth] = useState(today.getMonth());
  const [calYear,  setCalYear]  = useState(today.getFullYear());

  // Auto-select the logged-in volunteer (after all useState calls)
  useEffect(() => {
    if (!isAdmin && currentUser && members.length > 0) {
      const match = members.find(m => m.id === currentUser.memberId) ||
                    members.find(m => m.name.toLowerCase() === (currentUser.name||"").toLowerCase());
      if (match) setPersonFilter(match.id);
    }
  }, [currentUser?.memberId, members.length]);

  const name = id => members.find(m=>m.id===id)?.name||"—";

  const updateRota = (key, patch) => {
    const next = {...rotas, [key]:{...(rotas[key]||{}), ...patch}};
    upRotas(next);
    showToast("Rota saved");
  };


  const removeSpecial = id => {
    upSpecials(specials.filter(s=>s.key!==id));
    if (selKey===id) setSelKey(null);
    showToast("Removed");
  };

  const slot = selKey ? allSlots.find(s=>s.key===selKey) : null;
  const rota = slot ? (rotas[slot.key]||{}) : {};

  // Filtered list for list-view
  const filtered = allSlots.filter(s=>{
    if (filter==="filled")   return rotas[s.key]?.lead;
    if (filter==="empty")    return !rotas[s.key]?.lead;
    if (filter==="special")  return s.isSpecial;
    if (filter==="upcoming") return new Date(s.date) >= today;
    return true;
  }).filter(s=>!search||s.label.toLowerCase().includes(search.toLowerCase()))
    .filter(s=>{
      if (!personFilter) return true;
      const r = rotas[s.key]||{};
      return r.lead===personFilter ||
             (r.primary||[]).includes(personFilter) ||
             (r.secondary||[]).includes(personFilter);
    });

  // Calendar: build cells for current month
  const firstDay    = (new Date(calYear, calMonth, 1).getDay() + 6) % 7; // 0=Mon
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const DAY_HDRS    = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

  // Map each day-of-month to its slot (if any)
  const daySlotMap = {};
  allSlots.forEach(s => {
    const d = new Date(s.date);
    if (d.getFullYear()===calYear && d.getMonth()===calMonth) {
      daySlotMap[d.getDate()] = s;
    }
  });

  const calPrev = () => { if(calMonth===0){setCalMonth(11);setCalYear(y=>y-1);}else setCalMonth(m=>m-1); };
  const calNext = () => { if(calMonth===11){setCalMonth(0);setCalYear(y=>y+1);}else setCalMonth(m=>m+1); };
  const goToday = () => { setCalMonth(today.getMonth()); setCalYear(today.getFullYear()); };

  // Upcoming slots (next 5) for the sidebar summary
  const upcoming = allSlots.filter(s=>new Date(s.date)>=today).slice(0,5);

  return (
    <div className="space-y-4">

      {/* ── Top toolbar ── */}
      <div className="flex flex-wrap items-center gap-3">
        {/* Volunteer welcome */}
        {!isAdmin && currentUser && (
          <div className="flex items-center gap-2 bg-indigo-50 border border-indigo-200 rounded-xl px-3 py-1.5">
            <div className="w-6 h-6 rounded-full bg-indigo-600 text-white flex items-center justify-center font-bold text-xs">
              {currentUser.name[0].toUpperCase()}
            </div>
            <span className="text-sm font-semibold text-indigo-800">Hi, {currentUser.name}!</span>
          </div>
        )}
        <div className="ml-auto flex items-center gap-2">
          {/* View toggle */}
          <div className="flex rounded-xl overflow-hidden border border-slate-200 shadow-sm">
            <button onClick={()=>setView("calendar")}
              className={`px-4 py-2 text-sm font-semibold transition-colors flex items-center gap-1.5 ${view==="calendar"?"bg-indigo-600 text-white":"bg-white text-slate-600 hover:bg-slate-50"}`}>
              📅 Calendar
            </button>
            <button onClick={()=>setView("list")}
              className={`px-4 py-2 text-sm font-semibold transition-colors flex items-center gap-1.5 border-l border-slate-200 ${view==="list"?"bg-indigo-600 text-white":"bg-white text-slate-600 hover:bg-slate-50"}`}>
              ☰ List
            </button>
          </div>
        </div>

        {/* Person filter */}
        {members.length > 0 && (
          <select
            value={personFilter}
            onChange={e => { setPersonFilter(e.target.value); if (e.target.value) { setView("list"); setFilter("all"); } else { setFilter("upcoming"); } }}
            className="text-sm border border-slate-200 rounded-xl px-3 py-2 bg-white text-slate-700 font-medium shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-300">
            <option value="">👥 All members</option>
            {[...members].sort((a,b)=>a.name.localeCompare(b.name)).map(m=>(
              <option key={m.id} value={m.id}>{m.name}</option>
            ))}
          </select>
        )}
      </div>

      {/* ════ CALENDAR VIEW ════ */}
      {view === "calendar" && (
        // Phone: calendar on top, details below · Wider screens: details in a sidebar
        <div className="flex flex-col md:flex-row gap-3 md:gap-5 items-stretch md:items-start">

          {/* Main calendar panel */}
          <div className="flex-1 min-w-0 bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">

            {/* Month nav header */}
            <div className="flex items-center justify-between px-3 md:px-6 py-3 md:py-4 border-b border-slate-100">
              <button onClick={calPrev} className="w-8 h-8 rounded-lg hover:bg-slate-100 flex items-center justify-center text-slate-600 font-bold transition-colors">‹</button>
              <div className="flex items-center gap-3">
                <h2 className="text-lg font-bold text-slate-800">{MONTH_NAMES[calMonth]} {calYear}</h2>
                <button onClick={goToday} className="text-xs bg-indigo-50 text-indigo-600 border border-indigo-200 px-2.5 py-1 rounded-lg font-semibold hover:bg-indigo-100 transition-colors">Today</button>
              </div>
              <button onClick={calNext} className="w-8 h-8 rounded-lg hover:bg-slate-100 flex items-center justify-center text-slate-600 font-bold transition-colors">›</button>
            </div>

            {/* Day-of-week headers */}
            <div className="grid grid-cols-7 border-b border-slate-100">
              {DAY_HDRS.map(h=>(
                <div key={h} className="text-center text-xs font-semibold text-slate-400 py-2">
                  <span className="md:hidden">{h[0]}</span><span className="hidden md:inline">{h}</span>
                </div>
              ))}
            </div>

            {/* Day cells */}
            <div className="grid grid-cols-7">
              {/* Leading blanks */}
              {Array.from({length: firstDay}).map((_,i)=>(
                <div key={`b${i}`} className="min-h-12 md:min-h-20 border-b border-r border-slate-100 bg-slate-50 bg-opacity-50"/>
              ))}
              {Array.from({length: daysInMonth}).map((_,i)=>{
                const day      = i+1;
                const cellDate = new Date(calYear, calMonth, day); cellDate.setHours(0,0,0,0);
                const isPast   = cellDate < today;
                const isToday  = cellDate.getTime() === today.getTime();
                const s        = daySlotMap[day];
                const r        = s ? (rotas[s.key]||{}) : null;
                const filled   = r?.lead;
                const special  = s?.isSpecial;
                const isSel    = s && s.key === selKey;
                const leadName = filled ? name(r.lead) : null;
                const volCount = r ? (r.primary||[]).length + (r.secondary||[]).length : 0;
                const pendingCount = r ? Object.values(r.actInterest||{}).filter(x=>x.status==="pending").length : 0;

                // Cell background
                const personInSlot = personFilter && r && (
                  r.lead===personFilter ||
                  (r.primary||[]).includes(personFilter) ||
                  (r.secondary||[]).includes(personFilter)
                );
                let bg = "bg-white";
                if (personFilter && s && !personInSlot) bg = "bg-slate-50";
                else if (personFilter && personInSlot)  bg = "bg-indigo-50";
                else if (isPast && s)      bg = "bg-slate-50";
                else if (isPast)           bg = "bg-slate-50";
                else if (special)          bg = "bg-violet-100";
                else if (s && filled)      bg = "bg-emerald-50";
                else if (s && !filled)     bg = "bg-red-50 bg-opacity-60";

                const isLastCol = (firstDay + i) % 7 === 6; // Sun is last col
                // Phone: one coloured dot per rota day instead of text
                const dotCls = personFilter && personInSlot ? "bg-indigo-500"
                             : special ? "bg-violet-600"
                             : filled  ? "bg-emerald-500" : "bg-red-400";

                return (
                  <div key={day}
                    onClick={()=>s && setSelKey(s.key)}
                    className={`min-h-12 md:min-h-20 border-b border-r border-slate-100 p-1 md:p-1.5 transition-all
                      flex flex-col items-center md:items-stretch
                      ${isLastCol?"border-r-0":""}
                      ${bg}
                      ${s?"cursor-pointer hover:brightness-95":""}
