// ─── Rota Lead / Secondary swaps ─────────────────────────────────────────────
// A swap request is stored with the availability offers (rota-offers), which every
// member may save:
//   { id, type:"swap", memberId, name, slotKey, role:"lead"|"secondary",
//     withId, withSlotKey, note, status:"pending"|"done"|"declined"|"cancelled",
//     createdAt, resolvedAt, adminNote }
// The admin plans and applies swaps on the Assignments screen; applying updates the rota.
const SWAP_ROLE = { lead:"Rota Lead", secondary:"Secondary" };
const isSwap = o => o && o.type === "swap";
const slotText = s => s ? new Date(s.date).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"}) + (s.isSpecial ? " ⭐ "+s.label : "") : "—";
// Is this member in this role on this week?
const inRole = (r, role, id) => role === "lead" ? (r||{}).lead === id : ((r||{}).secondary||[]).includes(id);
// Members who can take a role in a swap: Rota Leads swap only with Rota Leads, Secondaries only with Secondaries
const eligibleFor = (members, role) => members.filter(m => m.approved !== false && m.approved !== "rejected"
  && m.role === (role === "lead" ? "primary" : "secondary"));

// ── Member side: ask the admin for a swap ─────────────────────────────────────
function SwapRequestForm({ rotas, allSlots, members, generalOffers, upGeneralOffers, currentUser, showToast }) {
  const me = currentUser.memberId;
  const today = new Date(); today.setHours(0,0,0,0);
  const upcoming = allSlots.filter(s => new Date(s.date) >= today);
  const myWeeks = upcoming.flatMap(s => ["lead","secondary"].filter(role => inRole(rotas[s.key], role, me)).map(role => ({ slot:s, role })));
  const mine = (generalOffers||[]).filter(o => isSwap(o) && o.memberId === me).slice().reverse();
  const [pick, setPick]       = useState("");   // "slotKey|role"
  const [withId, setWithId]   = useState("");
  const [withKey, setWithKey] = useState("");
  const [note, setNote]       = useState("");
  if (myWeeks.length === 0 && mine.length === 0) return null;

  const [slotKey, role] = pick ? pick.split("|") : ["", ""];
  // Only people who have a week of their own in this role to swap back
  const others = role ? eligibleFor(members, role).filter(m => m.id !== me && upcoming.some(s => s.key !== slotKey && inRole(rotas[s.key], role, m.id))) : [];
  // Their weeks: weeks where the chosen person has the same role (or any week, if no one chosen)
  const theirWeeks = upcoming.filter(s => s.key !== slotKey && (!withId || inRole(rotas[s.key], role, withId)));
  const getName = id => (members.find(m => m.id === id)||{}).name || "—";
  const slotOf = k => allSlots.find(s => s.key === k);

  const send = () => {
    if (!pick) return showToast("Choose the week you can't do","error");
    if ((generalOffers||[]).some(o => isSwap(o) && o.status === "pending" && o.memberId === me && o.slotKey === slotKey && o.role === role))
      return showToast("You already have a request open for that week","error");
    upGeneralOffers([...(generalOffers||[]), { id:uid(), type:"swap", memberId:me, name:currentUser.name, slotKey, role,
      withId, withSlotKey:withKey, note:note.trim(), status:"pending", createdAt:new Date().toISOString() }]);
    setPick(""); setWithId(""); setWithKey(""); setNote("");
    showToast("Swap request sent to the admin");
  };
  const cancel = id => upGeneralOffers((generalOffers||[]).map(o => o.id === id ? { ...o, status:"cancelled", resolvedAt:new Date().toISOString() } : o));

  const sel = "w-full border border-slate-200 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-violet-300";
  const STATUS = { pending:["⏳ Waiting for admin","bg-amber-100 text-amber-700"], done:["✅ Swapped","bg-emerald-100 text-emerald-700"],
                   declined:["❌ Not possible","bg-red-100 text-red-600"], cancelled:["Cancelled","bg-slate-100 text-slate-500"] };
  return (
    <div className="bg-gradient-to-br from-violet-50 to-indigo-50 border border-violet-200 rounded-2xl p-5 space-y-3">
      <div className="flex items-start gap-3">
        <span className="text-2xl">🔁</span>
        <div>
          <h3 className="font-bold text-violet-800 text-sm">Ask to swap a week</h3>
          <p className="text-xs text-violet-600 mt-0.5">Can't do one of your weeks? Ask the admin to swap it. If you've already agreed a swap with someone, choose them and their week.</p>
        </div>
      </div>
      {myWeeks.length > 0 && (
        <div className="grid sm:grid-cols-2 gap-2">
          <label className="block sm:col-span-2"><span className="text-xs font-semibold text-slate-600">My week I can't do *</span>
            <select value={pick} onChange={e=>{setPick(e.target.value); setWithId(""); setWithKey("");}} className={sel}>
              <option value="">Choose…</option>
              {myWeeks.map(w => <option key={w.slot.key+w.role} value={w.slot.key+"|"+w.role}>{slotText(w.slot)} — as {SWAP_ROLE[w.role]}</option>)}
            </select>
          </label>
          <label className="block"><span className="text-xs font-semibold text-slate-600">Swap with (if agreed)</span>
            <select value={withId} onChange={e=>{setWithId(e.target.value); setWithKey("");}} disabled={!pick} className={sel}>
              <option value="">Anyone — admin to find</option>
              {others.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
            </select>
          </label>
          <label className="block"><span className="text-xs font-semibold text-slate-600">I'll take their week</span>
            <select value={withKey} onChange={e=>setWithKey(e.target.value)} disabled={!pick} className={sel}>
              <option value="">{withId ? "Choose their week…" : "Any week"}</option>
              {theirWeeks.map(s => <option key={s.key} value={s.key}>{slotText(s)}{withId ? "" : rotas[s.key] && role==="lead" && rotas[s.key].lead ? " — "+getName(rotas[s.key].lead) : ""}</option>)}
            </select>
          </label>
          <label className="block sm:col-span-2"><span className="text-xs font-semibold text-slate-600">Note</span>
            <textarea value={note} onChange={e=>setNote(e.target.value)} rows={2} placeholder="e.g. Away that weekend"
              className={sel+" resize-none"}/>
          </label>
          <button onClick={send} disabled={!pick}
            className="sm:col-span-2 bg-violet-600 hover:bg-violet-700 text-white rounded-xl py-2.5 text-sm font-bold disabled:opacity-40">Send swap request</button>
        </div>
      )}
      {mine.length > 0 && (
        <div className="space-y-1.5">
          <div className="text-xs font-bold text-slate-500 uppercase tracking-wider">My swap requests</div>
          {mine.map(o => (
            <div key={o.id} className="bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm flex items-start gap-2">
              <div className="flex-1 min-w-0">
                <div className="font-semibold text-slate-700">{slotText(slotOf(o.slotKey))} <span className="font-normal text-slate-500">as {SWAP_ROLE[o.role]}</span></div>
                {(o.withId || o.withSlotKey) && <div className="text-xs text-slate-500">with {o.withId ? getName(o.withId) : "anyone"}{o.withSlotKey ? " · their week "+slotText(slotOf(o.withSlotKey)) : ""}</div>}
                {o.adminNote && <div className="text-xs text-slate-600 mt-0.5">Admin: {o.adminNote}</div>}
              </div>
              <span className={"text-xs font-semibold px-2 py-0.5 rounded-full whitespace-nowrap "+(STATUS[o.status]||STATUS.pending)[1]}>{(STATUS[o.status]||STATUS.pending)[0]}</span>
              {o.status === "pending" && <button onClick={()=>cancel(o.id)} className="text-xs text-slate-400 underline">Cancel</button>}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ── Admin side: plan and apply swaps (two people, or a chain of several weeks) ─
function SwapPlanner({ members, rotas, upRotas, allSlots, generalOffers, upGeneralOffers, showToast }) {
  const today = new Date(); today.setHours(0,0,0,0);
  const upcoming = allSlots.filter(s => new Date(s.date) >= today);
  const pending = (generalOffers||[]).filter(o => isSwap(o) && o.status === "pending");
  // Open whenever requests are waiting, unless the admin has folded or opened it
  const [openChoice, setOpen] = useState(null);
  const open = openChoice === null ? pending.length > 0 : openChoice;
  const [role, setRole]       = useState("lead");
  const [rows, setRows]       = useState([{ slotKey:"", fromId:"", toId:"" }]);
  const [linked, setLinked]   = useState([]);    // request ids this plan answers
  const [declining, setDeclining] = useState(null);
  const [declineNote, setDeclineNote] = useState("");

  const getName = id => (members.find(m => m.id === id)||{}).name || "—";
  const slotOf  = k => allSlots.find(s => s.key === k);
  const people  = eligibleFor(members, role);
  // Who is in the role on a week now (for a Secondary row: the chosen person, or the first one)
  const current = (k, fromId) => role === "lead" ? ((rotas[k]||{}).lead || "") : (fromId || ((rotas[k]||{}).secondary||[])[0] || "");
  const weekLabel = s => {
    const r = rotas[s.key]||{};
    const who = role === "lead" ? (r.lead ? getName(r.lead) : "no lead") : ((r.secondary||[]).map(getName).join(", ") || "no secondary");
    return slotText(s) + " — " + who;
  };

  const reset = (newRole) => { setRows([{ slotKey:"", fromId:"", toId:"" }]); setLinked([]); if (newRole) setRole(newRole); };
  const setRow = (i, patch) => setRows(rows.map((r, j) => j === i ? { ...r, ...patch } : r));
  // The new person for a row, optionally swapping weeks with them ("id|theirSlotKey").
  // A week added this way is marked auto and removed again if the choice changes.
  const pickPerson = (i, value) => {
    const [toId, theirKey] = value.split("|");
    const row = rows[i];
    let next = rows.map((r, j) => j === i ? { ...r, toId, pairKey: theirKey || "" } : r)
      .filter(r => !(r.auto && r.pairOf === row.slotKey && r.slotKey === row.pairKey));
    if (theirKey) {
      const back = { slotKey: theirKey, fromId: toId, toId: current(row.slotKey, row.fromId), auto: true, pairOf: row.slotKey };
      const k = next.findIndex(r => r.slotKey === theirKey && r.fromId === toId);
      next = k >= 0 ? next.map((r, j) => j === k ? { ...r, toId: back.toId } : r) : [...next, back];
    }
    setRows(next);
  };
  // Each person's upcoming weeks in this role
  const weeksOf = id => upcoming.filter(s => inRole(rotas[s.key], role, id));
  const dayText = s => new Date(s.date).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"}) + (s.isSpecial ? " ⭐" : "");
  const pickWeek = (i, k) => setRow(i, { slotKey:k, fromId: role === "lead" ? ((rotas[k]||{}).lead||"") : (((rotas[k]||{}).secondary||[])[0]||"") });
  // Each week takes the person from the week above; the first takes the last one's person
  const rotate = () => setRows(rows.map((r, i) => ({ ...r, toId: current(rows[(i + rows.length - 1) % rows.length].slotKey, rows[(i + rows.length - 1) % rows.length].fromId) })));

  // Start a plan from a member's request
  const planFrom = req => {
    const r1 = { slotKey:req.slotKey, fromId:req.memberId, toId:req.withId||"" };
    const plan = [r1];
    if (req.withSlotKey) { plan.push({ slotKey:req.withSlotKey, fromId: req.role === "lead" ? ((rotas[req.withSlotKey]||{}).lead||"") : (req.withId || ((rotas[req.withSlotKey]||{}).secondary||[])[0] || ""), toId:req.memberId, auto:true, pairOf:req.slotKey }); r1.pairKey = req.withSlotKey; }
    if (req.withSlotKey && !r1.toId) r1.toId = plan[1].fromId;
    setRole(req.role); setRows(plan); setLinked([req.id]); setOpen(true);
  };
  const decline = req => {
    upGeneralOffers((generalOffers||[]).map(o => o.id === req.id ? { ...o, status:"declined", adminNote:declineNote.trim(), resolvedAt:new Date().toISOString() } : o));
    setDeclining(null); setDeclineNote(""); showToast("Request declined");
  };

  // Checks before applying
  const filled = rows.filter(r => r.slotKey && r.toId);
  const problems = [];
  rows.forEach((r, i) => {
    if (!r.slotKey) return;
    const s = slotOf(r.slotKey), rr = rotas[r.slotKey]||{};
    if (!r.toId) problems.push(slotText(s)+": choose who takes it");
    else if (r.toId === current(r.slotKey, r.fromId)) problems.push(slotText(s)+": "+getName(r.toId)+" already has it");
    else if (role === "lead" && (rr.secondary||[]).includes(r.toId)) problems.push(slotText(s)+": "+getName(r.toId)+" is already Secondary that week");
    else if (role === "secondary" && (rr.lead === r.toId || (rr.secondary||[]).includes(r.toId))) problems.push(slotText(s)+": "+getName(r.toId)+" is already on that week");
    if (rows.some((o, j) => j !== i && o.slotKey === r.slotKey && o.fromId === r.fromId)) problems.push(slotText(s)+" is in the plan twice");
  });
  // How many weeks each person ends up with in this role (upcoming weeks)
  const before = {}, after = {};
  upcoming.forEach(s => { const r = rotas[s.key]||{}; (role === "lead" ? [r.lead] : (r.secondary||[])).filter(Boolean).forEach(id => { before[id] = (before[id]||0) + 1; after[id] = (after[id]||0) + 1; }); });
  filled.forEach(r => { const f = current(r.slotKey, r.fromId); if (f) after[f] = (after[f]||0) - 1; after[r.toId] = (after[r.toId]||0) + 1; });
  const changed = Object.keys(after).filter(id => (before[id]||0) !== after[id]);

  const apply = () => {
    if (filled.length === 0) return showToast("Add at least one week","error");
    if (problems.length) return showToast(problems[0],"error");
    const at = new Date().toISOString();
    const next = { ...rotas };
    filled.forEach(r => {
      const rr = { lead:"", primary:[], secondary:[], actOwners:{}, ...(next[r.slotKey]||{}) };
      const from = current(r.slotKey, r.fromId);
      if (role === "lead") rr.lead = r.toId;
      else rr.secondary = from && (rr.secondary||[]).includes(from) ? rr.secondary.map(x => x === from ? r.toId : x) : [...(rr.secondary||[]), r.toId];
      rr.swapLog = [...(rr.swapLog||[]), { at, role, from, to:r.toId }];
      next[r.slotKey] = rr;
    });
    upRotas(next);
    // Requests answered by this plan: the ones it started from, and any pending ones it covers
    const covered = o => isSwap(o) && o.status === "pending" && o.role === role
      && (linked.includes(o.id) || filled.some(r => r.slotKey === o.slotKey && current(r.slotKey, r.fromId) === o.memberId));
    if ((generalOffers||[]).some(covered))
      upGeneralOffers((generalOffers||[]).map(o => covered(o) ? { ...o, status:"done", resolvedAt:at } : o));
    showToast(filled.length+" week"+(filled.length>1?"s":"")+" updated");
    reset();
  };

  const sel = "w-full border border-slate-200 rounded-lg px-2 py-1.5 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-violet-300";
  return (
    <div className="bg-white rounded-2xl border border-violet-200 shadow-sm">
      <button onClick={()=>setOpen(!open)} className="w-full flex items-center gap-3 p-4 text-left">
        <span className="text-xl">🔁</span>
        <div className="flex-1">
          <div className="font-semibold text-slate-800">Swap Rota Leads / Secondaries</div>
          <div className="text-xs text-slate-400">Swap two people's weeks, or move several weeks round in a chain</div>
        </div>
        {pending.length > 0 && <span className="bg-red-500 text-white text-xs font-bold px-2 py-0.5 rounded-full">{pending.length} request{pending.length>1?"s":""}</span>}
        <span className={"text-slate-400 text-xs transition-transform "+(open?"rotate-90":"")}>▶</span>
      </button>
      {open && (
        <div className="px-4 pb-4 space-y-4 border-t border-slate-100 pt-4">
          {/* Requests from members */}
          {pending.length > 0 && (
            <div className="space-y-2">
              <div className="text-xs font-bold text-slate-500 uppercase tracking-wider">Swap requests</div>
              {pending.map(o => (
                <div key={o.id} className={"rounded-xl border px-3 py-2 text-sm "+(linked.includes(o.id)?"border-violet-400 bg-violet-50":"border-slate-200")}>
                  <div className="flex items-start gap-2 flex-wrap">
                    <div className="flex-1 min-w-0">
                      <b>{o.name}</b> can't do <b>{slotText(slotOf(o.slotKey))}</b> as {SWAP_ROLE[o.role]}
                      {(o.withId || o.withSlotKey) && <span className="text-slate-500"> · agreed with {o.withId ? getName(o.withId) : "anyone"}{o.withSlotKey ? " for "+slotText(slotOf(o.withSlotKey)) : ""}</span>}
                      {o.note && <div className="text-xs text-slate-500 italic">"{o.note}"</div>}
                    </div>
                    <button onClick={()=>planFrom(o)} className="text-xs bg-violet-600 text-white px-3 py-1.5 rounded-lg font-semibold hover:bg-violet-700">Plan swap</button>
                    <button onClick={()=>{setDeclining(o.id); setDeclineNote("");}} className="text-xs text-red-500 underline">Decline</button>
                  </div>
                  {declining === o.id && (
                    <div className="flex gap-2 mt-2">
                      <input value={declineNote} onChange={e=>setDeclineNote(e.target.value)} placeholder="Reason (shown to them)" autoFocus
                        className="flex-1 border border-slate-200 rounded-lg px-2 py-1 text-xs"/>
                      <button onClick={()=>decline(o)} className="text-xs bg-red-600 text-white px-3 py-1 rounded-lg font-semibold">Decline</button>
                      <button onClick={()=>setDeclining(null)} className="text-xs text-slate-500">Cancel</button>
                    </div>
                  )}
                </div>
              ))}
            </div>
          )}

          {/* Planner */}
          <div className="space-y-2">
            <div className="flex items-center gap-2 flex-wrap">
              <span className="text-xs font-bold text-slate-500 uppercase tracking-wider">Swap</span>
              {["lead","secondary"].map(r => (
                <button key={r} onClick={()=>reset(r)} disabled={linked.length > 0 && role !== r}
                  title={linked.length > 0 && role !== r ? "This request is for a "+SWAP_ROLE[role]+" — Clear the plan to swap "+(r==="lead"?"Rota Leads":"Secondaries") : ""}
                  className={"text-xs px-3 py-1.5 rounded-full font-semibold border disabled:opacity-30 "+(role===r?"bg-violet-600 text-white border-violet-600":"bg-white text-slate-600 border-slate-200")}>{r === "lead" ? "Rota Leads" : "Secondaries"}</button>
              ))}
              {linked.length > 0 && <span className="text-xs text-violet-700">Planning {SWAP_ROLE[role]} request</span>}
            </div>
            {rows.map((r, i) => {
              const rr = rotas[r.slotKey]||{};
              return (
                <div key={i} className="grid grid-cols-1 md:grid-cols-[2fr_1.2fr_auto_1.2fr_auto] gap-2 items-center bg-slate-50 rounded-xl p-2">
                  <select value={r.slotKey} onChange={e=>pickWeek(i, e.target.value)} className={sel}>
                    <option value="">Choose week…</option>
                    {upcoming.map(s => <option key={s.key} value={s.key}>{weekLabel(s)}</option>)}
                  </select>
                  {role === "lead" || (rr.secondary||[]).length <= 1 ? (
                    <div className="text-sm text-slate-600 px-2 truncate">{r.slotKey ? (current(r.slotKey, r.fromId) ? getName(current(r.slotKey, r.fromId)) : "— nobody —") : ""}</div>
                  ) : (
                    <select value={r.fromId} onChange={e=>setRow(i, { fromId:e.target.value })} className={sel}>
                      {(rr.secondary||[]).map(id => <option key={id} value={id}>{getName(id)}</option>)}
                    </select>
                  )}
                  <span className="text-slate-400 text-center hidden md:block">→</span>
                  <select value={r.toId ? r.toId+"|"+(r.pairKey||"") : ""} onChange={e=>pickPerson(i, e.target.value)} disabled={!r.slotKey || r.auto} className={sel}
                    title={r.auto ? "Filled in by the swap above" : ""}>
                    <option value="">New {SWAP_ROLE[role]}…</option>
                    {/* Proper swaps only: each person with their own weeks to swap for */}
                    {people.filter(m => m.id !== current(r.slotKey, r.fromId)).map(m => {
                      const theirs = weeksOf(m.id).filter(s => s.key !== r.slotKey);
                      if (theirs.length === 0) return null;
                      return (
                        <optgroup key={m.id} label={m.name+" — "+theirs.length+" week"+(theirs.length>1?"s":"")}>
                          {theirs.map(s => <option key={s.key} value={m.id+"|"+s.key}>{m.name} ⇄ swap for {dayText(s)}</option>)}
                        </optgroup>
                      );
                    })}
                    {r.toId && !r.pairKey && <option value={r.toId+"|"}>{getName(r.toId)}</option>}
                  </select>
                  <button onClick={()=>setRows(rows.length > 1 ? rows.filter((_, j) => j !== i && !(rows[j].auto && rows[j].pairOf === r.slotKey)) : [{ slotKey:"", fromId:"", toId:"" }])}
                    className="text-slate-400 hover:text-red-500 text-sm px-2" title="Remove this week">✕</button>
                </div>
              );
            })}
            <div className="flex gap-2 flex-wrap">
              <button onClick={()=>setRows([...rows, { slotKey:"", fromId:"", toId:"" }])}
                className="text-xs border border-slate-200 bg-white px-3 py-1.5 rounded-lg font-semibold text-slate-600 hover:bg-slate-50">+ Add week</button>
              {rows.filter(r => r.slotKey).length >= 2 && (
                <button onClick={rotate} className="text-xs border border-violet-200 bg-violet-50 px-3 py-1.5 rounded-lg font-semibold text-violet-700 hover:bg-violet-100"
                  title="Each week takes the person from the week above; the first week takes the last one's person">↻ Fill in as a swap / chain</button>
              )}
            </div>
          </div>

          {/* Preview */}
          {filled.length > 0 && (
            <div className="bg-violet-50 border border-violet-200 rounded-xl p-3 text-sm space-y-1">
              <div className="text-xs font-bold text-violet-700 uppercase tracking-wider">After the swap</div>
              {filled.map((r, i) => <div key={i}>{slotText(slotOf(r.slotKey))}: <s className="text-slate-400">{current(r.slotKey, r.fromId) ? getName(current(r.slotKey, r.fromId)) : "nobody"}</s> → <b>{getName(r.toId)}</b></div>)}
              {changed.length > 0 && (
                <div className="text-xs text-slate-500 pt-1">Upcoming weeks as {SWAP_ROLE[role]}: {changed.map(id => getName(id)+" "+(before[id]||0)+"→"+after[id]).join(" · ")}</div>
              )}
            </div>
          )}
          {problems.length > 0 && filled.length > 0 && (
            <div className="text-xs text-red-600 space-y-0.5">{problems.map((p, i) => <div key={i}>⚠ {p}</div>)}</div>
          )}
          <div className="flex gap-2">
            <button onClick={apply} disabled={filled.length === 0 || problems.length > 0}
              className="bg-violet-600 hover:bg-violet-700 text-white px-5 py-2 rounded-xl text-sm font-bold disabled:opacity-40">Apply swap to the rota</button>
            {(rows.length > 1 || rows[0].slotKey) && <button onClick={()=>reset()} className="text-sm text-slate-500 px-2">Clear</button>}
          </div>
        </div>
      )}
    </div>
  );
}

function MDAssignments({ members, rotas, upRotas, allSlots, showToast, specials, upSpecials, generalOffers=[], upGeneralOffers }) {
  const today = new Date(); today.setHours(0,0,0,0);
  const [search, setSearch]   = useState("");
  const [filter, setFilter]   = useState("upcoming");
  const [selSlot, setSelSlot] = useState(null);
  const [local, setLocal]     = useState({lead:"",primary:[],secondary:[],actOwners:{},notes:""});

  const slots = allSlots.filter(s=>{
    const d=new Date(s.date);
    if(filter==="upcoming") return d>=today;
    if(filter==="past")     return d<today;
    return true;
  }).filter(s=>!search||s.label.toLowerCase().includes(search.toLowerCase()));

  useEffect(()=>{ if(selSlot) setLocal({lead:"",primary:[],secondary:[],actOwners:{},notes:"",...(rotas[selSlot.key]||{})}); },[selSlot?.key]);

  const getName    = id => members.find(m=>m.id===id)?.name||"—";
  const primaries  = members.filter(m=>m.role==="primary");
  const secondaries= members.filter(m=>m.role==="secondary");

  const toggle = (type, id) => {
    const arr=local[type]||[];
    setLocal({...local,[type]:arr.includes(id)?arr.filter(x=>x!==id):[...arr,id]});
  };
  const save = () => { upRotas({...rotas,[selSlot.key]:local}); showToast("Assignment saved"); };
  const clearSlot = () => {
    const next={...rotas}; delete next[selSlot.key]; upRotas(next);
    setLocal({lead:"",primary:[],secondary:[],actOwners:{},notes:""});
    showToast("Assignment cleared");
  };

  return (
    <div className="space-y-4">
    <SwapPlanner members={members} rotas={rotas} upRotas={upRotas} allSlots={allSlots} generalOffers={generalOffers} upGeneralOffers={upGeneralOffers} showToast={showToast}/>
    <SpecialOccasions specials={specials} upSpecials={upSpecials} showToast={showToast}/>
    <div className="flex gap-5 items-start">
      <div className="w-72 flex-shrink-0 space-y-3">
        <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-3 space-y-2">
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search weeks…"
            className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300"/>
          <div className="flex bg-slate-100 rounded-lg p-0.5 gap-0.5">
            {[{k:"upcoming",l:"Upcoming"},{k:"past",l:"Past"},{k:"all",l:"All"}].map(f=>(
              <button key={f.k} onClick={()=>setFilter(f.k)}
                className={`flex-1 py-1.5 rounded-md text-xs font-semibold transition-colors ${filter===f.k?"bg-white text-slate-700 shadow-sm":"text-slate-500"}`}>{f.l}</button>
            ))}
          </div>
        </div>
        <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
          <div className="max-h-[65vh] overflow-y-auto scrollbar-hide divide-y divide-slate-100">
            {slots.map(s=>{
              const r=rotas[s.key]||{};
              const isSel=selSlot?.key===s.key;
              return (
                <button key={s.key} onClick={()=>setSelSlot(s)}
                  className={`w-full text-left px-4 py-3 hover:bg-slate-50 transition-colors ${isSel?"bg-indigo-50":""}`}>
                  <div className="flex items-center justify-between gap-2">
                    <span className="text-sm font-medium text-slate-700 truncate">{s.isSpecial?"⭐ ":""}{s.label}</span>
                    <span className={`w-2.5 h-2.5 rounded-full flex-shrink-0 ${r.lead?"bg-emerald-400":"bg-amber-300"}`}/>
                  </div>
                  {r.lead
                    ? <div className="text-xs text-slate-400 mt-0.5">Lead: {getName(r.lead)}{(r.primary||[]).length>0&&` · ${r.primary.length}P`}{(r.secondary||[]).length>0&&` · ${r.secondary.length}S`}</div>
                    : <div className="text-xs text-amber-500 mt-0.5">Not assigned</div>}
                </button>
              );
            })}
            {slots.length===0&&<div className="p-8 text-center text-slate-400 text-sm">No slots found.</div>}
          </div>
        </div>
      </div>
      <div className="flex-1 min-w-0">
        {!selSlot ? (
          <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-16 text-center text-slate-400">
            <div className="text-6xl mb-4">📅</div>
            <p className="font-semibold text-lg">Select a rota slot</p>
            <p className="text-sm mt-1">Choose a week from the list to assign members</p>
          </div>
        ) : (
          <div className="space-y-4 fade-in">
            <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 flex items-start justify-between gap-4">
              <div>
                <h3 className="font-bold text-slate-800 text-lg">{selSlot.isSpecial?"⭐ ":"📅 "}{selSlot.label}</h3>
                <p className="text-slate-500 text-xs mt-0.5">{new Date(selSlot.date).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</p>
              </div>
              <div className="flex gap-2 flex-shrink-0">
                <button onClick={clearSlot} className="text-xs bg-red-50 border border-red-200 text-red-500 px-3 py-1.5 rounded-lg hover:bg-red-100 font-medium">Clear All</button>
                <button onClick={save} className="bg-indigo-600 text-white text-sm px-5 py-1.5 rounded-lg hover:bg-indigo-700 font-bold shadow-sm">Save</button>
              </div>
            </div>
            <div className="grid md:grid-cols-3 gap-4">
              <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-4">
                <h4 className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">🎯 Rota Lead</h4>
                <div className="space-y-1.5 max-h-64 overflow-y-auto scrollbar-hide">
                  <button onClick={()=>setLocal({...local,lead:""})}
                    className={`w-full text-left px-3 py-2 rounded-lg text-sm border transition-colors ${!local.lead?"bg-slate-100 border-slate-300 font-semibold":"border-transparent hover:bg-slate-50 text-slate-500"}`}>— None</button>
                  {[...primaries,...secondaries].map(m=>(
                    <button key={m.id} onClick={()=>setLocal({...local,lead:m.id})}
                      className={`w-full text-left px-3 py-2 rounded-lg text-sm border flex items-center gap-2 transition-colors ${local.lead===m.id?"bg-indigo-50 border-indigo-300 text-indigo-700 font-semibold":"border-transparent hover:bg-slate-50"}`}>
                      <Avatar name={m.name} size="sm"/>
                      <span className="flex-1 truncate">{m.name}</span>
                      <span className={`text-xs px-1.5 py-0.5 rounded-full ${m.role==="primary"?"bg-indigo-100 text-indigo-500":m.role==="secondary"?"bg-violet-100 text-violet-500":"bg-emerald-100 text-violet-500"}`}>{m.role[0].toUpperCase()}</span>
                    </button>
                  ))}
                </div>
              </div>
              <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-4">
                <h4 className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">🎯 Rota Leads <span className="font-normal">({(local.primary||[]).length})</span></h4>
                {primaries.length===0 ? <p className="text-slate-400 text-sm">No rota leads.</p> : (
                  <div className="space-y-1.5 max-h-64 overflow-y-auto scrollbar-hide">
                    {primaries.map(m=>{const on=(local.primary||[]).includes(m.id);return(
                      <button key={m.id} onClick={()=>toggle("primary",m.id)}
                        className={`w-full text-left px-3 py-2 rounded-lg text-sm border flex items-center gap-2 transition-colors ${on?"bg-indigo-50 border-indigo-300 text-indigo-700":"border-transparent hover:bg-slate-50"}`}>
                        <Checkbox checked={on} color="indigo"/><Avatar name={m.name} size="sm"/><span className="flex-1 truncate">{m.name}</span>
                      </button>
                    );})}
                  </div>
                )}
              </div>
              <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-4">
                <h4 className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">🟣 Secondary <span className="font-normal">({(local.secondary||[]).length})</span></h4>
                {secondaries.length===0 ? <p className="text-slate-400 text-sm">No secondary members.</p> : (
                  <div className="space-y-1.5 max-h-64 overflow-y-auto scrollbar-hide">
                    {secondaries.map(m=>{const on=(local.secondary||[]).includes(m.id);return(
                      <button key={m.id} onClick={()=>toggle("secondary",m.id)}
                        className={`w-full text-left px-3 py-2 rounded-lg text-sm border flex items-center gap-2 transition-colors ${on?"bg-violet-50 border-violet-300 text-violet-700":"border-transparent hover:bg-slate-50"}`}>
                        <Checkbox checked={on} color="violet"/><Avatar name={m.name} size="sm"/><span className="flex-1 truncate">{m.name}</span>
                      </button>
                    );})}
                  </div>
                )}
              </div>
            </div>
            <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-4">
              <h4 className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">📝 Notes</h4>
              <textarea value={local.notes||""} onChange={e=>setLocal({...local,notes:e.target.value})}
                rows={2} placeholder="Any notes for this rota slot…"
                className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 resize-none"/>
            </div>
            <div className="flex justify-end">
              <button onClick={save} className="bg-indigo-600 text-white px-8 py-2.5 rounded-xl font-bold hover:bg-indigo-700 shadow-sm">Save Assignment</button>
            </div>
          </div>
        )}
      </div>
    </div>
    </div>
  );
}

// ── MD: Activities ────────────────────────────────────────────────────────────
function MDActivities({ activities, upActs, members, showToast }) {
  const blank = {name:"",description:"",owner:""};
  const [form, setForm]     = useState(blank);
  const [editId, setEditId] = useState(null);
  const [confirmDel, setConfirmDel] = useState(null);

  const save = () => {
    if (!form.name.trim()) return showToast("Activity name required","error");
    if (editId) { upActs(activities.map(a=>a.id===editId?{...a,...form}:a)); showToast("Updated"); setEditId(null); }
    else { upActs([...activities,{id:uid(),...form}]); showToast("Activity added"); }
    setForm(blank);
  };
  const remove = id => { upActs(activities.filter(a=>a.id!==id)); setConfirmDel(null); showToast("Removed"); };
  const edit   = a  => { setEditId(a.id); setForm({name:a.name,description:a.description||"",owner:a.owner||""}); };
  const cancel = () => { setEditId(null); setForm(blank); };
  const getName= id => members.find(m=>m.id===id)?.name||"";
  const moveUp   = i => { if(i===0)return; const a=[...activities];[a[i-1],a[i]]=[a[i],a[i-1]];upActs(a); };
  const moveDown = i => { if(i===activities.length-1)return; const a=[...activities];[a[i],a[i+1]]=[a[i+1],a[i]];upActs(a); };

  return (
    <div className="grid md:grid-cols-5 gap-6">
      <div className="md:col-span-2">
        <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 sticky top-4 space-y-3">
          <div className="flex items-center justify-between">
            <h2 className="font-bold text-slate-800 text-base">{editId?"✏️ Edit Activity":"➕ Add Activity"}</h2>
            {editId&&<button onClick={cancel} className="text-xs text-slate-400 hover:text-slate-600">✕ Cancel</button>}
          </div>
          <Field label="Activity Name *" value={form.name} onChange={v=>setForm({...form,name:v})} placeholder="e.g. Setup & Preparation"/>
          <div>
            <label className="text-xs font-semibold text-slate-500 mb-1 block">Description</label>
            <textarea value={form.description} onChange={e=>setForm({...form,description:e.target.value})}
              rows={2} placeholder="What does this involve?"
              className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 resize-none"/>
          </div>
          <div>
            <label className="text-xs font-semibold text-slate-500 mb-1 block">Default Owner</label>
            <select value={form.owner} onChange={e=>setForm({...form,owner:e.target.value})}
              className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 bg-white">
              <option value="">— None</option>
              {members.map(m=><option key={m.id} value={m.id}>{m.name} ({roleLabel(m.role)})</option>)}
            </select>
          </div>
          <button onClick={save} className="w-full bg-indigo-600 text-white rounded-lg py-2.5 text-sm font-bold hover:bg-indigo-700">{editId?"Save Changes":"Add Activity"}</button>
        </div>
      </div>
      <div className="md:col-span-3 space-y-3">
        <div className="flex items-center justify-between">
          <h3 className="font-semibold text-slate-700">{activities.length} Activities</h3>
          {activities.length>1&&<span className="text-xs text-slate-400">↑↓ to reorder</span>}
        </div>
        {activities.length===0 ? (
          <div className="bg-white rounded-2xl border border-slate-200 p-14 text-center text-slate-400">
            <div className="text-5xl mb-3">✅</div><p className="font-semibold">No activities yet</p>
          </div>
        ) : (
          <div className="space-y-2">
            {activities.map((a,i)=>(
              <div key={a.id} className={`bg-white border rounded-2xl px-4 py-3 flex items-start gap-3 shadow-sm transition-all ${editId===a.id?"border-indigo-300 ring-1 ring-indigo-200":"border-slate-200 hover:shadow"}`}>
                <div className="flex flex-col gap-0.5 flex-shrink-0 mt-0.5">
                  <button onClick={()=>moveUp(i)}   disabled={i===0}                   className="w-6 h-6 flex items-center justify-center rounded bg-slate-100 hover:bg-slate-200 text-slate-500 disabled:opacity-20 text-xs">↑</button>
                  <button onClick={()=>moveDown(i)} disabled={i===activities.length-1} className="w-6 h-6 flex items-center justify-center rounded bg-slate-100 hover:bg-slate-200 text-slate-500 disabled:opacity-20 text-xs">↓</button>
                </div>
                <div className="w-8 h-8 rounded-lg bg-emerald-100 text-emerald-700 flex items-center justify-center font-bold text-xs flex-shrink-0">{i+1}</div>
                <div className="flex-1 min-w-0">
                  <div className="font-semibold text-slate-800 text-sm">{a.name}</div>
                  {a.description&&<div className="text-xs text-slate-400 mt-0.5">{a.description}</div>}
                  {a.owner&&<div className="text-xs text-indigo-500 font-medium mt-0.5">Default owner: {getName(a.owner)}</div>}
                </div>
                <div className="flex gap-1 flex-shrink-0">
                  <button onClick={()=>edit(a)} className="text-xs bg-slate-50 border border-slate-200 text-slate-600 px-2.5 py-1.5 rounded-lg hover:bg-slate-100 font-medium">Edit</button>
                  <button onClick={()=>setConfirmDel(a)} className="text-xs bg-red-50 border border-red-200 text-red-500 px-2.5 py-1.5 rounded-lg hover:bg-red-100 font-medium">Delete</button>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
      {confirmDel&&(
        <div className="fixed inset-0 bg-black bg-opacity-40 z-50 flex items-center justify-center p-4" onClick={()=>setConfirmDel(null)}>
          <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6 fade-in" onClick={e=>e.stopPropagation()}>
            <div className="text-4xl mb-3 text-center">⚠️</div>
            <h3 className="font-bold text-slate-800 text-center mb-1">Delete Activity?</h3>
            <p className="text-slate-500 text-sm text-center mb-4">"<strong>{confirmDel.name}</strong>" will be permanently removed.</p>
            <div className="flex gap-3">
              <button onClick={()=>remove(confirmDel.id)} className="flex-1 bg-red-600 text-white rounded-xl py-2.5 font-bold text-sm hover:bg-red-700">Delete</button>
              <button onClick={()=>setConfirmDel(null)} className="flex-1 bg-slate-100 text-slate-600 rounded-xl py-2.5 font-semibold text-sm">Cancel</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── MD: Registers definition ──────────────────────────────────────────────────
function MDRegisters({ registers, upRegs, regEntries, members, showToast }) {
  const blank = {name:"",prefix:"",color:"violet",ticketPrice:""};
  const [form, setForm]     = useState(blank);
  const [editId, setEditId] = useState(null);
  const [confirmDel, setConfirmDel] = useState(null);

  const save = () => {
    if (!form.name.trim()) return showToast("Name required","error");
    const prefix=(form.prefix||initials(form.name)).toUpperCase();
    if (editId) { upRegs(registers.map(r=>r.id===editId?{...r,...form,prefix}:r)); showToast("Register updated"); setEditId(null); }
    else { upRegs([...registers,{id:uid(),...form,prefix,nextNum:1}]); showToast("Register added"); }
    setForm(blank);
  };
  const remove = id => { upRegs(registers.filter(r=>r.id!==id)); setConfirmDel(null); showToast("Deleted"); };
  const edit   = r  => { setEditId(r.id); setForm({name:r.name,prefix:r.prefix,color:r.color,ticketPrice:r.ticketPrice||""}); };
  const cancel = () => { setEditId(null); setForm(blank); };
  const gClosed  = rid => Object.values(regEntries).filter(se=>se[rid]?.closed).length;
  const gTickets = rid => Object.values(regEntries).reduce((t,se)=>t+(se[rid]?.tickets?.length||0),0);

  return (
    <div className="grid md:grid-cols-5 gap-6">
      <div className="md:col-span-2">
        <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 sticky top-4 space-y-3">
          <div className="flex items-center justify-between">
            <h2 className="font-bold text-slate-800 text-base">{editId?"✏️ Edit Register":"➕ Add Register"}</h2>
            {editId&&<button onClick={cancel} className="text-xs text-slate-400 hover:text-slate-600">✕ Cancel</button>}
          </div>
          <Field label="Register Name *" value={form.name} onChange={v=>setForm({...form,name:v,prefix:form.prefix||initials(v)})} placeholder="e.g. Archanai Register"/>
          <Field label="Number Prefix (auto)" value={form.prefix} onChange={v=>setForm({...form,prefix:v.toUpperCase()})} placeholder="e.g. A"/>
          <Field label="Ticket Price £ (optional)" type="number" value={form.ticketPrice} onChange={v=>setForm({...form,ticketPrice:v})} placeholder="e.g. 2.50"/>
          <div>
            <label className="text-xs font-semibold text-slate-500 mb-2 block">Colour Theme</label>
            <div className="flex gap-2 flex-wrap">
              {Object.keys(REG_COLORS).map(col=>{
                const c=REG_COLORS[col];
                return <button key={col} onClick={()=>setForm({...form,color:col})} title={col}
                  className={`w-9 h-9 rounded-full ${c.dot} border-4 transition-all ${form.color===col?"border-slate-800 scale-110":"border-transparent hover:scale-105"}`}/>;
              })}
            </div>
            {form.color&&<div className={`mt-2 text-xs font-semibold px-2 py-1 rounded-lg inline-block ${REG_COLORS[form.color]?.badge||""}`}>Preview: {form.prefix||"?"}{form.name?" — "+form.name:""}</div>}
          </div>
          <button onClick={save} className="w-full bg-indigo-600 text-white rounded-lg py-2.5 text-sm font-bold hover:bg-indigo-700">{editId?"Save Changes":"Add Register"}</button>
          <div className="bg-amber-50 border border-amber-200 rounded-xl p-3 text-xs text-amber-700">
            <strong className="block mb-1">ℹ️ Numbering</strong>
            Numbers are globally sequential and never reset. Register definitions set up the prefix and pricing used on Rota Sheets.
          </div>
        </div>
      </div>
      <div className="md:col-span-3 space-y-3">
        <h3 className="font-semibold text-slate-700">{registers.length} Registers</h3>
        {registers.length===0 ? (
          <div className="bg-white rounded-2xl border border-slate-200 p-14 text-center text-slate-400">
            <div className="text-5xl mb-3">📒</div><p className="font-semibold">No registers yet</p>
          </div>
        ) : (
          <div className="space-y-3">
            {registers.map(reg=>{
              const c=REG_COLORS[reg.color]||REG_COLORS.indigo;
              const closed=gClosed(reg.id), tickets=gTickets(reg.id), nextN=reg.nextNum+closed;
              return (
                <div key={reg.id} className={`bg-white border rounded-2xl overflow-hidden shadow-sm transition-all ${editId===reg.id?"border-indigo-300 ring-1 ring-indigo-200":`${c.border} hover:shadow`}`}>
                  <div className={`${c.head} text-white px-5 py-3 flex items-center justify-between`}>
                    <div className="flex items-center gap-3">
                      <div className="w-10 h-10 rounded-xl bg-white bg-opacity-20 flex items-center justify-center font-black text-xl">{reg.prefix}</div>
                      <div>
                        <div className="font-bold">{reg.name}</div>
                        <div className="text-white text-opacity-70 text-xs">Prefix: <b>{reg.prefix}</b> · Next: <b>{fmtRegNum(reg.prefix,nextN)}</b>{reg.ticketPrice&&<> · £{reg.ticketPrice}/ticket</>}</div>
                      </div>
                    </div>
                    <div className="flex gap-2">
                      <button onClick={()=>edit(reg)} className="text-xs bg-white bg-opacity-20 hover:bg-white bg-opacity-30 text-white px-3 py-1.5 rounded-lg font-medium">Edit</button>
                      <button onClick={()=>setConfirmDel(reg)} className="text-xs bg-red-500 bg-opacity-30 hover:bg-red-500 bg-opacity-50 text-white px-3 py-1.5 rounded-lg font-medium">Delete</button>
                    </div>
                  </div>
                  <div className="px-5 py-3 flex flex-wrap gap-6 text-sm items-end">
                    <div><span className="text-slate-400 text-xs">Sessions closed</span><div className="font-bold text-slate-700">{closed}</div></div>
                    <div><span className="text-slate-400 text-xs">Total tickets</span><div className="font-bold text-slate-700">{tickets}</div></div>
                    {reg.ticketPrice&&tickets>0&&<div><span className="text-slate-400 text-xs">Total revenue</span><div className="font-bold text-emerald-600">£{(tickets*parseFloat(reg.ticketPrice)).toFixed(2)}</div></div>}
                    <div className="ml-auto">
                      <span className="text-slate-400 text-xs block mb-1">Latest Number (editable)</span>
                      <div className="flex items-center gap-2">
                        <span className="text-xs text-slate-500 font-mono">{reg.prefix}</span>
                        <input type="number" min="0"
                          value={reg.latestNum||0}
                          onChange={e=>upRegs(registers.map(r=>r.id===reg.id?{...r,latestNum:parseInt(e.target.value)||0}:r))}
                          className="w-24 border border-slate-300 rounded-lg px-2 py-1 text-sm text-center font-mono font-bold focus:outline-none focus:ring-2 focus:ring-indigo-300"/>
                        <span className="text-xs text-slate-400">→ next: <b>{fmtRegNum(reg.prefix,(reg.latestNum||0)+1)}</b></span>
                      </div>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>
      {confirmDel&&(
        <div className="fixed inset-0 bg-black bg-opacity-40 z-50 flex items-center justify-center p-4" onClick={()=>setConfirmDel(null)}>
          <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6 fade-in" onClick={e=>e.stopPropagation()}>
            <div className="text-4xl mb-3 text-center">⚠️</div>
            <h3 className="font-bold text-slate-800 text-center mb-1">Delete Register?</h3>
            <p className="text-slate-500 text-sm text-center mb-4">"<strong>{confirmDel.name}</strong>" and all ticket history will be deleted.</p>
            <div className="flex gap-3">
              <button onClick={()=>remove(confirmDel.id)} className="flex-1 bg-red-600 text-white rounded-xl py-2.5 font-bold text-sm hover:bg-red-700">Delete</button>
              <button onClick={()=>setConfirmDel(null)} className="flex-1 bg-slate-100 text-slate-600 rounded-xl py-2.5 font-semibold text-sm">Cancel</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}


// ─── Rota Sheet ──────────────────────────────────────────────────────────────
const DENOMS = [
  {label:"£50",  val:50,   pence:false},
  {label:"£20",  val:20,   pence:false},
  {label:"£10",  val:10,   pence:false},
  {label:"£5",   val:5,    pence:false},
  {label:"£2",   val:2,    pence:false},
  {label:"£1",   val:1,    pence:false},
  {label:"50p",  val:0.5,  pence:true},
  {label:"20p",  val:0.20, pence:true},
  {label:"10p",  val:0.10, pence:true},
  {label:"5p",   val:0.05, pence:true},
];

const CHECKLIST = ["Bins Cleared","Lights Off","Alarm Set","Door Locked","Keys in Locker"];

// ─── Rota Sheet printout: one A4 page, scaled down to fit when the day is busy ──
function printRotaSheet(s, { config = {}, rotaSheets = [], sponsorships = [] } = {}) {
  const esc = v => String(v == null ? "" : v).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  const gbp = v => "£" + parseFloat(v || 0).toFixed(2);
  const dash = v => (v == null || v === "") ? "—" : esc(v);
  const day = d => d ? new Date(d).toLocaleDateString("en-GB", { day:"numeric", month:"short", year:"numeric" }) : "—";
  const pay = p => ({ cash:"Cash", sumup:"Card", online:"Online" }[p] || "—");
  const at = s.archanaTickets || {}, db = s.donationBook || {}, ev = s.expenseVouchers || {};
  const closed = s.status === "closed";
  const denoms = s.denomClose || Object.fromEntries(DENOMS.map(d => [d.label, (s.denoms && s.denoms[d.label] && s.denoms[d.label].count) || ""]));
  const counted = DENOMS.reduce((t, d) => t + parseFloat(denoms[d.label] || 0) * d.val, 0);
  const hundi = parseFloat((s.hundi && s.hundi.amount) || 0);
  const cashIn = parseFloat(at.cashAmount || 0) + parseFloat(db.cashAmount || 0) + hundi;
  const cashOut = parseFloat(ev.cashAmount || 0);
  const expected = parseFloat(s.openingBalance || 0) + cashIn - cashOut;
  const diff = counted - expected;
  const card = parseFloat(at.sumupAmount || 0) + parseFloat(db.sumupAmount || 0) - parseFloat(ev.sumupAmount || 0);
  const online = parseFloat(at.onlineAmount || 0) + parseFloat(db.onlineAmount || 0) - parseFloat(ev.onlineAmount || 0);
  const income = parseFloat(at.amount || 0) + parseFloat(db.amount || 0) + hundi;
  const net = income - parseFloat(ev.amount || 0);
  // First and last numbers issued today: the last is r.end, the first is (count − 1) before it
  const range = (r, n) => {
    n = parseInt(n) || 0;
    const m = String(r.end || "").match(/^(.*?)(\d+)$/);
    if (!n || !m) return "—";
    const first = fmtRegNum(m[1], parseInt(m[2], 10) - n + 1);
    return n === 1 ? esc(r.end) : esc(first) + " – " + esc(r.end);
  };
  const sponsors = [].concat(
    (sponsorships || []).flatMap(a => (a.donations || []).filter(d => (d.rotaDates || []).includes(s.date)).map(d => esc(d.donor) + " <i>(" + esc(a.name) + ")</i>")),
    servicePaidOn(rotaSheets, s.date).map(d => esc(d.donor) + " <i>(" + esc(d.area) + ")</i>"),
    s.sponsors ? [esc(s.sponsors)] : []);
  const regRow = (name, r, n) => "<tr><td><b>" + name + "</b></td><td>" + range(r, n) + "</td><td class='n'>" + (parseInt(n) || 0) + "</td><td class='n'>" + gbp(r.cashAmount) + "</td><td class='n'>" + gbp(r.sumupAmount) + "</td><td class='n'>" + gbp(r.onlineAmount) + "</td><td class='n'><b>" + gbp(r.amount) + "</b></td></tr>";
  const donors = db.donors || [], payees = ev.payees || [];
  const inBy = { sumup: parseFloat(at.sumupAmount || 0) + parseFloat(db.sumupAmount || 0), online: parseFloat(at.onlineAmount || 0) + parseFloat(db.onlineAmount || 0) };
  // "Cash £x · Card £y · Online £z" for a list of donations or expenses
  const split = list => ["cash", "sumup", "online"].map(k => pay(k) + " " + gbp(list.filter(d => d.pay === k).reduce((t, d) => t + parseFloat(d.amount || 0), 0))).join(" · ");
  const sig = s.signature ? "<img src='" + s.signature + "' style='height:34px'/>" : s.rotaLeadSig ? "<div style='font-size:13px;font-style:italic;padding-top:10px'>" + esc(s.rotaLeadSig) + "</div>" : "";

  let h = "<!DOCTYPE html><html><head><meta charset='utf-8'/><title>Rota Sheet " + esc(s.date) + "</title><style>"
    + "@page{size:A4;margin:10mm}*{box-sizing:border-box;margin:0;padding:0}"
    + "body{width:190mm;font-family:Arial,Helvetica,sans-serif;font-size:9px;color:#1e293b;background:#fff}"
    + ".hd{display:flex;align-items:center;gap:8px;border-bottom:2px solid #3730a3;padding-bottom:5px;margin-bottom:6px}"
    + ".hd img{height:38px;width:38px;object-fit:contain}.org{font-size:13px;font-weight:900;color:#1e1b4b}.sub{font-size:8px;color:#64748b}"
    + ".badge{margin-left:auto;text-align:right}.badge span{display:inline-block;padding:2px 8px;border-radius:4px;font-weight:bold;font-size:9px}"
    + ".grid{display:grid;gap:4px;margin-bottom:6px}.box{border:1px solid #e2e8f0;border-radius:4px;padding:3px 5px}"
    + ".l{font-size:7px;color:#64748b;text-transform:uppercase;letter-spacing:.03em}.v{font-weight:bold;font-size:9.5px}"
    + "h2{font-size:9.5px;color:#3730a3;margin:6px 0 2px;border-bottom:1px solid #c7d2fe;padding-bottom:1px}"
    + "table{width:100%;border-collapse:collapse}th{background:#eef2ff;color:#3730a3;font-size:7.5px;text-align:left;padding:2px 3px}"
    + "td{padding:1.5px 3px;border-bottom:1px solid #f1f5f9;font-size:8.5px;vertical-align:middle}.n{text-align:right;white-space:nowrap}"
    + "tr.t td{font-weight:bold;background:#f8fafc;border-top:1px solid #cbd5e1}.none{color:#94a3b8;font-style:italic;padding:2px 3px}"
    + ".dg{display:grid;grid-template-columns:repeat(10,1fr);gap:2px}.dc{border:1px solid #e2e8f0;border-radius:3px;text-align:center;padding:1px}"
    + ".ok{color:#166534}.bad{color:#b91c1c}@media print{.noprint{display:none!important}}"
    + "</style></head><body>";

  // Header
  h += "<div class='hd'>" + (config.logo ? "<img src='" + config.logo + "'/>" : "")
    + "<div><div class='org'>" + esc(config.fullName || config.orgName || "") + "</div>"
    + "<div class='sub'>" + (config.charityNo ? "Registered Charity No. " + esc(config.charityNo) + " · " : "") + "Rota Sheet · "
    + new Date(s.date).toLocaleDateString("en-GB", { weekday:"long", day:"numeric", month:"long", year:"numeric" }) + "</div></div>"
    + "<div class='badge'><span style='" + (closed ? "background:#dcfce7;color:#166534" : "background:#fef3c7;color:#92400e") + "'>" + (closed ? "CLOSED" : "OPEN — DRAFT") + "</span>"
    + "<div class='sub' style='margin-top:2px'>Open " + dash(s.openingTime) + " · Close " + dash(s.closingTime) + "</div></div></div>";

  // People
  h += "<div class='grid' style='grid-template-columns:repeat(5,1fr)'>"
    + [["Rota Lead", s.rotaLead], ["Rota Support", s.rotaSupport], ["Treasury", s.treasury], ["Priest", s.priest], ["Prasadham", s.prasadhamProvider]]
      .map(([l, v]) => "<div class='box'><div class='l'>" + l + "</div><div class='v'>" + dash(v) + "</div></div>").join("") + "</div>";
  if (sponsors.length) h += "<div class='box' style='margin-bottom:6px'><div class='l'>Sponsors</div><div>" + sponsors.join(", ") + "</div></div>";

  // Money summary
  h += "<h2>Money taken</h2><table><tr><th>Register</th><th>Numbers</th><th class='n'>Count</th><th class='n'>Cash</th><th class='n'>Card</th><th class='n'>Online</th><th class='n'>Total</th></tr>"
    + regRow("Archana" + (at.dayType === "special" ? " (£5)" : " (£3)"), at, at.ticketCount)
    + regRow("Donations", db, db.count)
    + "<tr><td><b>Hundi</b></td><td>—</td><td class='n'>—</td><td class='n'>" + gbp(hundi) + "</td><td class='n'>£0.00</td><td class='n'>£0.00</td><td class='n'><b>" + gbp(hundi) + "</b></td></tr>"
    + "<tr class='t'><td colspan='3'>Income</td><td class='n'>" + gbp(cashIn) + "</td><td class='n'>" + gbp(inBy.sumup) + "</td><td class='n'>" + gbp(inBy.online) + "</td><td class='n'>" + gbp(income) + "</td></tr>"
    + regRow("Expenses (out)", ev, ev.count)
    + "<tr class='t'><td colspan='3'>Net (income − expenses)</td><td class='n'>" + gbp(cashIn - cashOut) + "</td><td class='n'>" + gbp(card) + "</td><td class='n'>" + gbp(online) + "</td><td class='n'>" + gbp(net) + "</td></tr></table>";

  // Donations and expenses, side by side
  h += "<div class='grid' style='grid-template-columns:1fr 1fr;margin-top:2px'>";
  h += "<div><h2>Donations (" + donors.length + ")</h2>" + (donors.length
    ? "<table><tr><th>No.</th><th>Donor</th><th>For</th><th>Date</th><th>Pay</th><th class='n'>£</th></tr>"
      + donors.map(d => "<tr><td>" + esc(d.no) + "</td><td>" + esc(d.name) + "</td><td>" + esc(d.purpose || "General") + "</td><td>" + day(d.date) + "</td><td>" + pay(d.pay) + "</td><td class='n'>" + gbp(d.amount) + "</td></tr>").join("")
      + "<tr class='t'><td colspan='5'>" + split(donors) + "</td><td class='n'>" + gbp(donors.reduce((t, d) => t + parseFloat(d.amount || 0), 0)) + "</td></tr>"
      + "</table>"
    : "<div class='none'>No donations</div>") + "</div>";
  h += "<div><h2>Expenses (" + payees.length + ")</h2>" + (payees.length
    ? "<table><tr><th>No.</th><th>Paid to</th><th>For</th><th>Date</th><th>Pay</th><th class='n'>£</th><th>Signed</th></tr>"
      + payees.map(d => "<tr><td>" + esc(d.no) + "</td><td>" + esc(d.name) + "<div class='sub'>" + esc(d.contact) + "</div></td><td>" + esc(d.purpose) + "</td><td>" + day(d.date) + "</td><td>" + pay(d.pay) + "</td><td class='n'>" + gbp(d.amount) + "</td><td>"
        + (d.sig ? "<img src='" + d.sig + "' style='height:16px'/>" : "<span class='bad'>missing</span>") + "</td></tr>").join("")
      + "<tr class='t'><td colspan='5'>" + split(payees) + "</td><td class='n'>" + gbp(payees.reduce((t, d) => t + parseFloat(d.amount || 0), 0)) + "</td><td></td></tr>"
      + "</table>"
    : "<div class='none'>No expenses</div>") + "</div></div>";

  // Cash check + card/online
  h += "<div class='grid' style='grid-template-columns:2fr 1fr 1fr;margin-top:4px'>"
    + "<div class='box'><div class='l'>Cash check</div><table>"
    + "<tr><td>Opening balance</td><td class='n'>" + gbp(s.openingBalance) + "</td></tr>"
    + "<tr><td>+ Cash in (Archana, Donations, Hundi)</td><td class='n'>" + gbp(cashIn) + "</td></tr>"
    + "<tr><td>− Cash expenses</td><td class='n'>" + gbp(cashOut) + "</td></tr>"
    + "<tr class='t'><td>Expected cash</td><td class='n'>" + gbp(expected) + "</td></tr>"
    + "<tr><td>Counted (denominations)</td><td class='n'>" + gbp(counted) + "</td></tr>"
    + "<tr><td><b>Difference</b></td><td class='n " + (Math.abs(diff) < 0.01 ? "ok'><b>✓ matched" : "bad'><b>" + (diff > 0 ? "+" : "−") + gbp(Math.abs(diff)) + (diff > 0 ? " over" : " short")) + "</b></td></tr></table></div>"
    + "<div class='box'><div class='l'>Card total</div><div class='v' style='font-size:12px'>" + gbp(card) + "</div><div class='l' style='margin-top:4px'>Online total</div><div class='v' style='font-size:12px'>" + gbp(online) + "</div></div>"
    + "<div class='box'><div class='l'>Closing balance</div><div class='v' style='font-size:12px'>" + gbp(s.closingBalance || counted) + "</div><div class='l' style='margin-top:4px'>Head count</div><div class='v' style='font-size:12px'>" + dash(s.headcount || s.headCount) + "</div></div></div>";

  // Denominations
  h += "<h2>Denomination count — " + gbp(counted) + "</h2><div class='dg'>"
    + DENOMS.map(d => { const c = parseFloat(denoms[d.label] || 0); return "<div class='dc'><div class='l'>" + d.label + "</div><div class='v'>" + (c || 0) + "</div><div class='sub'>" + (c ? gbp(c * d.val) : "&nbsp;") + "</div></div>"; }).join("") + "</div>";

  // Notes and signature
  h += "<div class='grid' style='grid-template-columns:1fr 1fr 1fr;margin-top:6px'>"
    + [["Volunteers", s.volunteers], ["To buy", s.toBuy], ["Notes", s.notes]].map(([l, v]) => "<div class='box'><div class='l'>" + l + "</div><div style='white-space:pre-wrap'>" + dash(v) + "</div></div>").join("") + "</div>";
  h += "<div class='grid' style='grid-template-columns:2fr 1fr'><div class='box'><div class='l'>Rota Lead signature — " + dash(s.rotaLead) + "</div><div style='height:36px'>" + sig + "</div></div>"
    + "<div class='box'><div class='l'>Printed</div><div class='v'>" + new Date().toLocaleString("en-GB", { day:"numeric", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit" }) + "</div></div></div>";

  // Shrink to one A4 page (277mm of printable height at 96dpi ≈ 1046px)
  h += "<button class='noprint' onclick='window.print()' style='position:fixed;bottom:16px;right:16px;background:#3730a3;color:#fff;border:0;padding:8px 20px;border-radius:8px;font-size:12px;font-weight:bold;cursor:pointer'>Print / Save as PDF</button>"
    + "<script>window.onload=function(){var h=document.body.scrollHeight,max=1040;if(h>max)document.body.style.zoom=(max/h).toFixed(3);setTimeout(function(){window.print();},300);};<\/script>"
    + "</body></html>";

  const w = window.open("", "_blank");
  if (!w) return false;
  w.document.write(h); w.document.close();
  return true;
}

function RotaSheetTab({ rotaSheets, upRotaSheets, members, registers, upRegs, regEntries, upRegEntries, rotas, config, allSlots, showToast, sevas, sponsorships, inventory, cashInHand, upCashInHand, isAdmin, priests=[], prasadham=[], currentUser=null }) {
  const [view, setView]   = useState("list");
  const [editId, setEditId] = useState(null);
  const isPhone = useIsPhone();
  const [adminFullForm, setAdminFullForm] = useState(false);

  const archanaiReg = registers.find(r => r.name.toLowerCase().includes("archanai")) || registers[0];
  const donationReg = registers.find(r => r.name.toLowerCase().includes("donation"));
  const expenseReg  = registers.find(r => r.name.toLowerCase().includes("expense"));

  // The most recently CLOSED sheet, sorted by date descending
  const prevClosed = () => {
    const closed = rotaSheets.filter(s => s.status === "closed");
    if (!closed.length) return null;
    return [...closed].sort((a,b) => new Date(b.date) - new Date(a.date))[0];
  };

  // Build a blank new sheet with all carry-forward values from the previous closed sheet
  const blankSheet = () => {
    const prev  = prevClosed();
    const _t=new Date(); const todayStr=_t.getFullYear()+"-"+String(_t.getMonth()+1).padStart(2,"0")+"-"+String(_t.getDate()).padStart(2,"0");
    const now   = new Date().toTimeString().slice(0,5);

    // ── Find the next upcoming slot: skip only CLOSED sheets, not open ones ──
    // (open sheets may be for a different date; we want the soonest uncovered slot)
    const closedDates = new Set(rotaSheets.filter(s=>s.status==="closed").map(s=>s.date));
    const toDateStr = d => {
      const dt = d instanceof Date ? d : new Date(d);
      return dt.getFullYear() + "-" + String(dt.getMonth()+1).padStart(2,"0") + "-" + String(dt.getDate()).padStart(2,"0");
    };
    // Find the next slot on or after today that has no closed sheet
    const nextSlot = allSlots.find(sl => {
      const ds = toDateStr(sl.date);
      return ds >= todayStr && !closedDates.has(ds);
    });
    const slotDate = nextSlot ? toDateStr(nextSlot.date) : todayStr;
    // Always read rota assignment from the calendar for the chosen date
    const rotaData = nextSlot ? (rotas[nextSlot.key]||{}) : {};

    // ── Rota Lead name from calendar ──────────────────────────────────────────
    const leadMember  = rotaData.lead ? members.find(m=>m.id===rotaData.lead) : null;
    const leadName    = leadMember ? leadMember.name : "";

    // ── Rota Support: first secondary member ─────────────────────────────────
    const firstSecId  = (rotaData.secondary||[])[0];
    const suppMember  = firstSecId ? members.find(m=>m.id===firstSecId) : null;
    const supportName = suppMember ? suppMember.name : "";

    // ── Sponsors for this slot date ───────────────────────────────────────────
    var sponsorParts = [];
    (sponsorships||[]).forEach(function(area) {
      (area.donations||[]).forEach(function(don) {
        if ((don.rotaDates||[]).indexOf(slotDate) !== -1) {
          sponsorParts.push(don.donor ? don.donor + " (" + area.name + ")" : area.name);
        }
      });
    });
    const sponsorsText = sponsorParts.join(", ");

    // ── Opening Balance ───────────────────────────────────────────────────────
    const cashInHandTotal = DENOMS.reduce(function(d2, d) {
      return d2 + parseFloat(cashInHand[d.label] || 0) * d.val;
    }, 0).toFixed(2);
    const prevClosing = prev ? (prev.closingBalance || "") : "";
    const openingBalance = prevClosing !== "" ? prevClosing : (cashInHandTotal !== "0.00" ? cashInHandTotal : "");

    // ── Register start numbers ────────────────────────────────────────────────
    // Priority: register.latestNum > 0  →  prev sheet close  →  0 / blank

    // Archanai
    const archPrefix   = archanaiReg ? (archanaiReg.prefix || "A") : "A";
    const archLatest   = archanaiReg && (archanaiReg.latestNum||0) > 0 ? archanaiReg.latestNum : null;
    const archStartNum = archLatest !== null ? archLatest
      : prev ? (parseInt((prev.archanaClose || (prev.archanaTickets&&prev.archanaTickets.end) || "0").replace(/\D/g,""))||0) : 0;
    const archStart    = fmtRegNum(archPrefix, archStartNum);
    const archFirstNum = archStartNum + 1;

    // Donation
    const donPrefix    = donationReg ? (donationReg.prefix || "D") : "D";
    const donLatest    = donationReg && (donationReg.latestNum||0) > 0 ? donationReg.latestNum : null;
    const donStartNum  = donLatest !== null ? donLatest
      : prev ? (parseInt((prev.donationClose || (prev.donationBook&&prev.donationBook.end) || "0").replace(/\D/g,""))||0) : 0;
    const donStart     = fmtRegNum(donPrefix, donStartNum);   // always show, even if 0
    const donFirstNum  = donStartNum + 1;

    // Expense
    const expPrefix    = expenseReg ? (expenseReg.prefix || "E") : "E";
    const expLatest    = expenseReg && (expenseReg.latestNum||0) > 0 ? expenseReg.latestNum : null;
    const expStartNum  = expLatest !== null ? expLatest
      : prev ? (parseInt((prev.expenseClose || (prev.expenseVouchers&&prev.expenseVouchers.end) || "0").replace(/\D/g,""))||0) : 0;
    const expStart     = fmtRegNum(expPrefix, expStartNum);   // always show
    const expFirstNum  = expStartNum + 1;

    return {
      id: uid(),
      createdBy: currentUser ? currentUser.name : "Admin",
      createdById: currentUser ? currentUser.memberId : null,
      date: slotDate,
      openingTime: now,
      closingTime: "",
      rotaLead:    leadName,
      rotaSupport: supportName,
      treasury:    leadName,
      priest: (function(){
        var pid = rotaData.priestId;
        if (!pid) { var def = priests.find(function(p){return p.isDefault;}); pid = def ? def.id : (priests[0]||{}).id; }
        var pr = priests.find(function(p){return p.id===pid;});
        return pr ? pr.name : "";
      })(),
      prasadhamProvider: (function(){
        var pid = rotaData.prasadhamId;
        var pv = pid ? prasadham.find(function(p){return p.id===pid;}) : null;
        return pv ? pv.name : "";
      })(),
      sponsors: sponsorsText,
      poojastuff: (function(){
        var keywords = ["pooja", "prasad", "prasadham", "items"];
        var matchedDonors = [];
        (sponsorships||[]).forEach(function(area){
          if (!area.name) return;
          var aname = area.name.toLowerCase();
          var matched = keywords.some(function(k){ return aname.indexOf(k) !== -1; });
          if (!matched) return;
          (area.donations||[]).forEach(function(don){
            if ((don.rotaDates||[]).indexOf(slotDate) !== -1 && don.donor) {
              matchedDonors.push(don.donor);
            }
          });
        });
        return matchedDonors.join(", ");
      })(),
      openingBalance: openingBalance,
      donationBook: {
        start: donStart, end: donStart, count: 0, amount: "",
        cashAmount: "0.00", sumupAmount: "0.00", onlineAmount: "0.00",
        payType: "cash", firstNum: donFirstNum,
      },
      archanaTickets: {
        start: archStart, end: archStart, count: 0, amount: "0.00",
        ticketCount: 0, firstNum: archFirstNum, dayType: "normal", payType: "cash",
        cashAmount: "0.00", sumupAmount: "0.00", onlineAmount: "0.00",
      },
      expenseVouchers: {
        start: expStart, end: expStart, count: 0, amount: "",
        cashAmount: "0.00", onlineAmount: "0.00",
        payType: "cash", firstNum: expFirstNum,
      },
      hundi:  { amount: "" },
      sumup:  { amount: "" },
      online: { amount: "" },
      volunteers: "",
      toBuy: "",
      denoms: Object.fromEntries(DENOMS.map(function(d) {
        // Priority: prev denomClose → cashInHand register → blank
        var cnt = "";
        if (prev && prev.denomClose && prev.denomClose[d.label] !== undefined && prev.denomClose[d.label] !== "") {
          cnt = prev.denomClose[d.label];
        } else if (cashInHand && cashInHand[d.label] !== undefined && cashInHand[d.label] !== "") {
          cnt = cashInHand[d.label];
        }
        const amt = cnt !== "" ? (parseFloat(cnt||0) * d.val).toFixed(2) : "";
        return [d.label, { count: cnt, amount: amt }];
      })),
      closingBalance: "",
      archanaClose:   "",
      donationClose:  "",
      expenseClose:   "",
      checklist: Object.fromEntries(CHECKLIST.map(function(c) { return [c, false]; })),
      notes: "",
      headCount: "",
      rotaLeadSig: "",
      status: "open",
    };
  };

  const openNew = () => {
    const s = blankSheet();
    upRotaSheets([...rotaSheets, s]);
    setEditId(s.id);
    setView("edit");
    showToast("New Rota Sheet created");
  };

  const openEdit = id => { setEditId(id); setView("edit"); };
  const backToList = () => { setView("list"); setEditId(null); };

  const currentSheet = rotaSheets.find(s => s.id === editId);
  const upSheet = (updated) => {
    upRotaSheets(rotaSheets.map(s => s.id === updated.id ? updated : s));
  };

  // ── List view ──
  if (view === "list") {
    const sorted = [...rotaSheets].sort((a,b) => new Date(b.date)-new Date(a.date));
    return (
      <div className="space-y-4 fade-in">
        <div className="flex items-center justify-between gap-3 flex-wrap">
          <div>

            ＋ New Rota Sheet
          </button>
        </div>

        {sorted.length === 0 ? (
          <div className="bg-white rounded-2xl border border-slate-200 p-16 text-center text-slate-400 shadow-sm">
            <div className="text-6xl mb-4">📋</div>

            <p className="text-sm mt-1 mb-5">Click "New Rota Sheet" to create the first one</p>
            <button onClick={openNew} className="bg-indigo-600 text-white px-6 py-2.5 rounded-xl font-bold text-sm hover:bg-indigo-700">
              ＋ New Rota Sheet
            </button>
          </div>
        ) : (
          <div className="space-y-2">
            {sorted.map(s=>(
              <div key={s.id} className="bg-white border border-slate-200 rounded-2xl px-4 md:px-5 py-4 shadow-sm flex flex-wrap md:flex-nowrap items-center gap-3 md:gap-4 hover:shadow transition-shadow cursor-pointer" onClick={()=>openEdit(s.id)}>
                <div className={`w-10 h-10 md:w-12 md:h-12 rounded-xl flex items-center justify-center text-xl flex-shrink-0 ${s.status==="closed"?"bg-emerald-100":"bg-amber-100"}`}>
                  {s.status==="closed"?"✅":"📝"}
                </div>
                <div className="flex-1 min-w-0">
                  <div className="font-bold text-slate-800">{new Date(s.date).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"})}</div>
                  <div className="text-xs text-slate-400 mt-0.5">
                    <div>Lead: {s.rotaLead||"—"}</div>
                    <div>Opening: {s.openingTime||"—"} · Closing: {s.closingTime||"—"}</div>
                    {s.createdBy && <div className="text-slate-300">Created by {s.createdBy}</div>}
                  </div>
                  {s.status==="closed" && (
                    <div className="flex gap-3 mt-1.5 flex-wrap">
                      <span className="text-xs bg-emerald-50 text-emerald-700 border border-emerald-200 px-2 py-0.5 rounded-full font-semibold">💰 Closing Balance: £{s.closingBalance||"—"}</span>
                      {s.archanaClose && <span className="text-xs bg-violet-50 text-violet-700 border border-violet-200 px-2 py-0.5 rounded-full">🎟 Archana last: {s.archanaClose}</span>}
                      {s.donationClose && <span className="text-xs bg-blue-50 text-blue-700 border border-blue-200 px-2 py-0.5 rounded-full">📖 Donation last: {s.donationClose}</span>}
                      {s.expenseClose && <span className="text-xs bg-amber-50 text-amber-700 border border-amber-200 px-2 py-0.5 rounded-full">🧾 Expense last: {s.expenseClose}</span>}
                    </div>
                  )}
                </div>
                <div className="flex items-center justify-end gap-2 flex-shrink-0 w-full md:w-auto">
                  <span className={`text-xs font-bold px-3 py-1 rounded-full ${s.status==="closed"?"bg-emerald-100 text-emerald-700":"bg-amber-100 text-amber-700"}`}>
                    {s.status==="closed"?"Closed":"Open"}
                  </span>
                  {s.status==="closed" && (
                    <button onClick={e=>{e.stopPropagation();printRotaSheet(s, { config, rotaSheets, sponsorships });}}
                      className="text-xs bg-indigo-50 border border-indigo-200 text-indigo-600 px-2.5 py-1.5 rounded-lg hover:bg-indigo-100 font-medium">🖨 Print</button>
                  )}
                  {(isAdmin || (currentUser && currentUser.memberId && s.createdById === currentUser.memberId || s.rotaLead === currentUser.name)) && (
                    <button onClick={e=>{e.stopPropagation();if(confirm("Delete this sheet?"))upRotaSheets(rotaSheets.filter(x=>x.id!==s.id));}}
                      className="text-xs bg-red-50 border border-red-200 text-red-400 px-2.5 py-1.5 rounded-lg hover:bg-red-100 font-medium">Delete</button>
                  )}
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    );
  }

  // ── Edit / Form view ──
  if (!currentSheet) return <div className="text-slate-400 p-8 text-center">Sheet not found.</div>;
  // Rota Leads always get the mobile sheet; admins get it on a phone unless they ask for the full form
  if (!isAdmin || (isPhone && !adminFullForm)) return <RotaSheetMobile sevas={sevas||[]} sheet={currentSheet} upSheet={upSheet} onBack={backToList} archanaiReg={archanaiReg} donationReg={donationReg} expenseReg={expenseReg} upRegs={upRegs} registers={registers} showToast={showToast} cashInHand={cashInHand||{}} upCashInHand={upCashInHand} isAdmin={isAdmin}
    onFullForm={isAdmin ? () => setAdminFullForm(true) : null}/>;
  return <RotaSheetForm rotaSheets={rotaSheets} onPhoneView={isPhone ? () => setAdminFullForm(false) : null} sheet={currentSheet} upSheet={upSheet} onBack={backToList} members={members} registers={registers} upRegs={upRegs} archanaiReg={archanaiReg} donationReg={donationReg} expenseReg={expenseReg} regEntries={regEntries} upRegEntries={upRegEntries} config={config} showToast={showToast} sevas={sevas||[]} sponsorships={sponsorships||[]} inventory={inventory||[]} cashInHand={cashInHand||{}} upCashInHand={upCashInHand} isAdmin={isAdmin}/>;
}


// True on phone-sized screens (narrower than Tailwind's md breakpoint)
function useIsPhone() {
  const query = "(max-width: 767px)";
  const [isPhone, setIsPhone] = useState(() => window.matchMedia(query).matches);
  useEffect(() => {
    const mq = window.matchMedia(query);
    const on = e => setIsPhone(e.matches);
    mq.addEventListener ? mq.addEventListener("change", on) : mq.addListener(on);
    return () => mq.removeEventListener ? mq.removeEventListener("change", on) : mq.removeListener(on);
  }, []);
  return isPhone;
}
