// ─── Rota Sheet orders ───────────────────────────────────────────────────────
// Money is taken one order at a time: choose Cash / Card / Online, add tickets or
// entries, then "Payment taken". orderPay/orderCount describe the open order;
// its payment type can't change once something has been added to it.
const PAY_FIELD = { cash:"cashAmount", sumup:"sumupAmount", online:"onlineAmount" };
const PAY_LABEL = { cash:"💵 Cash", sumup:"💳 Card", online:"🌐 Online" };
// Money fields after adding (dir 1) or removing (dir -1) one item at `price` in the open order
function orderMoney(r, price, dir) {
  const f = PAY_FIELD[r.orderPay];
  const next = { ...r, [f]: Math.max(0, parseFloat(r[f]||0) + dir*price).toFixed(2) };
  return { [f]: next[f], payType: r.orderPay, orderCount: Math.max(0, (r.orderCount||0) + dir),
    amount: Object.values(PAY_FIELD).reduce((t,k)=>t+parseFloat(next[k]||0), 0).toFixed(2) };
}
const NO_ORDER = { orderPay:"", orderCount:0 };
// Donations also clear the amount and donor once paid, ready for the next donor
const NO_DONATION = { ...NO_ORDER, perAmount:"", orderName:"", orderContact:"", orderServiceId:"", orderServiceName:"", orderServiceCharge:"", orderDate:"" };
// Admin correction: empty a register on an open sheet and start its numbering again
const resetRegister = (r, clear) => ({ ...r, count:0, ticketCount:0, end:r.start, amount:"0.00",
  cashAmount:"0.00", sumupAmount:"0.00", onlineAmount:"0.00", donors:[], payees:[], ...clear });
// The next receipt number a register will issue
const nextRegNum = (r, prefix, count) => fmtRegNum(prefix, ((r||{}).firstNum || parseInt(((r||{}).start||"").replace(/\D/g,"")) + 1 || 1) + (parseInt(count)||0));
// Donation record: what it was for (General or a service) and the date it's for
const addDonation = (db, no, sheetDate) => addDonor(db, no)
  .map((p, i, all) => i === all.length-1 ? { ...p, purpose: db.orderServiceName || "General", serviceId: db.orderServiceId || "", date: db.orderDate || sheetDate } : p);
// Donors who paid for a service to be done on `date`, from every Rota Sheet's donation book
const servicePaidOn = (sheets, date) => (sheets||[]).flatMap(sh => (sh.donationBook||{}).donors||[])
  .filter(d => d.serviceId && d.date === date)
  .map(d => ({ id: d.no+d.at, donor: d.name, area: d.purpose+" · service paid" }));
// An email address, or a phone number with at least 7 digits
const validContact = c => /^\S+@\S+\.\S+$/.test((c||"").trim()) || (c||"").replace(/\D/g,"").length >= 7;
// Donations and expenses can only be taken once they have an amount above £0, a name and a contact
const partyReady = r => parseFloat((r||{}).perAmount||0) > 0 && !!((r||{}).orderName||"").trim() && validContact((r||{}).orderContact)
  && parseFloat((r||{}).perAmount||0) >= parseFloat((r||{}).orderServiceCharge||0);
const donationReady = partyReady;
// Expenses also clear the receiver's signature once paid
const NO_EXPENSE = { ...NO_DONATION, orderSig:"", orderPurpose:"", orderDate:"" };
// Expenses also need what it was for and when it was spent
const expenseReady = ev => partyReady(ev) && !!((ev||{}).orderPurpose||"").trim() && !!(ev||{}).orderDate;
// Voucher record: payee, contact, amount and payment, plus purpose and date
const addPayee = (ev, no) => addDonor({ ...ev, donors: ev.payees }, no)
  .map((p, i, all) => i === all.length-1 ? { ...p, purpose: (ev.orderPurpose||"").trim(), date: ev.orderDate } : p);
// "Payment taken" on an expense: the receiver's signature goes on every voucher in the order
const takeExpense = ev => ({ ...ev, payees: (ev.payees||[]).map((p,i,all) => i >= all.length-(ev.orderCount||0) ? { ...p, sig: ev.orderSig } : p), ...NO_EXPENSE });

// Finger or mouse signature box; onChange gets a PNG data URL ("" when cleared)
function SignaturePad({ value, onChange, disabled }) {
  const ref = React.useRef(null);
  const last = React.useRef(null);
  React.useEffect(() => {
    const c = ref.current; if (!c) return;
    const ctx = c.getContext("2d"); ctx.clearRect(0, 0, c.width, c.height);
    if (value) { const img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0); img.src = value; }
  }, [value]);
  const at = e => { const c = ref.current, r = c.getBoundingClientRect(); return [(e.clientX-r.left)*c.width/r.width, (e.clientY-r.top)*c.height/r.height]; };
  const down = e => { if (disabled) return; e.preventDefault(); ref.current.setPointerCapture(e.pointerId); last.current = at(e); };
  const move = e => {
    if (!last.current) return; e.preventDefault();
    const ctx = ref.current.getContext("2d"), p = at(e);
    ctx.beginPath(); ctx.moveTo(last.current[0], last.current[1]); ctx.lineTo(p[0], p[1]);
    ctx.strokeStyle = "#1e3a8a"; ctx.lineWidth = 3; ctx.lineCap = "round"; ctx.stroke();
    last.current = p;
  };
  const up = () => { if (!last.current) return; last.current = null; onChange(ref.current.toDataURL()); };
  return (
    <div>
      <div className={"border-2 border-dashed rounded-xl overflow-hidden "+(value?"border-emerald-300 bg-white":"border-slate-300 bg-slate-50")} style={{height:"90px"}}>
        <canvas ref={ref} width="600" height="180" style={{width:"100%",height:"100%",touchAction:"none",display:"block"}}
          onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={up}/>
      </div>
      {!disabled && value && <button onClick={()=>onChange("")} className="text-xs text-slate-400 underline mt-1">Clear signature</button>}
    </div>
  );
}

        </div>
      )}
      {minAmt > 0 && !open && (
        <div className={"px-4 pb-2 -mt-1 text-xs "+(belowMin?"text-red-600 font-semibold":"text-slate-400")}>Minimum £{minAmt.toFixed(2)} for this service</div>
      )}
      {donor && (
        <div className="px-4 pb-2 space-y-1.5">
          <input value={donor.name||""} onChange={function(e){onDonor("orderName",e.target.value);}} disabled={isClosed||open}
            placeholder={nameLabel} className="w-full border border-slate-200 rounded-lg px-2 py-1.5 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-emerald-300 disabled:bg-slate-100"/>
          <input value={donor.contact||""} onChange={function(e){onDonor("orderContact",e.target.value);}} disabled={isClosed||open}
            placeholder="Email or phone *" inputMode="email" className={"w-full border rounded-lg px-2 py-1.5 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-emerald-300 disabled:bg-slate-100 "+(donor.contact&&!validContact(donor.contact)?"border-red-300":"border-slate-200")}/>
          {props.donationDate !== undefined && (
            <label className="flex items-center gap-2">
              <span className="text-xs text-slate-500 whitespace-nowrap flex-shrink-0">{props.serviceId ? "Service date *" : "Date *"}</span>
              <input type="date" value={props.donationDate} onChange={function(e){onDonor("orderDate",e.target.value);}} disabled={isClosed||open}
                className="flex-1 min-w-0 border border-slate-200 rounded-lg px-2 py-1.5 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-emerald-300 disabled:bg-slate-100"/>
            </label>
          )}
          {expense && (
            <>
              <input value={expense.purpose||""} onChange={function(e){onDonor("orderPurpose",e.target.value);}} disabled={isClosed||open}
                placeholder="What was it for? *" className="w-full border border-slate-200 rounded-lg px-2 py-1.5 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-amber-300 disabled:bg-slate-100"/>
              <label className="flex items-center gap-2">
                <span className="text-xs text-slate-500 whitespace-nowrap flex-shrink-0">Date of expense *</span>
                <input type="date" value={expense.date||""} max={new Date().toISOString().slice(0,10)} onChange={function(e){onDonor("orderDate",e.target.value);}} disabled={isClosed||open}
                  className="flex-1 min-w-0 border border-slate-200 rounded-lg px-2 py-1.5 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-amber-300 disabled:bg-slate-100"/>
              </label>
            </>
          )}
        </div>
      )}
      {/* 1. Payment type for this order — locked once something is added */}
      <div className="px-4 pb-1 text-xs font-semibold text-slate-500">{open ? "This order is paying by" : !ready ? (expense ? "Fill in all the details above first" : "Enter the amount, name and email or phone first") : "1. How are they paying?"}</div>
      <div className="px-4 pb-3 flex gap-1.5">
        {PAY.map(function(p){var on=orderPay===p; return (
          <button key={p} onClick={function(){onPayType&&onPayType(p);}} disabled={isClosed||(open&&!on)||!ready}
            className={"flex-1 py-2 rounded-lg text-sm font-semibold border transition-colors disabled:opacity-40 "+(on?c.badge+" text-white border-transparent":"border-slate-200 text-slate-600 bg-white hover:bg-slate-50")}>
            {PAY_LABEL[p]}
          </button>
        );})}
      </div>
      {/* 2. +/- for this order */}
      <div className="px-4 pb-3 flex items-center gap-3">
        <button onClick={onDecr} disabled={isClosed||!open}
          className="w-12 h-12 rounded-xl bg-red-100 text-red-600 text-2xl font-black flex items-center justify-center disabled:opacity-30 active:scale-95 transition-transform">−</button>
        <div className="flex-1 text-center">
          <div className={"text-3xl font-black "+c.text}>{orderCount}</div>
          <div className="text-xs text-slate-400">{!ready ? "details needed" : orderPay ? "in this order"+(open?" · £"+(orderCount*priceNow).toFixed(2):"") : "choose payment first"}</div>
        </div>
        <button onClick={onIncr} disabled={isClosed||!orderPay||!ready}
          className={"w-12 h-12 rounded-xl text-white text-2xl font-black flex items-center justify-center disabled:opacity-30 active:scale-95 transition-transform "+c.badge}>+</button>
      </div>
      {/* 3. Payment taken → ready for the next order */}
      {open && !isClosed && needSig && (
        <div className="px-4 pb-2">
          <div className="text-xs font-semibold text-slate-500 mb-1">✍️ Receiver's signature *</div>
          <SignaturePad value={sig} onChange={onSig}/>
        </div>
      )}
      {open && !isClosed && (
        <div className="px-4 pb-3">
          <button onClick={onTaken} disabled={needSig && !sig}
            className="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm active:scale-[0.98] transition-transform disabled:opacity-40">
            {needSig && !sig ? "Receiver signs above first" : needSig ? "✓ Paid — next expense" : "✓ Payment taken — next order"}
          </button>
        </div>
      )}
      <div className="px-4 pb-2 text-xs text-slate-500 flex items-center gap-2">
        <span>Today so far: <b>{count}</b></span>
        {props.onReset && !isClosed && (count > 0 || parseFloat(total) > 0) && (
          <span className="ml-auto"><TypedConfirm word="RESET" label="Reset…" onConfirm={props.onReset}
            warning={"Removes every "+label.toLowerCase()+" entry on this sheet and sets the total back to £0. Use only to clear mistakes."}
            className="text-xs text-red-500 underline"/></span>
        )}
      </div>
      <div className="flex-1"/>
      {(props.donors||[]).length > 0 && (
        <div className="px-4 pb-2 space-y-0.5">
          {props.donors.map(function(d){return (
            <div key={d.no} className="text-xs text-slate-600 flex items-center gap-2"><span className="font-mono text-slate-400">{d.no}</span><span className="flex-1 truncate">{d.name}{d.purpose && <span className="text-slate-400"> · {d.purpose}{d.date ? " · "+new Date(d.date).toLocaleDateString("en-GB",{day:"numeric",month:"short"}) : ""}</span>}</span><span className="font-semibold">£{d.amount}</span><span>{(PAY_LABEL[d.pay]||"").split(" ")[0]}</span>{d.sig && <img src={d.sig} alt="signed" className="h-5 border border-slate-200 rounded bg-white"/>}</div>
          );})}
        </div>
      )}
      {/* Totals by payment */}
      {count > 0 && (
        <div className="px-4 pb-3 grid grid-cols-3 gap-1.5">
          <div className="bg-white rounded-lg p-1.5 text-center border border-slate-100">
            <div className="text-xs text-slate-400">💵 Cash</div>
            <div className="text-sm font-bold text-slate-700">£{cash}</div>
          </div>
          <div className="bg-white rounded-lg p-1.5 text-center border border-slate-100">
            <div className="text-xs text-slate-400">💳 Card</div>
            <div className="text-sm font-bold text-slate-700">£{sumup}</div>
          </div>
          <div className="bg-white rounded-lg p-1.5 text-center border border-slate-100">
            <div className="text-xs text-slate-400">🌐 Online</div>
            <div className="text-sm font-bold text-slate-700">£{online}</div>
          </div>
        </div>
      )}
    </div>
  );
}

function RotaSheetMobile({ sheet, upSheet, onBack, archanaiReg, donationReg, expenseReg, upRegs, registers, showToast, cashInHand, upCashInHand, isAdmin, onFullForm, sevas=[] }) {
  const [s, setS] = React.useState(sheet);
  const isClosed = s.status === "closed";

  const up = function(patch) {
    var updated = Object.assign({}, s, patch);
    setS(updated); upSheet(updated);
  };

  // ── Reconciliation helpers (same as RotaSheetForm) ────────────────────────
  var denomTotal = function() {
    return DENOMS.reduce(function(sum,d){
      return sum + parseFloat((s.denoms&&s.denoms[d.label]&&s.denoms[d.label].count)?s.denoms[d.label].count:0) * d.val;
    }, 0);
  };
  var calcExpected = function() {
    var ob  = parseFloat(s.openingBalance||0);
    var arc = parseFloat((s.archanaTickets&&s.archanaTickets.cashAmount)||0);
    var don = parseFloat((s.donationBook&&s.donationBook.cashAmount)||0);
    var hun = parseFloat((s.hundi&&s.hundi.amount)||0);
    var exp = parseFloat((s.expenseVouchers&&s.expenseVouchers.cashAmount)||0);
    return (ob + arc + don + hun - exp).toFixed(2);
  };

  // ── Archana counter ───────────────────────────────────────────────────────
  var issueArch = function() {
    if (isClosed) return;
    var at = s.archanaTickets||{};
    if (!at.orderPay) return showToast("Choose Cash, Card or Online first","error");
    var price = (at.dayType==="special") ? 5.00 : 3.00;
    var prefix = archanaiReg ? (archanaiReg.prefix||"A") : "A";
    var firstNum = at.firstNum || parseInt((at.start||"").replace(/\D/g,"")+1)||1;
    var newCnt = (parseInt(at.ticketCount||0))+1;
    var newEnd = fmtRegNum(prefix, firstNum+newCnt-1);
    up({archanaTickets:{...at,ticketCount:newCnt,count:newCnt,end:newEnd,firstNum,...orderMoney(at,price,1)}});
    showToast("Issued "+newEnd+" · £"+price.toFixed(2)+" "+PAY_LABEL[at.orderPay]);
  };
  var undoArch = function() {
    if (isClosed) return;
    var at = s.archanaTickets||{};
    if (!(at.orderCount>0)) return showToast("Only tickets in the current order can be taken off","error");
    var price = (at.dayType==="special") ? 5.00 : 3.00;
    var prefix = archanaiReg ? (archanaiReg.prefix||"A") : "A";
    var firstNum = at.firstNum || parseInt((at.start||"").replace(/\D/g,"")+1)||1;
    var newCnt = Math.max(0,(parseInt(at.ticketCount||0))-1);
    var newEnd = newCnt>0 ? fmtRegNum(prefix,firstNum+newCnt-1) : at.start;
    up({archanaTickets:{...at,ticketCount:newCnt,count:newCnt,end:newEnd,...orderMoney(at,price,-1)}});
    showToast("Undone");
  };

  // ── Donation counter ──────────────────────────────────────────────────────
  var incrDon = function() {
    if (isClosed) return;
    var db = s.donationBook||{};
    if (!donationReady(db)) return showToast(parseFloat(db.perAmount||0) < parseFloat(db.orderServiceCharge||0) ? "Amount can't be less than £"+db.orderServiceCharge+" for "+db.orderServiceName : "Enter the amount, donor name and email or phone first","error");
    if (!db.orderPay) return showToast("Choose Cash, Card or Online first","error");
    var prefix = donationReg ? (donationReg.prefix||"D") : "D";
    var firstNum = db.firstNum || parseInt((db.start||"").replace(/\D/g,"")+1)||1;
    var newCnt = (parseInt(db.count||0))+1;
    var newEnd = fmtRegNum(prefix,firstNum+newCnt-1);
    up({donationBook:{...db,count:newCnt,end:newEnd,firstNum,donors:addDonation(db,newEnd,s.date),...orderMoney(db,parseFloat(db.perAmount||0),1)}});
  };
  var decrDon = function() {
    if (isClosed) return;
    var db = s.donationBook||{};
    if (!(db.orderCount>0)) return showToast("Only entries in the current order can be taken off","error");
    var prefix = donationReg ? (donationReg.prefix||"D") : "D";
    var newCnt = Math.max(0,(parseInt(db.count||0))-1);
    var firstNum = db.firstNum || parseInt((db.start||"").replace(/\D/g,"")+1)||1;
    var newEnd = newCnt>0 ? fmtRegNum(prefix,firstNum+newCnt-1) : db.start;
    up({donationBook:{...db,count:newCnt,end:newEnd,donors:dropDonor(db,db.end),...orderMoney(db,parseFloat(db.perAmount||0),-1)}});
  };

  // ── Expense counter ───────────────────────────────────────────────────────
  var incrExp = function() {
    if (isClosed) return;
    var ev = s.expenseVouchers||{};
    if (!expenseReady(ev)) return showToast("Fill in amount, paid to, email or phone, what it was for and the date first","error");
    if (!ev.orderPay) return showToast("Choose Cash, Card or Online first","error");
    var prefix = expenseReg ? (expenseReg.prefix||"E") : "E";
    var firstNum = ev.firstNum || parseInt((ev.start||"").replace(/\D/g,"")+1)||1;
    var newCnt = (parseInt(ev.count||0))+1;
    var newEnd = fmtRegNum(prefix,firstNum+newCnt-1);
    up({expenseVouchers:{...ev,count:newCnt,end:newEnd,firstNum,payees:addPayee(ev,newEnd),...orderMoney(ev,parseFloat(ev.perAmount||0),1)}});
  };
  var decrExp = function() {
    if (isClosed) return;
    var ev = s.expenseVouchers||{};
    if (!(ev.orderCount>0)) return showToast("Only entries in the current order can be taken off","error");
    var prefix = expenseReg ? (expenseReg.prefix||"E") : "E";
    var newCnt = Math.max(0,(parseInt(ev.count||0))-1);
    var firstNum = ev.firstNum || parseInt((ev.start||"").replace(/\D/g,"")+1)||1;
    var newEnd = newCnt>0 ? fmtRegNum(prefix,firstNum+newCnt-1) : ev.start;
    up({expenseVouchers:{...ev,count:newCnt,end:newEnd,payees:dropDonor({donors:ev.payees},ev.end),...orderMoney(ev,parseFloat(ev.perAmount||0),-1)}});
  };

  // ── Close sheet ───────────────────────────────────────────────────────────
  var closeSheet = function() {
    if (!isAdmin) {
      var today = new Date();
      var parts = (s.date||"").split("-");
      var isRotaDay = parts.length===3 && today.getFullYear()===parseInt(parts[0]) && today.getMonth()+1===parseInt(parts[1]) && today.getDate()===parseInt(parts[2]);
      if (!isRotaDay) { showToast("Closing only allowed on the rota day ("+s.date+")","error"); return; }
    }
    var cb = denomTotal().toFixed(2);
    var expected = parseFloat(calcExpected());
    var counted  = parseFloat(cb);
    var archEnd = (s.archanaTickets&&s.archanaTickets.end) || (s.archanaTickets&&s.archanaTickets.start) || "";
    var donEnd  = (s.donationBook&&s.donationBook.end)    || (s.donationBook&&s.donationBook.start)    || "";
    var expEnd  = (s.expenseVouchers&&s.expenseVouchers.end) || (s.expenseVouchers&&s.expenseVouchers.start) || "";
    up({
      status:"closed", closingBalance:cb, closingTime:new Date().toTimeString().slice(0,5),
      archanaClose:archEnd, donationClose:donEnd, expenseClose:expEnd,
      denomClose:Object.fromEntries(DENOMS.map(function(d){return [d.label,(s.denoms&&s.denoms[d.label]&&s.denoms[d.label].count!==undefined)?s.denoms[d.label].count:""];})),
    });
    if (upCashInHand) upCashInHand(Object.fromEntries(DENOMS.map(function(d){return [d.label,(s.denoms&&s.denoms[d.label]&&s.denoms[d.label].count!==undefined)?s.denoms[d.label].count:""];})));
    if (upRegs&&registers) upRegs(registers.map(function(r){
      var isArch = archanaiReg&&r.id===archanaiReg.id;
      var isDon  = donationReg&&r.id===donationReg.id;
      var isExp  = expenseReg&&r.id===expenseReg.id;
      if (isArch&&archEnd) return {...r,latestNum:parseInt(archEnd.replace(/\D/g,""))||r.latestNum};
      if (isDon&&donEnd)   return {...r,latestNum:parseInt(donEnd.replace(/\D/g,""))||r.latestNum};
      if (isExp&&expEnd)   return {...r,latestNum:parseInt(expEnd.replace(/\D/g,""))||r.latestNum};
      return r;
    }));
    showToast("Sheet closed · Closing balance £"+cb);
  };

  var at  = s.archanaTickets||{};
  var db  = s.donationBook||{};
  var ev  = s.expenseVouchers||{};
  var expected = calcExpected();
  var counted  = denomTotal().toFixed(2);
  var mismatch = Math.abs(parseFloat(counted)-parseFloat(expected)) >= 0.01;

  return (
    <div className="space-y-4 pb-6">

      {/* Header */}
      <div className="bg-indigo-700 text-white rounded-2xl p-4 flex items-center justify-between">
        <div className="flex-1 min-w-0">
          <div className="font-bold text-lg">{new Date(s.date).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"})}</div>
          <div className="text-indigo-200 text-sm mt-0.5">🎯 {s.rotaLead||"—"} &nbsp;·&nbsp; 🟣 {s.rotaSupport||"—"}</div>
          {s.priest && <div className="text-indigo-200 text-xs mt-0.5">🔔 {s.priest}{s.prasadhamProvider?" · 🍛 "+s.prasadhamProvider:""}</div>}
          {s.sponsors && <div className="text-indigo-200 text-xs mt-0.5">🤝 {s.sponsors}</div>}
        </div>
        <div className="flex flex-col items-end gap-1.5 flex-shrink-0 ml-2">
          <span className={"text-xs font-bold px-2.5 py-1 rounded-full "+(isClosed?"bg-emerald-400 text-white":"bg-amber-400 text-white")}>{isClosed?"✅ Closed":"📝 Open"}</span>
          <button onClick={onBack} className="text-xs text-indigo-300 underline">← Back</button>
          {onFullForm && <button onClick={onFullForm} className="text-xs text-indigo-200 underline">Full form</button>}
        </div>
      </div>

      {/* Opening balance */}
      <div className="bg-white rounded-2xl border border-slate-200 p-4 flex items-center justify-between">
        <span className="font-semibold text-slate-700">Opening Balance</span>
        <span className="text-xl font-black text-slate-800">£{s.openingBalance||"0.00"}</span>
      </div>

      {/* Archana */}
      <SheetRegCard isClosed={isClosed}
        label="Archana Tickets" icon="🎟️" color="indigo"
        count={at.ticketCount||0} total={at.amount||"0.00"}
        orderPay={at.orderPay} orderCount={at.orderCount} price={at.dayType==="special"?5:3}
        nextNum={nextRegNum(at, archanaiReg ? (archanaiReg.prefix||"A") : "A", at.ticketCount)}
        startNum={at.start} endNum={at.end}
        cash={at.cashAmount||"0.00"} sumup={at.sumupAmount||"0.00"} online={at.onlineAmount||"0.00"}
        onIncr={issueArch} onDecr={undoArch}
        onPayType={function(p){up({archanaTickets:{...at,orderPay:p}});}}
        onTaken={function(){up({archanaTickets:{...at,...NO_ORDER}});}}
        onReset={isAdmin ? function(){up({archanaTickets:resetRegister(at,NO_ORDER)});} : null}
      />
      {/* Day type for archana */}
      <div className="flex gap-2">
        {[["normal","£3 Normal"],["special","£5 Special"]].map(function(pair){return (
          <button key={pair[0]} onClick={function(){up({archanaTickets:{...at,dayType:pair[0]}});}} disabled={isClosed||at.orderCount>0}
            className={"flex-1 py-2 rounded-xl text-sm font-semibold border transition-colors "+(at.dayType===pair[0]?"bg-indigo-600 text-white border-indigo-600":"bg-white border-slate-200 text-slate-600")}>
            {pair[1]}
          </button>
        );})}
      </div>

      {/* Donations */}
      <SheetRegCard isClosed={isClosed}
        label="Donations" icon="📖" color="emerald"
        count={parseInt(db.count||0)} total={db.amount||"0.00"}
        orderPay={db.orderPay} orderCount={db.orderCount} price={db.perAmount} perAmt={db.perAmount||""}
        nextNum={nextRegNum(db, donationReg ? (donationReg.prefix||"D") : "D", db.count)}
        services={sevas} serviceId={db.orderServiceId} serviceCharge={db.orderServiceCharge} donationDate={db.orderDate||s.date}
        onService={function(sv){up({donationBook:{...db,orderServiceId:sv?sv.id:"",orderServiceName:sv?sv.name:"",orderServiceCharge:sv?sv.charge:"",perAmount:sv?sv.charge:db.perAmount}});}}
        startNum={db.start} endNum={db.end}
        cash={db.cashAmount||"0.00"} sumup={db.sumupAmount||"0.00"} online={db.onlineAmount||"0.00"}
        onIncr={incrDon} onDecr={decrDon}
        onPayType={function(p){up({donationBook:{...db,orderPay:p}});}}
        onTaken={function(){up({donationBook:{...db,...NO_DONATION}});}}
        onReset={isAdmin ? function(){up({donationBook:resetRegister(db,NO_DONATION)});} : null}
        amtLabel="Amount £" donors={db.donors}
        donor={{name:db.orderName, contact:db.orderContact}}
        onDonor={function(f,v){up({donationBook:{...db,[f]:v}});}}
        onPerAmt={function(v){up({donationBook:{...db,perAmount:v}});}}
      />

      {/* Expenses */}
      <SheetRegCard isClosed={isClosed}
        label="Expenses" icon="🧾" color="amber"
        count={parseInt(ev.count||0)} total={ev.amount||"0.00"}
        orderPay={ev.orderPay} orderCount={ev.orderCount} price={ev.perAmount} perAmt={ev.perAmount||""}
        nextNum={nextRegNum(ev, expenseReg ? (expenseReg.prefix||"E") : "E", ev.count)}
        startNum={ev.start} endNum={ev.end}
        cash={ev.cashAmount||"0.00"} sumup={ev.sumupAmount||"0.00"} online={ev.onlineAmount||"0.00"}
        onIncr={incrExp} onDecr={decrExp}
        onPayType={function(p){up({expenseVouchers:{...ev,orderPay:p}});}}
        onTaken={function(){up({expenseVouchers:takeExpense(ev)});}}
        onReset={isAdmin ? function(){up({expenseVouchers:resetRegister(ev,NO_EXPENSE)});} : null}
        amtLabel="Amount £" nameLabel="Paid to (name or company) *" donors={ev.payees}
        donor={{name:ev.orderName, contact:ev.orderContact}}
        expense={{purpose:ev.orderPurpose, date:ev.orderDate}}
        onDonor={function(f,v){up({expenseVouchers:{...ev,[f]:v}});}}
        sig={ev.orderSig} onSig={function(v){up({expenseVouchers:{...ev,orderSig:v}});}}
        onPerAmt={function(v){up({expenseVouchers:{...ev,perAmount:v}});}}
      />

      {/* Hundi */}
      <div className="bg-white rounded-2xl border border-slate-200 p-4 flex items-center gap-3">
        <span className="font-semibold text-slate-700 flex-1">🪣 Hundi (cash)</span>
        <span className="text-slate-400">£</span>
        <input type="number" value={(s.hundi&&s.hundi.amount)||""} onChange={function(e){up({hundi:{amount:e.target.value}});}}
          placeholder="0.00" disabled={isClosed}
          className="w-24 border border-slate-200 rounded-xl px-3 py-2 text-right font-bold focus:outline-none focus:ring-2 focus:ring-indigo-300"/>
      </div>

      {/* Denomination table */}
      <div className="bg-white rounded-2xl border border-slate-200 p-4">
        <div className="flex items-center justify-between mb-3">
          <h3 className="font-bold text-slate-800">💷 Denomination Count</h3>
          <span className="text-xl font-black text-emerald-700">£{counted}</span>
        </div>
        <div className="grid grid-cols-5 gap-1.5">
          {DENOMS.map(function(d){
            var cnt = (s.denoms&&s.denoms[d.label]&&s.denoms[d.label].count!==undefined) ? s.denoms[d.label].count : "";
            return (
              <div key={d.label} className="text-center">
                <div className={"text-xs font-bold rounded px-1 py-0.5 mb-1 "+(d.pence?"bg-slate-100 text-slate-500":"bg-amber-50 text-amber-700 border border-amber-200")}>{d.label}</div>
                <input type="number" min="0" value={cnt} onChange={function(e){up({denoms:{...s.denoms,[d.label]:{...(s.denoms&&s.denoms[d.label]),count:e.target.value},...s.denoms}});}}
                  disabled={isClosed}
                  className="w-full border border-slate-200 rounded px-1 py-1.5 text-xs text-center focus:outline-none focus:ring-1 focus:ring-indigo-300"/>
                {cnt>0&&<div className="text-xs text-slate-400 mt-0.5">£{(parseFloat(cnt)*d.val).toFixed(parseFloat(cnt)*d.val>=1?0:2)}</div>}
              </div>
            );
          })}
        </div>
      </div>

      {/* Reconciliation — mismatch only */}
      {mismatch && (
        <div className="bg-red-50 border-2 border-red-300 rounded-2xl p-4">
          <div className="flex items-center gap-2 mb-2">
            <span className="text-xl">⚠️</span>
            <span className="font-bold text-red-700">Cash Mismatch</span>
          </div>
          <div className="grid grid-cols-2 gap-3 text-sm">
            <div className="bg-white rounded-xl p-3 text-center border border-red-200">
              <div className="text-xs text-slate-400">Expected</div>
              <div className="text-lg font-black text-slate-700">£{expected}</div>
            </div>
            <div className="bg-white rounded-xl p-3 text-center border border-red-200">
              <div className="text-xs text-slate-400">Counted</div>
              <div className="text-lg font-black text-red-600">£{counted}</div>
            </div>
          </div>
          <div className="mt-2 text-center text-sm font-bold text-red-600">
            Difference: £{Math.abs(parseFloat(counted)-parseFloat(expected)).toFixed(2)}
          </div>
        </div>
      )}
      {!mismatch && parseFloat(counted)>0 && (
        <div className="bg-emerald-50 border border-emerald-200 rounded-2xl p-3 flex items-center gap-2">
          <span className="text-xl">✅</span>
          <span className="font-semibold text-emerald-700">Cash tallied · £{counted}</span>
        </div>
      )}

      {/* ── Bottom fields ── */}
      <div className="bg-white rounded-2xl border border-slate-200 p-4 space-y-4">
        <h3 className="font-bold text-slate-800 text-sm uppercase tracking-wide">📋 Session Summary</h3>

        <div>
          <label className="text-xs font-semibold text-slate-500 block mb-1.5">🙋 Volunteers Present</label>
          <textarea value={s.volunteers||""} onChange={function(e){up({volunteers:e.target.value});}}
            rows={2} placeholder="Names of volunteers who attended today…" disabled={isClosed}
            className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 resize-none bg-white"/>
        </div>

        <div className="grid grid-cols-2 gap-3">
          <div>
            <label className="text-xs font-semibold text-slate-500 block mb-1.5">👥 Total Headcount</label>
            <input type="number" min="0" value={s.headcount||""} onChange={function(e){up({headcount:e.target.value});}}
              placeholder="0" disabled={isClosed}
              className="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-lg font-bold text-center focus:outline-none focus:ring-2 focus:ring-indigo-300"/>
          </div>
          <div>
            <label className="text-xs font-semibold text-slate-500 block mb-1.5">🛒 To Buy / Notes</label>
            <textarea value={s.toBuy||""} onChange={function(e){up({toBuy:e.target.value});}}
              rows={2} placeholder="Items needed…" disabled={isClosed}
              className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 resize-none bg-white"/>
          </div>
        </div>

        {/* Rota Lead Signature */}
        <div>
          <label className="text-xs font-semibold text-slate-500 block mb-2">✍️ Rota Lead Signature</label>
          <div className="border-2 border-dashed border-slate-300 rounded-xl bg-slate-50 overflow-hidden" style={{height:"90px"}}>
            <canvas id="sig-canvas" width="600" height="90" style={{width:"100%",height:"100%",touchAction:"none",display:"block"}}
              onPointerDown={function(e){
                var c=document.getElementById("sig-canvas");
                var ctx=c.getContext("2d");
                var rect=c.getBoundingClientRect();
                var scaleX=c.width/rect.width; var scaleY=c.height/rect.height;
                ctx.beginPath(); ctx.moveTo((e.clientX-rect.left)*scaleX,(e.clientY-rect.top)*scaleY);
                c._drawing=true; c._ctx=ctx; c._rect=rect; c._sx=scaleX; c._sy=scaleY;
                e.preventDefault();
              }}
              onPointerMove={function(e){
                var c=document.getElementById("sig-canvas");
                if(!c._drawing) return;
                var ctx=c._ctx;
                ctx.lineTo((e.clientX-c._rect.left)*c._sx,(e.clientY-c._rect.top)*c._sy);
                ctx.strokeStyle="#1e3a8a"; ctx.lineWidth=2; ctx.lineCap="round"; ctx.stroke();
                e.preventDefault();
              }}
              onPointerUp={function(e){
                var c=document.getElementById("sig-canvas");
                if(!c._drawing) return;
                c._drawing=false;
                up({signature:c.toDataURL()});
              }}/>
          </div>
          <button onClick={function(){
            var c=document.getElementById("sig-canvas");
            var ctx=c.getContext("2d"); ctx.clearRect(0,0,c.width,c.height);
            up({signature:""});
          }} className="text-xs text-slate-400 underline mt-1">Clear signature</button>
          {s.signature && isClosed && (
            <img src={s.signature} alt="Signature" className="mt-2 rounded border border-slate-200 max-h-16"/>
          )}
        </div>
      </div>

      {/* Close button */}
      {!isClosed && (
        <button onClick={closeSheet}
          className="w-full bg-emerald-600 hover:bg-emerald-700 text-white rounded-2xl py-4 font-black text-lg shadow-lg active:scale-95 transition-transform">
          🔒 Close Sheet
        </button>
      )}
      {isClosed && (
        <div className="bg-emerald-50 border border-emerald-200 rounded-2xl p-4 text-center">
          <div className="text-2xl mb-1">✅</div>
          <div className="font-bold text-emerald-800">Sheet Closed</div>
          <div className="text-sm text-emerald-600">Closing Balance: £{s.closingBalance}</div>
        </div>
      )}
    </div>
  );
}

function RotaSheetForm({ rotaSheets=[], onPhoneView, sheet, upSheet, onBack, members, registers, upRegs, archanaiReg, donationReg, expenseReg, regEntries, upRegEntries, config, showToast, sevas, sponsorships, inventory, cashInHand, upCashInHand, isAdmin }) {
  const [s, setS] = useState(sheet);

  const isClosed = s.status === "closed";

  // Keep local in sync if sheet changes externally
  const up = (patch) => {
    const updated = {...s, ...patch};
    setS(updated);
    upSheet(updated);
  };

  const upNested = (key, patch) => up({[key]: {...s[key], ...patch}});

  // ── Archana ticket helpers ──────────────────────────────────────────────────
  // dayType: "normal" = £3.00, "special" = £5.00 (stored on archanaTickets)
  // payType: "cash" | "sumup" | "online" (stored on archanaTickets)
  const archDayPrice = () => (s.archanaTickets?.dayType === "special") ? 5.00 : 3.00;

  const issueArchana = () => {
    if (s.status === "closed") return showToast("Sheet is closed", "error");
    const reg = archanaiReg;
    if (!reg) return showToast("No Archanai register configured", "error");
    const at       = s.archanaTickets;
    if (!at.orderPay) return showToast("Choose Cash, Card or Online first", "error");
    const firstNum = at.firstNum || parseInt((at.start||"").replace(/\D/g,"")) + 1 || 1;
    const newCount = (at.ticketCount || 0) + 1;
    const newEnd   = fmtRegNum(reg.prefix, firstNum + newCount - 1);
    const price    = archDayPrice();
    const payType  = at.orderPay;

    // Update sumup and online rows on the sheet too
    const newSumup  = { amount: (parseFloat(s.sumup?.amount||0)  + (payType==="sumup"  ? price : 0)).toFixed(2) };
    const newOnline = { amount: (parseFloat(s.online?.amount||0) + (payType==="online" ? price : 0)).toFixed(2) };

    up({
      archanaTickets: { ...at, ticketCount: newCount, count: newCount, end: newEnd, firstNum, ...orderMoney(at, price, 1) },
      sumup:  payType === "sumup"  ? newSumup  : s.sumup,
      online: payType === "online" ? newOnline : s.online,
    });
    showToast(`Issued ${newEnd} · £${price.toFixed(2)} ${PAY_LABEL[payType]}`);
  };

  const undoArchana = () => {
    if (s.status === "closed") return showToast("Sheet is closed", "error");
    const at = s.archanaTickets;
    if (!(at.orderCount > 0)) return showToast("Only tickets in the current order can be taken off", "error");
    const reg      = archanaiReg;
    if (!reg) return showToast("No Archanai register configured", "error");
    const firstNum = at.firstNum || parseInt((at.start||"").replace(/\D/g,"")) + 1 || 1;
    const newCount = (at.ticketCount||0) - 1;
    const newEnd   = newCount > 0 ? fmtRegNum(reg.prefix, firstNum + newCount - 1) : at.start;
    const price    = archDayPrice();
    const payType  = at.orderPay;

    const newSumup  = { amount: Math.max(0, parseFloat(s.sumup?.amount||0)  - (payType==="sumup"  ? price : 0)).toFixed(2) };
    const newOnline = { amount: Math.max(0, parseFloat(s.online?.amount||0) - (payType==="online" ? price : 0)).toFixed(2) };

    up({
      archanaTickets: { ...at, ticketCount: newCount, count: newCount, end: newEnd, ...orderMoney(at, price, -1) },
      sumup:  payType === "sumup"  ? newSumup  : s.sumup,
      online: payType === "online" ? newOnline : s.online,
    });
    showToast("Last ticket undone");
  };

  // ── Donation Book counter ────────────────────────────────────────────────────
  const incrDonation = () => {
    if (s.status === "closed") return;
    const db       = s.donationBook;
    if (!donationReady(db)) return showToast(parseFloat(db.perAmount||0) < parseFloat(db.orderServiceCharge||0) ? "Amount can't be less than £"+db.orderServiceCharge+" for "+db.orderServiceName : "Enter the amount, donor name and email or phone first", "error");
    if (!db.orderPay) return showToast("Choose Cash, Card or Online first", "error");
    const prefix   = donationReg ? (donationReg.prefix || "D") : "D";
    const firstNum = db.firstNum || parseInt((db.start||"").replace(/\D/g,"")) + 1 || 1;
    const newCnt   = (parseInt(db.count||0)) + 1;
    const newEnd   = fmtRegNum(prefix, firstNum + newCnt - 1);
    up({ donationBook: { ...db, count: newCnt, end: newEnd, firstNum, donors: addDonation(db, newEnd, s.date), ...orderMoney(db, parseFloat(db.perAmount||0), 1) } });
  };
  const decrDonation = () => {
    if (s.status === "closed") return;
    const db       = s.donationBook;
    if (!(db.orderCount > 0)) return showToast("Only entries in the current order can be taken off", "error");
    const prefix   = donationReg ? (donationReg.prefix || "D") : "D";
    const newCnt   = Math.max(0, (parseInt(db.count||0)) - 1);
    const firstNum = db.firstNum || parseInt((db.start||"").replace(/\D/g,"")) + 1 || 1;
    const newEnd   = newCnt > 0 ? fmtRegNum(prefix, firstNum + newCnt - 1) : db.start;
    up({ donationBook: { ...db, count: newCnt, end: newEnd, donors: dropDonor(db, db.end), ...orderMoney(db, parseFloat(db.perAmount||0), -1) } });
  };
  // Update a donation payment split field and keep total in sync
  const upDonationPay = (field, val) => {
    const db   = s.donationBook;
    const next = { ...db, [field]: val };
    const total= (parseFloat(next.cashAmount||0) + parseFloat(next.sumupAmount||0) + parseFloat(next.onlineAmount||0)).toFixed(2);
    up({ donationBook: { ...next, amount: total } });
  };

  // ── Expense Voucher counter ──────────────────────────────────────────────────
  const incrExpense = () => {
    if (s.status === "closed") return;
    const ev       = s.expenseVouchers;
    if (!expenseReady(ev)) return showToast("Fill in amount, paid to, email or phone, what it was for and the date first", "error");
    if (!ev.orderPay) return showToast("Choose Cash, Card or Online first", "error");
    const prefix   = expenseReg ? (expenseReg.prefix || "E") : "E";
    const firstNum = ev.firstNum || parseInt((ev.start||"").replace(/\D/g,"")) + 1 || 1;
    const newCnt   = (parseInt(ev.count||0)) + 1;
    const newEnd   = fmtRegNum(prefix, firstNum + newCnt - 1);
    up({ expenseVouchers: { ...ev, count: newCnt, end: newEnd, firstNum, payees: addPayee(ev, newEnd), ...orderMoney(ev, parseFloat(ev.perAmount||0), 1) } });
  };
  const decrExpense = () => {
    if (s.status === "closed") return;
    const ev       = s.expenseVouchers;
    if (!(ev.orderCount > 0)) return showToast("Only entries in the current order can be taken off", "error");
    const prefix   = expenseReg ? (expenseReg.prefix || "E") : "E";
    const newCnt   = Math.max(0, (parseInt(ev.count||0)) - 1);
    const firstNum = ev.firstNum || parseInt((ev.start||"").replace(/\D/g,"")) + 1 || 1;
    const newEnd   = newCnt > 0 ? fmtRegNum(prefix, firstNum + newCnt - 1) : ev.start;
    up({ expenseVouchers: { ...ev, count: newCnt, end: newEnd, payees: dropDonor({ donors: ev.payees }, ev.end), ...orderMoney(ev, parseFloat(ev.perAmount||0), -1) } });
  };
  // Update an expense payment split field and keep total in sync
  const upExpensePay = (field, val) => {
    const ev   = s.expenseVouchers;
    const next = { ...ev, [field]: val };
    const total= (parseFloat(next.cashAmount||0) + parseFloat(next.sumupAmount||0) + parseFloat(next.onlineAmount||0)).toFixed(2);
    up({ expenseVouchers: { ...next, amount: total } });
  };
  const denomTotal = () => {
    return DENOMS.reduce((sum, d) => {
      const cnt = parseFloat(s.denoms?.[d.label]?.count || 0);
      return sum + cnt * d.val;
    }, 0);
  };

  const closingBalance = denomTotal().toFixed(2);

  // ── Revenue helpers ──────────────────────────────────────────────────────────
  // Cash income = archana cash + donation cash + hundi (all cash)
  // Cash expense = expense cash
  // Expected Cash in Hand = opening + cash income − cash expense
  // This must tally with denomination total (closing balance)
  const calcCashIncome = () => {
    const arc = parseFloat(s.archanaTickets?.cashAmount||0);
    const don = parseFloat(s.donationBook?.cashAmount||0);
    const hun = parseFloat(s.hundi?.amount||0);  // hundi is always cash
    return arc + don + hun;
  };
  const calcCashExpense = () => parseFloat(s.expenseVouchers?.cashAmount||0);

  const calcExpected = () => {
    const ob = parseFloat(s.openingBalance||0);
    return (ob + calcCashIncome() - calcCashExpense()).toFixed(2);
  };

  // Total revenue across ALL payment methods (for reporting, not tally)
  const calcTotalRevenue = () => {
    const arc  = parseFloat(s.archanaTickets?.amount||0);
    const don  = parseFloat(s.donationBook?.cashAmount||0) + parseFloat(s.donationBook?.sumupAmount||0) + parseFloat(s.donationBook?.onlineAmount||0);
    const hun  = parseFloat(s.hundi?.amount||0);
    const exp  = parseFloat(s.expenseVouchers?.amount||0);
    return (arc + don + hun - exp).toFixed(2);
  };

  // Auto-computed SumUp total = archana sumup + donation sumup
  const calcSumupTotal = () => {
    const arc = parseFloat(s.archanaTickets?.sumupAmount||0);
    const don = parseFloat(s.donationBook?.sumupAmount||0);
    const exp = parseFloat(s.expenseVouchers?.sumupAmount||0);
    return (arc + don - exp).toFixed(2);
  };

  // Auto-computed Online total = archana online + donation online + expense online
  const calcOnlineTotal = () => {
    const arc = parseFloat(s.archanaTickets?.onlineAmount||0);
    const don = parseFloat(s.donationBook?.onlineAmount||0);
    const exp = parseFloat(s.expenseVouchers?.onlineAmount||0);
    return (arc + don - exp).toFixed(2);
  };

  const closeSheet = () => {
    // Only admin can close on any day; Rota Lead/Volunteer only on the actual rota date
    if (!isAdmin) {
      const today = new Date();
      const parts = (s.date||"").split("-");
      const isRotaDay = parts.length === 3 &&
        today.getFullYear() === parseInt(parts[0]) &&
        today.getMonth() + 1 === parseInt(parts[1]) &&
        today.getDate()   === parseInt(parts[2]);
      if (!isRotaDay) {
        showToast("Closing is only allowed on the rota day (" + (s.date||"") + ")", "error");
        return;
      }
    }
    const cb = denomTotal().toFixed(2);
    const expected  = parseFloat(calcExpected());
    const counted   = parseFloat(cb);
    const sumupAmt  = parseFloat(calcSumupTotal());
    const onlineAmt = parseFloat(calcOnlineTotal());
    const cashTally   = Math.abs(counted - expected) < 0.01;
    const archEnd  = s.archanaTickets?.end   || s.archanaTickets?.start || "";
    const donEnd   = s.donationBook?.end     || s.donationBook?.start   || "";
    const expEnd   = s.expenseVouchers?.end  || s.expenseVouchers?.start || "";

    up({
      status:         "closed",
      closingBalance: cb,
      closingTime:    new Date().toTimeString().slice(0,5),
      archanaClose:  archEnd,
      donationClose: donEnd,
      expenseClose:  expEnd,
      // Store final payment totals for reconciliation display
      finalSumup:  sumupAmt.toFixed(2),
      finalOnline: onlineAmt.toFixed(2),
      denomClose: Object.fromEntries(DENOMS.map(d => [d.label, (s.denoms&&s.denoms[d.label]&&s.denoms[d.label].count!==undefined)?s.denoms[d.label].count:""])),
    });

    // Sync Cash in Hand register
    if (upCashInHand) {
      upCashInHand(Object.fromEntries(DENOMS.map(d => [d.label, (s.denoms&&s.denoms[d.label]&&s.denoms[d.label].count!==undefined)?s.denoms[d.label].count:""])));
    }

    // Write back latestNum to the 3 registers in Master Data
    if (upRegs && registers) {
      upRegs(registers.map(r => {
        const isArch = archanaiReg && r.id === archanaiReg.id;
        const isDon  = donationReg  && r.id === donationReg.id;
        const isExp  = expenseReg   && r.id === expenseReg.id;
        if (isArch && archEnd) return { ...r, latestNum: parseInt(archEnd.replace(/\D/g,"")) || r.latestNum };
        if (isDon  && donEnd)  return { ...r, latestNum: parseInt(donEnd.replace(/\D/g,""))  || r.latestNum };
        if (isExp  && expEnd)  return { ...r, latestNum: parseInt(expEnd.replace(/\D/g,""))  || r.latestNum };
        return r;
      }));
    }

    const msgs = [];
    if (!cashTally) msgs.push("Cash: £" + Math.abs(counted-expected).toFixed(2) + (counted>expected?" over":" short"));
    showToast(msgs.length === 0
      ? "Rota Sheet closed ✓ — All tallies matched!"
      : "Sheet closed ⚠️ — " + msgs.join(" · "));
  };

  const reopenSheet = () => { up({ status: "open" }); showToast("Sheet reopened"); };

  const inp = (val, onChange, extra="") =>
    <input value={val||""} onChange={e=>onChange(e.target.value)} disabled={isClosed}
      className={`border rounded-lg px-2 py-1 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-300 ${isClosed?"bg-slate-50 text-slate-500":"bg-white"} ${extra}`}/>;

  const cell = (val, onChange, w="w-20") =>
    <input value={val||""} onChange={e=>onChange(e.target.value)} disabled={isClosed}
      className={`${w} border border-slate-200 rounded px-2 py-1 text-sm text-center focus:outline-none focus:ring-1 focus:ring-indigo-300 ${isClosed?"bg-slate-50":"bg-white"}`}/>;

  return (
    <div className="fade-in">
      {/* Toolbar */}
      <div className="flex items-center justify-between mb-4 gap-3 flex-wrap">
        <button onClick={onBack} className="text-sm text-indigo-600 hover:underline font-medium flex items-center gap-1">
          ← All Rota Sheets
        </button>
        <div className="flex gap-2 items-center">
          {onPhoneView && <button onClick={onPhoneView} className="text-sm text-indigo-600 hover:underline font-medium">📱 Phone view</button>}
          <button onClick={()=>{ if (!printRotaSheet(s, { config, rotaSheets, sponsorships })) showToast("Allow pop-ups to print","error"); }}
            className="text-sm bg-indigo-50 border border-indigo-200 text-indigo-700 px-3 py-1.5 rounded-lg hover:bg-indigo-100 font-semibold">🖨 Print / PDF</button>
          {!isClosed
            ? <button onClick={closeSheet} className="bg-emerald-600 text-white px-5 py-2 rounded-xl font-bold text-sm hover:bg-emerald-700 shadow-sm">✓ Close Cash Counter</button>
            : <button onClick={reopenSheet} className="bg-amber-500 text-white px-5 py-2 rounded-xl font-bold text-sm hover:bg-amber-600">↩ Reopen Sheet</button>
          }
        </div>
      </div>

      {/* ═══ ROTA REPORT FORM ═══ */}
      <div className="bg-white rounded-2xl border border-slate-300 shadow-lg overflow-hidden print:shadow-none">

        {/* Header */}
        <div className="text-center py-4 md:py-5 px-4 md:px-6 border-b border-slate-200 bg-slate-50">
          {config.logo && <div className="flex justify-center mb-2"><OrgLogo config={config} size="w-16 h-16"/></div>}
          <div className="text-xl font-bold text-slate-800">{config.fullName || config.orgName}</div>
          {config.charityNo && <div className="text-xs text-slate-500 mt-0.5">Registered Charity: {config.charityNo}</div>}
          <div className="text-base font-bold text-slate-700 mt-1 tracking-wider uppercase">Rota Report</div>
          {isClosed && <span className="inline-block mt-2 bg-emerald-100 text-emerald-700 text-xs font-bold px-3 py-1 rounded-full">✓ Closed</span>}
        </div>

        <div className="p-3 md:p-5 space-y-4">

          {/* ── Top info grid ── */}
          <div className="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-2 text-sm border border-slate-200 rounded-xl p-3 md:p-4 bg-slate-50">
            <div className="flex items-center gap-2">
              <span className="font-bold w-28 flex-shrink-0">Date</span>
              <input type="date" value={s.date||""} onChange={e=>up({date:e.target.value})} disabled={isClosed}
                className="flex-1 border border-slate-200 rounded-lg px-2 py-1 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-300 bg-white"/>
            </div>
            <div className="flex flex-wrap items-center gap-2">
              <span className="font-bold w-28 md:w-32 flex-shrink-0">Opening Time</span>
              <input type="time" value={s.openingTime||""} onChange={e=>up({openingTime:e.target.value})} disabled={isClosed}
                className="flex-1 border border-slate-200 rounded-lg px-2 py-1 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-300 bg-white"/>
              <span className="font-bold w-28 md:w-auto md:ml-2 flex-shrink-0">Closing Time</span>
              <input type="time" value={s.closingTime||""} onChange={e=>up({closingTime:e.target.value})} disabled={isClosed}
                className="flex-1 border border-slate-200 rounded-lg px-2 py-1 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-300 bg-white"/>
            </div>
            <div className="flex items-center gap-2">
              <span className="font-bold w-28 flex-shrink-0">Rota Lead</span>
              <select value={s.rotaLead||""} onChange={e=>up({rotaLead:e.target.value})} disabled={isClosed}
                className="flex-1 border border-slate-200 rounded-lg px-2 py-1 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-300 bg-white">
                <option value="">— Select</option>
                {members.filter(m=>m.role==="primary").map(m=><option key={m.id} value={m.name}>{m.name}</option>)}
              </select>
            </div>
            <div className="flex items-center gap-2">
              <span className="font-bold w-28 md:w-32 flex-shrink-0">Treasury</span>

// ─── Supabase Setup Screen (shown on first load if not configured) ────────────
function SupabaseSetup({ onDone, onSkip }) {
  const [url, setUrl] = useState(getSupaCfg().url||"");
  const [key, setKey] = useState(getSupaCfg().key||"");
  const [testing, setTesting] = useState(false);
  const [testMsg, setTestMsg] = useState(null);

  const test = async () => {
    setTesting(true); setTestMsg(null);
    try {
      const r = await fetch(url.replace(/\/+$/,"") + "/rest/v1/rpc/rota_public", { method:"POST",
        headers: { "Content-Type":"application/json", "apikey": key, "Authorization": "Bearer "+key }, body: "{}"
      });
      if (r.status === 404 || r.status === 400) {
        setTestMsg({ ok:false, msg:"Connected but server functions not found — have you run supabase/lockdown.sql?" });
      } else if (!r.ok) {
        const t = await r.text();
        setTestMsg({ ok:false, msg:"Error "+r.status+": "+t.slice(0,120) });
      } else {
        setTestMsg({ ok:true, msg:"✅ Connected successfully!" });
      }
    } catch(e) { setTestMsg({ ok:false, msg:"Connection failed: "+e.message }); }
    setTesting(false);
  };

  const save = () => {
    LS.set(SUPA_CFG_KEY, { url: url.trim(), key: key.trim() });
    onDone();
  };

  return (
    <div className="min-h-screen bg-gradient-to-br from-indigo-50 to-violet-50 flex items-center justify-center p-3 md:p-4">
      <div className="bg-white rounded-2xl shadow-xl border border-slate-200 max-w-lg w-full p-5 md:p-8">
        <div className="text-4xl mb-4 text-center">🗄️</div>
        <h1 className="text-2xl font-bold text-slate-800 text-center mb-1">Connect to Supabase</h1>
        <p className="text-slate-500 text-sm text-center mb-6">Set up a shared database so everyone uses the same data</p>

        <div className="bg-amber-50 border border-amber-200 rounded-xl p-4 mb-6 text-xs text-amber-800 space-y-1.5">
          <p className="font-bold">Quick setup (5 minutes):</p>
          <p>1. Go to <a href="https://supabase.com" target="_blank" className="underline font-semibold">supabase.com</a> → New project</p>
          <p>2. In SQL Editor, paste and run this script:</p>
          <pre className="bg-amber-100 rounded-lg p-2 text-xs overflow-x-auto mt-1 select-all">
{`create table if not exists app_data (
  key text primary key,
  value jsonb not null default '{}'::jsonb
);
alter table app_data enable row level security;
create policy "allow all" on app_data
  for all using (true) with check (true);`}
          </pre>
          <p>3. Go to Project Settings → API → copy URL and anon key below</p>
        </div>

        <div className="space-y-3 mb-4">
          <div>
            <label className="text-xs font-semibold text-slate-600 block mb-1">Project URL</label>
            <input value={url} onChange={e=>setUrl(e.target.value)} placeholder="https://xxxx.supabase.co"
              className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300"/>
          </div>
          <div>
            <label className="text-xs font-semibold text-slate-600 block mb-1">Anon (public) key</label>
            <input value={key} onChange={e=>setKey(e.target.value)} placeholder="eyJhbGci..."
              className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 font-mono"/>
          </div>
        </div>

        <div className="flex gap-2 mb-3">
          <button onClick={test} disabled={!url||!key||testing}
            className="flex-1 border border-indigo-300 text-indigo-700 bg-indigo-50 hover:bg-indigo-100 rounded-lg py-2 text-sm font-semibold disabled:opacity-40">
            {testing ? "Testing…" : "Test Connection"}
          </button>
          <button onClick={save} disabled={!url||!key||!testMsg?.ok}
            className="flex-1 bg-indigo-600 text-white rounded-lg py-2 text-sm font-bold hover:bg-indigo-700 disabled:opacity-40">

          </button>

        {testMsg && (

// ─── Data Tools Panel (Export + one-time Migrate) ────────────────────────────
function DataToolsPanel({ showToast, allData }) {
  const [migrating, setMigrating] = useState(false);
  const [migResult, setMigResult] = useState(null);

  // Every data set the app keeps, by storage key
  const dataMap = {
    "rota-config":       allData.config,
    "rota-acts":         allData.activities,
    "rota-members":      allData.members,
    "rota-rotas":        allData.rotas,
    "rota-specials":     allData.specials,
    "rota-registers":    allData.registers,
    "rota-regentries":   allData.regEntries,
    "rota-sheets":       allData.rotaSheets,
    "rota-offers":       allData.generalOffers,
    "rota-cash":         allData.cashInHand,
    "rota-sevas":        allData.sevas,
    "rota-sponsorships": allData.sponsorships,
    "rota-inventory":    allData.inventory,
    "rota-itineraries":  allData.itineraries,
    "rota-prasadham":    allData.prasadham,
    "rota-priests":      allData.priests,
  };

  const migrate = async () => {
    setMigrating(true); setMigResult(null);
    let ok=0, fail=0, skipped=0;
    const mapKeys = Object.keys(dataMap);
    for (let ki=0; ki<mapKeys.length; ki++) {
      const k = mapKeys[ki]; const v = dataMap[k];
      if (v === null || v === undefined) { skipped++; continue; }
      try {
        const res = await DB.rpc("rota_save", { p_token: DB.token, p_key: k, p_value: v });
        res.ok ? ok++ : fail++;
      } catch { fail++; }
    }
    setMigResult(`Done! ${ok} tables migrated${fail>0?" ("+fail+" failed)":""}${skipped>0?" ("+skipped+" empty)":""}`);
    showToast("Migration complete — reload the app");
    setMigrating(false);
  };

  const exportAll = () => {
    const blob = new Blob([JSON.stringify(dataMap, null, 2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = fileSlug(allData.config && allData.config.orgName).toLowerCase() + "-rota-backup-" + new Date().toISOString().slice(0,10) + ".json";
    a.click();
    showToast("Data exported as JSON");
  };

  return (
    <div className="space-y-4">
      {/* Export */}
      <div className="border border-slate-100 rounded-xl p-4 space-y-2">
        <div className="font-semibold text-slate-700 text-sm">💾 Export all data</div>
        <p className="text-xs text-slate-400">Download a full backup of all app data as a JSON file. It contains members' names and contact details — keep it somewhere private.</p>
        <button onClick={exportAll}
          className="bg-emerald-600 text-white rounded-lg px-4 py-2 text-sm font-bold hover:bg-emerald-700">
          Download Backup (JSON)
        </button>
      </div>

      {/* Migrate — one-time job when first moving to Supabase; overwrites the shared data */}
      <div className="border border-red-100 rounded-xl p-4 space-y-2">
        <div className="font-semibold text-slate-700 text-sm">📤 Migrate data to Supabase</div>
        <p className="text-xs text-slate-400">One-time job used when first moving to the shared database. Not needed in normal use.</p>
        {isConfigured() ? (
          <TypedConfirm word="OVERWRITE" label={migrating ? "Migrating…" : "Migrate to Supabase"} onConfirm={migrate}
            warning="This REPLACES everything in the shared database with the data currently on this screen, for every user. Download a backup first."
            className="border border-red-200 text-red-600 bg-white hover:bg-red-50 rounded-lg px-4 py-2 text-sm font-semibold"/>
        ) : (
          <p className="text-xs text-amber-600">Configure the database connection first</p>
        )}
        {migResult && <p className="text-xs text-emerald-700 font-medium">{migResult}</p>}
      </div>
    </div>
  );
}
