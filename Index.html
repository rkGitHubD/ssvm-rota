          <div className="grid md:grid-cols-2 gap-4 mb-4">
            <div>
              <label className="text-xs font-semibold text-slate-500 block mb-1.5">🎯 Rota Lead</label>
              <select value={local.lead||""} onChange={e=>setLocal({...local,lead:e.target.value})}
                className="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 bg-white">
                <option value="">— Not assigned</option>
                {[...primaries,...secondaries].map(m=>(
                  <option key={m.id} value={m.id}>{m.name} ({roleLabel(m.role)})</option>
                ))}
              </select>
              {local.lead && (
                <p className="text-xs text-emerald-600 font-medium mt-1.5 px-1">
                  ✓ {(members.find(function(m){return m.id===local.lead;})||{}).name||""}
                </p>
              )}
            </div>
            <div>
              <label className="text-xs font-semibold text-slate-500 block mb-1.5">🟣 Secondary Member</label>
              <select value={(local.secondary||[])[0]||""} onChange={e=>setLocal({...local,secondary:e.target.value?[e.target.value]:[]})}
                className="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-violet-300 bg-white">
                <option value="">— Not assigned</option>
                {[...primaries,...secondaries].map(m=>(
                  <option key={m.id} value={m.id}>{m.name} ({roleLabel(m.role)})</option>
                ))}
              </select>
              {(local.secondary||[])[0] && (
                <p className="text-xs text-violet-600 font-medium mt-1.5 px-1">
                  ✓ {(members.find(function(m){return m.id===(local.secondary||[])[0];})||{}).name||""}
                </p>
              )}
            </div>
          </div>
          <div className="grid md:grid-cols-2 gap-4">
            <div>
              <label className="text-xs font-semibold text-slate-500 block mb-1.5">🔔 Priest</label>
              <select value={local.priestId||""} onChange={e=>setLocal({...local,priestId:e.target.value})}
                className="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 bg-white">
                <option value="">— Select priest</option>
                {priests.map(function(p){return <option key={p.id} value={p.id}>{p.name}{p.isDefault?" ⭐":""}</option>;})}
              </select>
              {local.priestId && (
                <p className="text-xs text-indigo-600 font-medium mt-1.5 px-1">
                  ✓ {(priests.find(function(p){return p.id===local.priestId;})||{}).name||""}
                </p>
              )}
            </div>
            <div>
              <label className="text-xs font-semibold text-slate-500 block mb-1.5">🍛 Prasadham Provider</label>
              <select value={local.prasadhamId||""} onChange={e=>setLocal({...local,prasadhamId:e.target.value})}
                className="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-300 bg-white">
                <option value="">— Select provider</option>
                {prasadham.map(function(p){return <option key={p.id} value={p.id}>{p.name}{p.amount?" (£"+p.amount+")":""}</option>;})}
              </select>
              {local.prasadhamId && (
                <p className="text-xs text-amber-600 font-medium mt-1.5 px-1">
                  ✓ {(prasadham.find(function(p){return p.id===local.prasadhamId;})||{}).name||""}
                </p>
              )}
            </div>
          </div>
        </div>
      )}

      <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-5">
        <div className="flex items-center justify-between mb-3">
          <h3 className="text-xs font-semibold text-slate-500 uppercase tracking-wider">✅ Activity Owners</h3>
          <span className="text-xs text-slate-400">Toggle 🙌 to broadcast "help wanted"</span>
        </div>
        <div className="space-y-4">
          {activities.map(a=>(
            <div key={a.id}>
              <div className="flex items-center justify-between mb-1">
                <label className="text-xs font-medium text-slate-600">{a.name}</label>
                <button onClick={()=>{ var cur=local.helpWanted||[]; var isHW=(local.helpWanted||[]).includes(a.id); setLocal({...local,helpWanted:isHW?cur.filter(x=>x!==a.id):[...cur,a.id]}); }}
                  className={"flex items-center gap-1 text-xs px-2 py-0.5 rounded-full border font-semibold transition-colors "+((local.helpWanted||[]).includes(a.id)?"bg-amber-100 text-amber-700 border-amber-300":"bg-slate-50 text-slate-400 border-slate-200")}>
                  🙌 {(local.helpWanted||[]).includes(a.id)?"Help Wanted":"Request Help"}
                </button>
              </div>
              {(rota.actInterest||{})[a.id] && !(local.actOwners||{})[a.id] && (
                <div className={"flex items-center justify-between rounded-lg px-3 py-2 mb-1.5 border "+((rota.actInterest||{})[a.id].status==="confirmed"?"bg-emerald-50 border-emerald-200":"bg-amber-50 border-amber-200")}>
                  <div>
                    <span className="text-xs font-semibold text-slate-700">{(rota.actInterest||{})[a.id].name}</span>
                    <span className={"ml-2 text-xs px-1.5 py-0.5 rounded-full font-medium "+((rota.actInterest||{})[a.id].status==="confirmed"?"bg-emerald-100 text-emerald-700":"bg-amber-100 text-amber-700")}>
                      {(rota.actInterest||{})[a.id].status==="confirmed"?"✓ Confirmed":"⏳ Pending"}
                    </span>
                  </div>
                  {(rota.actInterest||{})[a.id].status==="pending" && (
                    <div className="flex gap-1.5 flex-shrink-0 ml-2">
                      <button onClick={()=>{ var mId=(rota.actInterest||{})[a.id].memberId; var nO={...(local.actOwners||{}),[a.id]:mId}; var nI={...(rota.actInterest||{})}; delete nI[a.id]; setLocal({...local,actOwners:nO}); onSave({actOwners:nO,actInterest:nI}); showToast((rota.actInterest||{})[a.id].name+" confirmed"); }}
                        className="text-xs bg-emerald-600 hover:bg-emerald-700 text-white px-2.5 py-1 rounded-lg font-semibold">✓</button>
                      <button onClick={()=>{ var nI={...(rota.actInterest||{})}; delete nI[a.id]; onSave({actInterest:nI}); showToast("Declined"); }}
                        className="text-xs bg-red-100 hover:bg-red-200 text-red-600 px-2.5 py-1 rounded-lg font-semibold">✕</button>
                    </div>
                  )}
                </div>
              )}
              <select value={(local.actOwners||{})[a.id]||""} onChange={e=>setActOwner(a.id,e.target.value)}
                className="w-full border border-slate-200 rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 bg-white">
                <option value="">— Assign member</option>
                {members.map(m=><option key={m.id} value={m.id}>{m.name} ({roleLabel(m.role)})</option>)}
              </select>
            </div>
          ))}
          {activities.length===0 && <p className="text-slate-400 text-sm">No activities configured.</p>}
        </div>
      </div>


      {/* Notes */}
      <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-5">
        <h3 className="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">📝 Notes</h3>
        <textarea value={local.notes||""} onChange={e=>setLocal({...local,notes:e.target.value})}
          rows={3} placeholder="Any notes for this rota slot…"
          className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 resize-none"/>
      </div>

      <div className="flex justify-end">
        <button onClick={()=>onSave(local)} className="bg-indigo-600 text-white px-8 py-2.5 rounded-xl font-semibold hover:bg-indigo-700 shadow-sm">Save Rota</button>
      </div>
    </div>
  );
}

// ── MD: Prasadham Providers ──────────────────────────────────────────────────
function MDPrasadham({ prasadham, upPrasadham, showToast }) {
  var blank = {name:"",phone:"",amount:"",collection:""};
  var [form,   setForm]   = React.useState(blank);
  var [editId, setEditId] = React.useState(null);
  var cancel = function(){ setEditId(null); setForm(blank); };
  var save = function(){
    if (!form.name.trim()) return showToast("Name is required","error");
    if (editId) {
      upPrasadham(prasadham.map(function(p){return p.id===editId?{...p,...form}:p;}));
      showToast("Provider updated"); setEditId(null);
    } else {
      upPrasadham([...prasadham,{id:uid(),...form,name:form.name.trim()}]);
      showToast("Provider added");
    }
    setForm(blank);
  };
  var remove = function(id){ upPrasadham(prasadham.filter(function(p){return p.id!==id;})); showToast("Provider removed"); if(editId===id){cancel();} };
  var edit   = function(p){ setEditId(p.id); setForm({name:p.name,phone:p.phone||"",amount:p.amount||"",collection:p.collection||""}); };
  return (
    <div className="grid md:grid-cols-5 gap-6">
      <div className="md:col-span-2">
        <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 sticky top-4 space-y-3">
          <div className="flex items-center justify-between">
            <h2 className="font-bold text-slate-800 text-base">{editId?"✏️ Edit Provider":"➕ Add Provider"}</h2>
            {editId && <button onClick={cancel} className="text-xs text-slate-400 hover:text-slate-600">✕ Cancel</button>}
          </div>
          <Field label="Name *" value={form.name} onChange={v=>setForm({...form,name:v})} placeholder="e.g. Annapoorni Kitchen"/>
          <Field label="Contact Number" value={form.phone} onChange={v=>setForm({...form,phone:v})} placeholder="+44 7700 900000"/>
          <Field label="Amount We Pay (£)" value={form.amount} onChange={v=>setForm({...form,amount:v})} placeholder="e.g. 50"/>
          <Field label="Collection Method" value={form.collection} onChange={v=>setForm({...form,collection:v})} placeholder="e.g. Cash, Bank Transfer"/>
          <button onClick={save} className="w-full bg-indigo-600 text-white rounded-lg py-2.5 text-sm font-bold hover:bg-indigo-700">{editId?"Save Changes":"Add Provider"}</button>
        </div>
      </div>
      <div className="md:col-span-3 space-y-3">
        <h3 className="font-bold text-slate-700">🍛 Prasadham Providers ({prasadham.length})</h3>
        {prasadham.length===0 && <div className="bg-white rounded-2xl border border-slate-200 p-8 text-center text-slate-400"><p>No providers added yet.</p></div>}
        {prasadham.map(function(p){return (
          <div key={p.id} className="bg-white border border-slate-200 rounded-2xl px-4 py-3 flex items-start gap-3 shadow-sm">
            <div className="flex-1 min-w-0">
              <div className="font-semibold text-slate-800">{p.name}</div>
              <div className="text-xs text-slate-400 mt-0.5 space-x-3">
                {p.phone && <span>📱 {p.phone}</span>}
                {p.amount && <span>💷 £{p.amount}</span>}
                {p.collection && <span>🏦 {p.collection}</span>}
              </div>
            </div>
            <div className="flex gap-1 flex-shrink-0">
              <button onClick={function(){edit(p);}} className="text-xs bg-slate-50 border border-slate-200 text-slate-600 px-2.5 py-1.5 rounded-lg hover:bg-slate-100 font-medium">Edit</button>
              <button onClick={function(){remove(p.id);}} className="text-xs bg-red-50 border border-red-200 text-red-500 px-2.5 py-1.5 rounded-lg hover:bg-red-100 font-medium">Delete</button>
            </div>
          </div>
        );})}
      </div>
    </div>
  );
}

// ── MD: Priests ───────────────────────────────────────────────────────────────
function MDPriests({ priests, upPriests, showToast }) {
  var blank = {name:"",phone:"",normalFee:"",specialFee:"",isDefault:false};
  var [form,   setForm]   = React.useState(blank);
  var [editId, setEditId] = React.useState(null);
  var cancel = function(){ setEditId(null); setForm(blank); };
  var save = function(){
    if (!form.name.trim()) return showToast("Name is required","error");
    if (editId) {
      upPriests(priests.map(function(p){return p.id===editId?{...p,...form}:p;}));
      showToast("Priest updated"); setEditId(null);
    } else {
      upPriests([...priests,{id:uid(),...form,name:form.name.trim()}]);
      showToast("Priest added");
    }
    setForm(blank);
  };
  var remove = function(id){
    if (priests.find(function(p){return p.id===id;})?.isDefault) return showToast("Cannot delete the default priest","error");
    upPriests(priests.filter(function(p){return p.id!==id;})); showToast("Priest removed"); if(editId===id){cancel();}
  };
  var edit = function(p){ setEditId(p.id); setForm({name:p.name,phone:p.phone||"",normalFee:p.normalFee||"",specialFee:p.specialFee||"",isDefault:p.isDefault||false}); };
  var setDefault = function(id){ upPriests(priests.map(function(p){return {...p,isDefault:p.id===id};})); showToast("Default priest updated"); };
  return (
    <div className="grid md:grid-cols-5 gap-6">
      <div className="md:col-span-2">
        <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 sticky top-4 space-y-3">
          <div className="flex items-center justify-between">
            <h2 className="font-bold text-slate-800 text-base">{editId?"✏️ Edit Priest":"➕ Add Priest"}</h2>
            {editId && <button onClick={cancel} className="text-xs text-slate-400 hover:text-slate-600">✕ Cancel</button>}
          </div>
          <Field label="Priest Name *" value={form.name} onChange={v=>setForm({...form,name:v})} placeholder="e.g. Priest's full name"/>
          <Field label="Contact Number" value={form.phone} onChange={v=>setForm({...form,phone:v})} placeholder="+44 7700 900000"/>
          <Field label="Normal Pooja Fee (£)" value={form.normalFee} onChange={v=>setForm({...form,normalFee:v})} placeholder="e.g. 100"/>
          <Field label="Special Pooja Fee (£)" value={form.specialFee} onChange={v=>setForm({...form,specialFee:v})} placeholder="e.g. 200"/>
          <button onClick={save} className="w-full bg-indigo-600 text-white rounded-lg py-2.5 text-sm font-bold hover:bg-indigo-700">{editId?"Save Changes":"Add Priest"}</button>
        </div>
      </div>
      <div className="md:col-span-3 space-y-3">
        <h3 className="font-bold text-slate-700">🔔 Priests ({priests.length})</h3>
        {priests.length===0 && <div className="bg-white rounded-2xl border border-slate-200 p-8 text-center text-slate-400"><p>No priests added yet.</p></div>}
        {priests.map(function(p){return (
          <div key={p.id} className={"bg-white border rounded-2xl px-4 py-3 flex items-start gap-3 shadow-sm "+(p.isDefault?"border-indigo-300 bg-indigo-50":"border-slate-200")}>
            <div className="flex-1 min-w-0">
              <div className="flex items-center gap-2">
                <span className="font-semibold text-slate-800">{p.name}</span>
                {p.isDefault && <span className="text-xs bg-indigo-100 text-indigo-700 border border-indigo-200 px-2 py-0.5 rounded-full font-bold">⭐ Default</span>}
              </div>
              <div className="text-xs text-slate-400 mt-0.5 space-x-3">
                {p.phone && <span>📱 {p.phone}</span>}
                {p.normalFee && <span>💷 Normal: £{p.normalFee}</span>}
                {p.specialFee && <span>💷 Special: £{p.specialFee}</span>}
              </div>
            </div>
            <div className="flex gap-1 flex-shrink-0 flex-wrap justify-end">
              {!p.isDefault && <button onClick={function(){setDefault(p.id);}} className="text-xs bg-indigo-50 border border-indigo-200 text-indigo-600 px-2.5 py-1.5 rounded-lg hover:bg-indigo-100 font-medium">Set Default</button>}
              <button onClick={function(){edit(p);}} className="text-xs bg-slate-50 border border-slate-200 text-slate-600 px-2.5 py-1.5 rounded-lg hover:bg-slate-100 font-medium">Edit</button>
              {!p.isDefault && <button onClick={function(){remove(p.id);}} className="text-xs bg-red-50 border border-red-200 text-red-500 px-2.5 py-1.5 rounded-lg hover:bg-red-100 font-medium">Delete</button>}
            </div>
          </div>
        );})}
      </div>
    </div>
  );
}

// ─── Master Data ─────────────────────────────────────────────────────────────
// ── MD: Cash in Hand ──────────────────────────────────────────────────────────
function MDCashInHand({ cashInHand, upCashInHand, rotaSheets, showToast }) {
  const [expandedSheet, setExpandedSheet] = useState(null);

  const denomTotal = (denomObj) => DENOMS.reduce((sum, d) => {
    return sum + parseFloat(denomObj?.[d.label] || 0) * d.val;
  }, 0);

  const currentTotal = denomTotal(cashInHand);

  // Build history from closed rota sheets that have denomClose
  const history = (rotaSheets||[])
    .filter(s => s.status === "closed" && s.denomClose)
    .sort((a,b) => new Date(b.date) - new Date(a.date));

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between flex-wrap gap-3">
        <div>
          <h3 className="text-lg font-bold text-slate-800">💷 Cash in Hand</h3>
          <p className="text-sm text-slate-500 mt-0.5">Updated automatically on each Rota Sheet closure. Amend manually if needed.</p>
        </div>
      </div>

      {/* Current position — compact */}
      <div className="bg-white border border-slate-200 rounded-2xl shadow-sm p-4">
        <div className="flex items-center justify-between mb-3">
          <span className="text-sm font-bold text-slate-700">📌 Current Cash in Hand</span>
          <span className="text-xl font-extrabold text-emerald-700">£{currentTotal.toFixed(2)}</span>
        </div>
        <div className="grid grid-cols-5 sm:grid-cols-10 gap-1.5">
          {DENOMS.map(d => {
            const cnt = parseFloat(cashInHand?.[d.label] || 0);
            return (
              <div key={d.label} className="text-center">
                <div className={`text-xs font-bold rounded px-1 py-0.5 mb-0.5 ${d.pence?"bg-slate-100 text-slate-500":"bg-amber-50 text-amber-700 border border-amber-200"}`}>{d.label}</div>
                <input type="number" min="0" value={cashInHand?.[d.label]||""}
                  onChange={e => upCashInHand({...cashInHand, [d.label]: e.target.value})}
                  className="w-full border border-slate-200 rounded px-1 py-1 text-xs text-center focus:outline-none focus:ring-1 focus:ring-indigo-300 bg-white"/>
                {cnt > 0 && <div className="text-xs text-slate-400 mt-0.5">£{(cnt*d.val).toFixed(cnt*d.val>=1?0:2)}</div>}
              </div>
            );
          })}
        </div>
      </div>

      {/* History list */}
      {history.length > 0 && (
        <div className="space-y-2">
          <p className="text-xs font-bold text-slate-500 uppercase tracking-wider">Closure History</p>
          <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            {history.map((s, idx) => {
              const tot = denomTotal(s.denomClose);
              const isOpen = expandedSheet === s.id;
              const isLast = idx === history.length - 1;
              return (
                <div key={s.id} className={`${!isLast?"border-b border-slate-100":""}`}>
                  <button onClick={() => setExpandedSheet(isOpen ? null : s.id)}
                    className="w-full text-left px-4 py-3 flex items-center gap-3 hover:bg-slate-50 transition-colors group">
                    <span className="text-sm font-semibold text-slate-700 flex-1">
                      {new Date(s.date).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"})}
                    </span>
                    <span className="text-sm font-bold text-emerald-700">£{tot.toFixed(2)}</span>
                    <span className="text-slate-300 text-xs group-hover:text-slate-500">{isOpen?"▲":"▼"}</span>
                  </button>
                  {isOpen && (
                    <div className="px-4 pb-4 fade-in">
                      <div className="grid grid-cols-5 sm:grid-cols-10 gap-2 bg-slate-50 rounded-xl p-3">
                        {DENOMS.map(d => {
                          const cnt = parseFloat(s.denomClose?.[d.label] || 0);
                          if (!cnt) return null;
                          return (
                            <div key={d.label} className="text-center">
                              <div className={`text-xs font-bold rounded px-1 py-0.5 mb-0.5 ${d.pence?"bg-slate-100 text-slate-500":"bg-amber-50 text-amber-700 border border-amber-200"}`}>{d.label}</div>
                              <div className="text-sm font-bold text-slate-700">{cnt}</div>
                              <div className="text-xs text-slate-400">£{(cnt*d.val).toFixed(cnt*d.val>=1?0:2)}</div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      )}
      {history.length === 0 && (
        <p className="text-xs text-slate-400 text-center py-4">No closure history yet — close a Rota Sheet to begin tracking</p>
      )}
    </div>
  );
}

// ── MD: Services ─────────────────────────────────────────────────────────────────

              <th className="px-4 py-2.5 text-left font-bold text-slate-600">Service</th>
              <th className="px-4 py-2.5 text-left font-bold text-slate-600 hidden sm:table-cell">Pooja Details</th>
              <th className="px-4 py-2.5 text-center font-bold text-slate-600">Donation</th>
              <th className="px-4 py-2.5 text-center font-bold text-slate-600">Actions</th>

            <tbody>

                <tr key={sv.id} className="bg-indigo-50 border-b border-slate-100">
                  <td className="px-3 py-2"><input value={draft.name} onChange={e=>setDraft(p=>({...p,name:e.target.value}))} className="w-full border rounded-lg px-2 py-1 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-300"/></td>

}

// ── MD: Sponsorships ──────────────────────────────────────────────────────────
// Two-level model: Sponsorship Areas (e.g. "Full Pooja") + Donations (donor records against an area)
const FREQ_OPTIONS = ["one-off","weekly","monthly","quarterly","custom (weeks)"];

function MDSponsorships({ sponsorships, upSponsorships, showToast }) {
  // sponsorships = array of Sponsorship Areas
  // Each area: { id, name, notes }
  // Each area has .donations = [{ id, donor, amount, frequency, rotaDates[], startDate, endDate, customWeeks, notes }]

  const blankArea   = () => ({ id: uid(), name: "", notes: "", donations: [] });
  const blankDonor  = () => ({ id: uid(), donor: "", amount: "", frequency: "one-off", rotaDates: [], startDate: "", endDate: "", customWeeks: "", notes: "" });

  const [areaForm,    setAreaForm]   = useState(false);
  const [newArea,     setNewArea]    = useState(blankArea());
  const [editArea,    setEditArea]   = useState(null);  // id
  const [draftArea,   setDraftArea]  = useState(null);

  const [donorForm,   setDonorForm]  = useState(null);  // areaId
  const [newDonor,    setNewDonor]   = useState(blankDonor());
  const [editDonor,   setEditDonor]  = useState(null);  // {areaId, donorId}
  const [draftDonor,  setDraftDonor] = useState(null);
  const [expandedArea, setExpandedArea] = useState(null);

  // ── Area CRUD ──
  const saveArea = () => {
    if (!newArea.name.trim()) return showToast("Area name required","error");
    upSponsorships([...sponsorships, {...newArea, donations:[]}]);
    setNewArea(blankArea()); setAreaForm(false); showToast("Sponsorship area added");
  };
  const saveEditArea = () => {
    if (!draftArea.name.trim()) return showToast("Name required","error");
    upSponsorships(sponsorships.map(a => a.id===draftArea.id ? {...a, name:draftArea.name, notes:draftArea.notes} : a));
    setEditArea(null); setDraftArea(null); showToast("Updated");
  };
  const delArea = id => {
    if (confirm("Delete this sponsorship area and ALL its donor records?")) {
      upSponsorships(sponsorships.filter(a=>a.id!==id)); showToast("Deleted");
    }
  };

  // ── Donor CRUD ──
  const upAreaDonations = (areaId, newDonations) => {
    upSponsorships(sponsorships.map(a => a.id===areaId ? {...a, donations: newDonations} : a));
  };

  // Compute rota dates from frequency/start/end/customWeeks
  const computeRotaDates = (donor) => {
    const { frequency, rotaDates, startDate, endDate, customWeeks } = donor;
    if (frequency === "one-off") return rotaDates||[];
    if (!startDate) return [];
    const start = new Date(startDate);
    const end   = endDate ? new Date(endDate) : null;
    const weeks = customWeeks ? parseInt(customWeeks) : null;
    const stepDays = frequency==="weekly" ? 7 : frequency==="monthly" ? 28 : frequency==="quarterly" ? 91 : (weeks ? weeks*7 : 7);
    const dates = [];
    let cur = new Date(start);
    let count = 0;
    const maxIter = 200;
    while (count < maxIter) {
      if (end && cur > end) break;
      if (weeks && dates.length >= weeks) break;
      if (!end && !weeks && dates.length >= 52) break;
      dates.push(cur.toISOString().slice(0,10));
      cur = new Date(cur.getTime() + stepDays*24*60*60*1000);
      count++;
    }
    return dates;
  };

  const saveDonor = (areaId) => {
    if (!newDonor.donor.trim()) return showToast("Donor name required","error");
    if (!newDonor.amount || isNaN(parseFloat(newDonor.amount))) return showToast("Enter a valid amount","error");
    const computed = computeRotaDates(newDonor);
    const area = sponsorships.find(a=>a.id===areaId);
    const updated = [...(area.donations||[]), {...newDonor, amount: parseFloat(newDonor.amount).toFixed(2), rotaDates: computed}];
    upAreaDonations(areaId, updated);
    setDonorForm(null); setNewDonor(blankDonor()); showToast("Donation recorded");
  };

  const saveEditDonor = () => {
    if (!draftDonor.donor.trim()) return showToast("Donor name required","error");
    const computed = computeRotaDates(draftDonor);
    const area = sponsorships.find(a=>a.id===editDonor.areaId);
    const updated = (area.donations||[]).map(d => d.id===editDonor.donorId ? {...draftDonor, rotaDates:computed} : d);
    upAreaDonations(editDonor.areaId, updated);
    setEditDonor(null); setDraftDonor(null); showToast("Donation updated");
  };

  const delDonor = (areaId, donorId) => {
    if (confirm("Delete this donation record?")) {
      const area = sponsorships.find(a=>a.id===areaId);
      upAreaDonations(areaId, (area.donations||[]).filter(d=>d.id!==donorId));
      showToast("Deleted");
    }
  };

  const DonorForm = ({areaId, donor, setDonor, onSave, onCancel}) => {
    const needDates = donor.frequency === "one-off";
    const needRange = ["weekly","monthly","quarterly"].includes(donor.frequency);
    const needWeeks = donor.frequency === "custom (weeks)";
    const [newDate, setNewDate] = useState("");
    return (
      <div className="bg-indigo-50 border border-indigo-200 rounded-xl p-4 space-y-3 mt-2">
        <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div><label className="text-xs font-semibold text-slate-600 block mb-1">Donor Name *</label>
            <input value={donor.donor} onChange={e=>setDonor(p=>({...p,donor:e.target.value}))} placeholder="e.g. Ravi Family"
              className="w-full border border-slate-200 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-300"/></div>
          <div><label className="text-xs font-semibold text-slate-600 block mb-1">Amount Paid (£) *</label>
            <input type="number" min="0" step="0.01" value={donor.amount} onChange={e=>setDonor(p=>({...p,amount:e.target.value}))} placeholder="e.g. 51.00"
              className="w-full border border-slate-200 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-300"/></div>
          <div><label className="text-xs font-semibold text-slate-600 block mb-1">Frequency</label>
            <select value={donor.frequency} onChange={e=>setDonor(p=>({...p,frequency:e.target.value, rotaDates:[], startDate:"", endDate:"", customWeeks:""}))}
              className="w-full border border-slate-200 rounded-lg px-3 py-1.5 text-sm bg-white focus:outline-none focus:ring-1 focus:ring-indigo-300">
              {FREQ_OPTIONS.map(f=><option key={f} value={f}>{f.charAt(0).toUpperCase()+f.slice(1)}</option>)}
            </select></div>
          {needDates && (
            <div className="sm:col-span-3">
              <label className="text-xs font-semibold text-slate-600 block mb-1">Rota Date(s)</label>
              <div className="flex gap-2 flex-wrap mb-1.5">
                {(donor.rotaDates||[]).map(d=>(
                  <span key={d} className="inline-flex items-center gap-1 bg-amber-50 border border-amber-200 text-amber-700 text-xs px-2 py-0.5 rounded-full">
                    {new Date(d).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}
                    <button onClick={()=>setDonor(p=>({...p,rotaDates:p.rotaDates.filter(x=>x!==d)}))} className="text-amber-400 hover:text-amber-700 font-bold">×</button>
                  </span>
                ))}
              </div>
              <div className="flex gap-2">
                <input type="date" value={newDate} onChange={e=>setNewDate(e.target.value)}
                  className="border border-slate-200 rounded-lg px-2 py-1 text-xs focus:outline-none focus:ring-1 focus:ring-indigo-300"/>
                <button onClick={()=>{if(newDate&&!(donor.rotaDates||[]).includes(newDate)){setDonor(p=>({...p,rotaDates:[...(p.rotaDates||[]),newDate].sort()}));setNewDate("");}}}
                  className="bg-amber-100 hover:bg-amber-200 text-amber-700 px-3 py-1 rounded-lg text-xs font-semibold">Add</button>
              </div>
            </div>
          )}
          {needRange && (<>
            <div><label className="text-xs font-semibold text-slate-600 block mb-1">Start Date</label>
              <input type="date" value={donor.startDate} onChange={e=>setDonor(p=>({...p,startDate:e.target.value}))}
                className="w-full border border-slate-200 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-300"/></div>
            <div><label className="text-xs font-semibold text-slate-600 block mb-1">End Date (optional)</label>
              <input type="date" value={donor.endDate} onChange={e=>setDonor(p=>({...p,endDate:e.target.value}))}
                className="w-full border border-slate-200 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-300"/></div>
          </>)}
          {needWeeks && (<>
            <div><label className="text-xs font-semibold text-slate-600 block mb-1">Start Date</label>
              <input type="date" value={donor.startDate} onChange={e=>setDonor(p=>({...p,startDate:e.target.value}))}
                className="w-full border border-slate-200 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-300"/></div>
            <div><label className="text-xs font-semibold text-slate-600 block mb-1">Number of Weeks</label>
              <input type="number" min="1" value={donor.customWeeks} onChange={e=>setDonor(p=>({...p,customWeeks:e.target.value}))} placeholder="e.g. 4"
                className="w-full border border-slate-200 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-300"/></div>
          </>)}
          <div className="sm:col-span-3"><label className="text-xs font-semibold text-slate-600 block mb-1">Notes</label>
            <input value={donor.notes} onChange={e=>setDonor(p=>({...p,notes:e.target.value}))} placeholder="Optional"
              className="w-full border border-slate-200 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-300"/></div>
        </div>
        <div className="flex gap-2 justify-end">
          <button onClick={onCancel} className="px-4 py-1.5 rounded-lg text-sm font-semibold border border-slate-200 bg-white hover:bg-slate-50">Cancel</button>
          <button onClick={onSave} className="px-4 py-1.5 rounded-lg text-sm font-bold bg-emerald-600 text-white hover:bg-emerald-700">Save Donation</button>
        </div>
      </div>
    );
  };

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between">
        <div>
          <h3 className="text-lg font-bold text-slate-800">🤝 Sponsorships</h3>
          <p className="text-sm text-slate-500 mt-0.5">Define sponsorship areas, then record donations with donor names, amounts, frequencies and rota dates.</p>
        </div>
        <button onClick={() => { setAreaForm(true); setNewArea(blankArea()); }}
          className="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2.5 rounded-xl font-bold text-sm">＋ Add Area</button>
      </div>

      {areaForm && (
        <div className="bg-indigo-50 border border-indigo-200 rounded-2xl p-4 space-y-3">
          <p className="text-sm font-bold text-indigo-800">New Sponsorship Area</p>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div><label className="text-xs font-semibold text-slate-600 block mb-1">Area Name *</label>
              <input value={newArea.name} onChange={e=>setNewArea(p=>({...p,name:e.target.value}))} placeholder="e.g. Full Pooja, Alankaram, Prasadam"
                className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300"/></div>
            <div><label className="text-xs font-semibold text-slate-600 block mb-1">Notes</label>
              <input value={newArea.notes} onChange={e=>setNewArea(p=>({...p,notes:e.target.value}))} placeholder="Optional"

      )}

      {sponsorships.map(area => {
        const isExpanded = expandedArea === area.id;
        const donorCount = (area.donations||[]).length;
        return (
          <div key={area.id} className="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
            {/* Area header row */}
            {editArea === area.id ? (
              <div className="px-4 py-3 bg-indigo-50 border-b border-indigo-100 flex items-center gap-3 flex-wrap">
                <input value={draftArea.name} onChange={e=>setDraftArea(p=>({...p,name:e.target.value}))}
                  className="flex-1 border border-slate-200 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-300"/>
                <input value={draftArea.notes} onChange={e=>setDraftArea(p=>({...p,notes:e.target.value}))} placeholder="Notes"
                  className="flex-1 border border-slate-200 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-300"/>
                <button onClick={saveEditArea} className="bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold">Save</button>
                <button onClick={()=>{setEditArea(null);setDraftArea(null);}} className="bg-slate-100 text-slate-600 px-3 py-1.5 rounded-lg text-xs">Cancel</button>
              </div>

              <div className="px-4 py-3 flex items-center gap-3 border-b border-slate-100">
                <button onClick={()=>setExpandedArea(isExpanded?null:area.id)} className="flex-1 text-left flex items-center gap-2 min-w-0">
                  <span className="font-bold text-slate-800">{area.name}</span>
                  {area.notes && <span className="text-xs text-slate-400 truncate hidden sm:block">{area.notes}</span>}
                  <span className="text-xs bg-indigo-50 text-indigo-600 border border-indigo-200 px-2 py-0.5 rounded-full ml-auto flex-shrink-0">{donorCount} donation{donorCount!==1?"s":""}</span>
                  <span className="text-slate-300 text-xs flex-shrink-0">{isExpanded?"▲":"▼"}</span>
                </button>
                <button onClick={()=>{ setDonorForm(area.id); setNewDonor(blankDonor()); }} className="text-xs bg-emerald-50 border border-emerald-200 text-emerald-600 px-2.5 py-1.5 rounded-lg hover:bg-emerald-100 font-semibold flex-shrink-0">＋ Donor</button>
                <button onClick={()=>{setEditArea(area.id);setDraftArea({...area});}} className="text-xs bg-indigo-50 border border-indigo-200 text-indigo-600 px-2.5 py-1.5 rounded-lg hover:bg-indigo-100">Edit</button>
                <button onClick={()=>delArea(area.id)} className="text-xs bg-red-50 border border-red-200 text-red-500 px-2.5 py-1.5 rounded-lg hover:bg-red-100">Del</button>
              </div>
            )}

            {/* New donor form */}
            {donorForm === area.id && (
              <div className="px-4 py-3 border-b border-slate-100 bg-slate-50">
                <p className="text-xs font-bold text-slate-600 mb-2">Record Donation — {area.name}</p>
                <DonorForm areaId={area.id} donor={newDonor} setDonor={setNewDonor}
                  onSave={()=>saveDonor(area.id)}
                  onCancel={()=>{setDonorForm(null);setNewDonor(blankDonor());}}/>
              </div>
            )}

            {/* Donation list */}
            {isExpanded && (area.donations||[]).length === 0 && donorForm !== area.id && (
              <div className="px-4 py-4 text-center text-slate-400 text-sm">No donations recorded yet — click ＋ Donor to add one</div>
            )}

            {isExpanded && (area.donations||[]).length > 0 && (
              <table className="w-full border-collapse text-sm">
                <thead><tr className="bg-slate-50 border-b border-slate-100">
                  <th className="px-4 py-2 text-left font-bold text-slate-500 text-xs">Donor</th>
                  <th className="px-4 py-2 text-center font-bold text-slate-500 text-xs">Amount</th>
                  <th className="px-4 py-2 text-center font-bold text-slate-500 text-xs hidden sm:table-cell">Frequency</th>
                  <th className="px-4 py-2 text-left font-bold text-slate-500 text-xs hidden md:table-cell">Rota Dates</th>
                  <th className="px-4 py-2 text-center font-bold text-slate-500 text-xs">Actions</th>
                </tr></thead>
                <tbody>
                  {(area.donations||[]).map((d, di) => editDonor?.areaId===area.id && editDonor.donorId===d.id ? (
                    <tr key={d.id} className="border-b border-slate-100 bg-indigo-50">
                      <td colSpan={5} className="px-4 py-2">
                        <DonorForm areaId={area.id} donor={draftDonor} setDonor={setDraftDonor}
                          onSave={saveEditDonor}
                          onCancel={()=>{setEditDonor(null);setDraftDonor(null);}}/>
                      </td>
                    </tr>
                  ) : (
                    <tr key={d.id} className={`border-b border-slate-100 ${di%2===0?"bg-white":"bg-slate-50 bg-opacity-30"} hover:bg-indigo-50 bg-opacity-20`}>
                      <td className="px-4 py-2.5 font-medium text-slate-800">{d.donor}{d.notes&&<span className="ml-1 text-xs text-slate-400">({d.notes})</span>}</td>
                      <td className="px-4 py-2.5 text-center font-bold text-emerald-700">£{d.amount}</td>
                      <td className="px-4 py-2.5 text-center text-xs text-slate-500 hidden sm:table-cell capitalize">{d.frequency}{d.customWeeks?" · "+d.customWeeks+" wks":""}</td>
                      <td className="px-4 py-2.5 hidden md:table-cell">
                        <div className="flex flex-wrap gap-1">
                          {(d.rotaDates||[]).slice(0,3).map(dt=>(

                          ))}

                        <button onClick={()=>{setEditDonor({areaId:area.id,donorId:d.id});setDraftDonor({...d});}} className="text-xs bg-indigo-50 border border-indigo-200 text-indigo-600 px-2.5 py-1 rounded-lg hover:bg-indigo-100">Edit</button>

}

// ── MD: Inventory ─────────────────────────────────────────────────────────────
const UOM_OPTIONS = ["count","kg","g","litre","ml","box","pack","roll","pair","set"];
function MDInventory({ inventory, upInventory, showToast }) {
  const blank = () => ({ id: uid(), name: "", qty: "", uom: "count", type: "consumable", notes: "" });
  const [showForm, setShowForm] = useState(false);
  const [newRow,   setNewRow]   = useState(blank());
  const [editing,  setEditing]  = useState(null);
  const [draft,    setDraft]    = useState(null);
  const [filter,   setFilter]   = useState("all");

  const save = () => {
    if (!newRow.name.trim()) return showToast("Pooja Details required","error");
    if (newRow.qty===""||isNaN(Number(newRow.qty))) return showToast("Enter a valid quantity","error");
    upInventory([...inventory, newRow]);
    setNewRow(blank()); setShowForm(false); showToast("Item added");
  };
  const saveEdit = () => {
    if (!draft.name.trim()) return showToast("Name required","error");
    upInventory(inventory.map(x=>x.id===draft.id?draft:x));
    setEditing(null); setDraft(null); showToast("Updated");
  };
  const del = id => { if(confirm("Delete this item?")) { upInventory(inventory.filter(x=>x.id!==id)); showToast("Deleted"); }};

  const filtered  = filter==="all" ? inventory : inventory.filter(x=>x.type===filter);
  const lowStock  = inventory.filter(x=>x.type==="consumable"&&Number(x.qty)<5);

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between flex-wrap gap-3">
        <div>

          <p className="text-sm text-slate-500 mt-0.5">Track consumable and non-consumable items with quantities and units. Low-stock warnings appear on Rota Sheets.</p>

        <button onClick={()=>{setShowForm(true);setNewRow(blank());}}
          className="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2.5 rounded-xl font-bold text-sm">＋ Add Item</button>

      {lowStock.length > 0 && (
        <div className="bg-amber-50 border border-amber-200 rounded-xl px-4 py-2.5 flex items-center gap-2">
          <span>⚠️</span>
          <span className="text-xs font-semibold text-amber-800">Low stock: {lowStock.map(x=>`${x.name} (${x.qty} ${x.uom||"count"})`).join(" · ")}</span>
        </div>

      {showForm && (
        <div className="bg-indigo-50 border border-indigo-200 rounded-2xl p-4 space-y-3">
          <p className="text-sm font-bold text-indigo-800">New Item</p>
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <div className="col-span-2"><label className="text-xs font-semibold text-slate-600 block mb-1">Pooja Details *</label>

                className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300"/></div>
            <div><label className="text-xs font-semibold text-slate-600 block mb-1">Quantity *</label>
              <input type="number" min="0" step="any" value={newRow.qty} onChange={e=>setNewRow(p=>({...p,qty:e.target.value}))} placeholder="50"
                className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300"/></div>
            <div><label className="text-xs font-semibold text-slate-600 block mb-1">Unit</label>
              <select value={newRow.uom} onChange={e=>setNewRow(p=>({...p,uom:e.target.value}))}
                className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-300">
                {UOM_OPTIONS.map(u=><option key={u} value={u}>{u}</option>)}
              </select></div>
            <div><label className="text-xs font-semibold text-slate-600 block mb-1">Type</label>
              <select value={newRow.type} onChange={e=>setNewRow(p=>({...p,type:e.target.value}))}

            <div className="col-span-2 sm:col-span-3"><label className="text-xs font-semibold text-slate-600 block mb-1">Notes</label>

          </div>
          <div className="flex gap-2 justify-end">
            <button onClick={()=>setShowForm(false)} className="px-4 py-2 rounded-xl text-sm font-semibold border border-slate-200 bg-white hover:bg-slate-50">Cancel</button>
            <button onClick={save} className="px-5 py-2 rounded-xl text-sm font-bold bg-indigo-600 text-white hover:bg-indigo-700">Add Item</button>
          </div>
        </div>
      )}

      {inventory.length > 0 && (
        <div className="flex gap-1.5">
          {[["all","All"],["consumable","Consumable"],["non-consumable","Non-Consumable"]].map(([k,l])=>(

              <th className="px-4 py-2.5 text-center font-bold text-slate-600">Unit</th>
              <th className="px-4 py-2.5 text-center font-bold text-slate-600 hidden sm:table-cell">Type</th>
              <th className="px-4 py-2.5 text-left font-bold text-slate-600 hidden md:table-cell">Notes</th>
              <th className="px-4 py-2.5 text-center font-bold text-slate-600">Actions</th>
            </tr></thead>
            <tbody>

                <tr key={it.id} className="bg-indigo-50 border-b border-slate-100">
                  <td className="px-3 py-2"><input value={draft.name} onChange={e=>setDraft(p=>({...p,name:e.target.value}))} className="w-full border rounded-lg px-2 py-1 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-300"/></td>
                  <td className="px-3 py-2"><input type="number" min="0" step="any" value={draft.qty} onChange={e=>setDraft(p=>({...p,qty:e.target.value}))} className="w-20 border rounded-lg px-2 py-1 text-sm text-center focus:outline-none focus:ring-1 focus:ring-indigo-300"/></td>
                  <td className="px-3 py-2"><select value={draft.uom||"count"} onChange={e=>setDraft(p=>({...p,uom:e.target.value}))} className="border rounded-lg px-1 py-1 text-xs bg-white focus:outline-none focus:ring-1 focus:ring-indigo-300">{UOM_OPTIONS.map(u=><option key={u} value={u}>{u}</option>)}</select></td>
                  <td className="px-3 py-2 hidden sm:table-cell"><select value={draft.type} onChange={e=>setDraft(p=>({...p,type:e.target.value}))} className="border rounded-lg px-1 py-1 text-xs bg-white focus:outline-none focus:ring-1 focus:ring-indigo-300"><option value="consumable">Consumable</option><option value="non-consumable">Non-Consumable</option></select></td>
                  <td className="px-3 py-2 hidden md:table-cell"><input value={draft.notes} onChange={e=>setDraft(p=>({...p,notes:e.target.value}))} className="w-full border rounded-lg px-2 py-1 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-300"/></td>

                    <span className={`text-xs px-2 py-0.5 rounded-full font-semibold ${it.type==="consumable"?"bg-orange-100 text-orange-700":"bg-slate-100 text-slate-600"}`}>

                  <td className="px-4 py-2.5 text-slate-500 text-xs hidden md:table-cell">{it.notes||<span className="text-slate-300">—</span>}</td>

// ── MD: Finance ───────────────────────────────────────────────────────────────
function MDFinance({ rotaSheets=[] }) {
  var closed = rotaSheets.filter(function(s){return s.status==="closed";});
  var [filterMonth, setFilterMonth] = React.useState("all");

  // Build month options from closed sheets
  var months = [];
  var seenMonths = {};
  closed.forEach(function(s){
    var d = new Date(s.date);
    var key = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
    var label = d.toLocaleDateString("en-GB",{month:"long",year:"numeric"});
    if (!seenMonths[key]){ seenMonths[key]=true; months.push({key,label}); }
  });
  months.sort(function(a,b){return a.key.localeCompare(b.key);});

  var filtered = filterMonth==="all" ? closed : closed.filter(function(s){
    var d = new Date(s.date);
    var key = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
    return key===filterMonth;
  });
  var sorted = filtered.slice().sort(function(a,b){return new Date(a.date)-new Date(b.date);});

  var sum = function(arr, fn){ return arr.reduce(function(t,s){return t+fn(s);},0); };
  var fmt = function(n){return "£"+n.toFixed(2);};

  // Income components
  var totalArchana   = sum(sorted, function(s){return parseFloat((s.archanaTickets&&s.archanaTickets.amount)||0);});
  var totalDonations = sum(sorted, function(s){return parseFloat((s.donationBook&&s.donationBook.amount)||0);});
  var totalHundi     = sum(sorted, function(s){return parseFloat((s.hundi&&s.hundi.amount)||0);});
  var totalIncome    = totalArchana + totalDonations + totalHundi;
  var totalExpenses  = sum(sorted, function(s){return parseFloat((s.expenseVouchers&&s.expenseVouchers.amount)||0);});
  var netRevenue     = totalIncome - totalExpenses;

  // Payment method totals
  var cashIncome  = sum(sorted, function(s){
    return parseFloat((s.archanaTickets&&s.archanaTickets.cashAmount)||0)
         + parseFloat((s.donationBook&&s.donationBook.cashAmount)||0)
         + parseFloat((s.hundi&&s.hundi.amount)||0);
  });
  var sumupIncome = sum(sorted, function(s){
    return parseFloat((s.archanaTickets&&s.archanaTickets.sumupAmount)||0)
         + parseFloat((s.donationBook&&s.donationBook.sumupAmount)||0);
  });
  var onlineIncome = sum(sorted, function(s){
    return parseFloat((s.archanaTickets&&s.archanaTickets.onlineAmount)||0)
         + parseFloat((s.donationBook&&s.donationBook.onlineAmount)||0);
  });
  var cashExp   = sum(sorted, function(s){return parseFloat((s.expenseVouchers&&s.expenseVouchers.cashAmount)||0);});
  var onlineExp = sum(sorted, function(s){return parseFloat((s.expenseVouchers&&s.expenseVouchers.onlineAmount)||0);});

  var running = 0;

  if (closed.length === 0) return (
    <div className="bg-white rounded-2xl border border-slate-200 p-12 text-center">
      <div className="text-5xl mb-3">📊</div>
      <p className="font-semibold text-slate-500">No closed rota sheets yet</p>
      <p className="text-sm text-slate-400 mt-1">Financial data appears once sheets are closed</p>
    </div>
  );

  return (
    <div className="space-y-5">

      {/* Month filter */}
      <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-4">
        <div className="flex flex-wrap gap-2 items-center">
          <span className="text-xs font-semibold text-slate-500 mr-1">Filter:</span>
          <button onClick={function(){setFilterMonth("all");}}
            className={"text-xs px-3 py-1.5 rounded-lg font-semibold border transition-colors "+(filterMonth==="all"?"bg-indigo-600 text-white border-indigo-600":"bg-white border-slate-200 text-slate-600 hover:bg-slate-50")}>
            All Time
          </button>
          {months.map(function(m){return (
            <button key={m.key} onClick={function(){setFilterMonth(m.key);}}
              className={"text-xs px-3 py-1.5 rounded-lg font-semibold border transition-colors "+(filterMonth===m.key?"bg-indigo-600 text-white border-indigo-600":"bg-white border-slate-200 text-slate-600 hover:bg-slate-50")}>
              {m.label}
            </button>
          );})}
        </div>
      </div>

      {/* KPI summary */}
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        <div className="bg-emerald-600 text-white rounded-2xl p-4">
          <div className="text-xs font-semibold text-emerald-100 mb-1">💰 Total Income</div>
          <div className="text-2xl font-black">{fmt(totalIncome)}</div>
          <div className="text-emerald-200 text-xs mt-1">{sorted.length} session{sorted.length!==1?"s":""}</div>
        </div>
        <div className="bg-red-50 border border-red-200 rounded-2xl p-4">
          <div className="text-xs font-semibold text-red-500 mb-1">🧾 Total Expenses</div>
          <div className="text-2xl font-black text-red-700">{fmt(totalExpenses)}</div>
        </div>
        <div className={"rounded-2xl p-4 border "+(netRevenue>=0?"bg-indigo-50 border-indigo-200":"bg-amber-50 border-amber-200")}>
          <div className={"text-xs font-semibold mb-1 "+(netRevenue>=0?"text-indigo-500":"text-amber-500")}>📊 Net Revenue</div>
          <div className={"text-2xl font-black "+(netRevenue>=0?"text-indigo-700":"text-amber-700")}>{fmt(netRevenue)}</div>
        </div>
        <div className="bg-slate-50 border border-slate-200 rounded-2xl p-4 space-y-1">
          <div className="text-xs font-semibold text-slate-500 mb-2">Income Breakdown</div>
          <div className="flex justify-between text-xs"><span className="text-slate-500">🎟 Archana</span><span className="font-bold">{fmt(totalArchana)}</span></div>
          <div className="flex justify-between text-xs"><span className="text-slate-500">📖 Donations</span><span className="font-bold">{fmt(totalDonations)}</span></div>
          <div className="flex justify-between text-xs"><span className="text-slate-500">🪣 Hundi</span><span className="font-bold">{fmt(totalHundi)}</span></div>
        </div>
      </div>

      {/* Payment method breakdown */}
      <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-5">
        <h3 className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-4">💳 By Payment Method</h3>
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead>
              <tr className="border-b border-slate-100">
                <th className="text-left pb-2 font-semibold text-slate-500">Method</th>
                <th className="text-right pb-2 font-semibold text-emerald-600">Income</th>
                <th className="text-right pb-2 font-semibold text-slate-400">%</th>
                <th className="text-right pb-2 font-semibold text-red-500">Expense</th>
                <th className="text-right pb-2 font-semibold text-indigo-600">Net</th>
              </tr>
            </thead>
            <tbody>
              <tr className="border-b border-slate-50">
                <td className="py-2 font-medium text-slate-700">💵 Cash</td>
                <td className="py-2 text-right text-emerald-700 font-semibold">{fmt(cashIncome)}</td>
                <td className="py-2 text-right text-slate-400 text-xs">{totalIncome>0?Math.round(cashIncome/totalIncome*100):0}%</td>
                <td className="py-2 text-right text-red-500">{cashExp>0?fmt(cashExp):"—"}</td>
                <td className={"py-2 text-right font-bold "+(cashIncome-cashExp>=0?"text-indigo-700":"text-amber-600")}>{fmt(cashIncome-cashExp)}</td>
              </tr>
              <tr className="border-b border-slate-50">
                <td className="py-2 font-medium text-slate-700">📱 SumUp</td>
                <td className="py-2 text-right text-emerald-700 font-semibold">{fmt(sumupIncome)}</td>
                <td className="py-2 text-right text-slate-400 text-xs">{totalIncome>0?Math.round(sumupIncome/totalIncome*100):0}%</td>
                <td className="py-2 text-right text-slate-300">—</td>
                <td className="py-2 text-right font-bold text-indigo-700">{fmt(sumupIncome)}</td>
              </tr>
              <tr className="border-b border-slate-50">
                <td className="py-2 font-medium text-slate-700">🌐 Online</td>
                <td className="py-2 text-right text-emerald-700 font-semibold">{fmt(onlineIncome)}</td>
                <td className="py-2 text-right text-slate-400 text-xs">{totalIncome>0?Math.round(onlineIncome/totalIncome*100):0}%</td>
                <td className="py-2 text-right text-red-500">{onlineExp>0?fmt(onlineExp):"—"}</td>
                <td className={"py-2 text-right font-bold "+(onlineIncome-onlineExp>=0?"text-indigo-700":"text-amber-600")}>{fmt(onlineIncome-onlineExp)}</td>
              </tr>
              <tr className="border-t-2 border-slate-200 bg-slate-50">
                <td className="py-2 font-black text-slate-800">Total</td>
                <td className="py-2 text-right font-black text-emerald-700">{fmt(totalIncome)}</td>
                <td className="py-2 text-right text-slate-400 text-xs">100%</td>
                <td className="py-2 text-right font-black text-red-600">{fmt(totalExpenses)}</td>
                <td className={"py-2 text-right font-black "+(netRevenue>=0?"text-indigo-700":"text-amber-700")}>{fmt(netRevenue)}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      {/* Balance sheet ledger */}
      <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
        <div className="px-5 py-3 border-b border-slate-100 flex items-center justify-between">
          <h3 className="text-xs font-bold text-slate-500 uppercase tracking-wider">📒 Balance Sheet — Session by Session</h3>
          <span className="text-xs text-slate-400">{sorted.length} sessions</span>
        </div>
        <div className="overflow-x-auto">
          <table className="w-full text-xs">
            <thead>
              <tr className="bg-slate-50 border-b border-slate-100">
                <th className="text-left px-4 py-2 font-semibold text-slate-500 whitespace-nowrap">Date</th>
                <th className="text-left px-4 py-2 font-semibold text-slate-500 whitespace-nowrap hidden md:table-cell">Lead</th>
                <th className="text-right px-3 py-2 font-semibold text-emerald-600 whitespace-nowrap">Archana</th>
                <th className="text-right px-3 py-2 font-semibold text-emerald-600 whitespace-nowrap hidden md:table-cell">Donations</th>
                <th className="text-right px-3 py-2 font-semibold text-emerald-600 whitespace-nowrap hidden md:table-cell">Hundi</th>
                <th className="text-right px-3 py-2 font-semibold text-emerald-700 whitespace-nowrap">Income</th>
                <th className="text-right px-3 py-2 font-semibold text-red-500 whitespace-nowrap">Expense</th>
                <th className="text-right px-3 py-2 font-semibold text-indigo-600 whitespace-nowrap">Net</th>
                <th className="text-right px-4 py-2 font-semibold text-slate-700 whitespace-nowrap">Balance</th>
              </tr>
            </thead>
            <tbody>
              {sorted.map(function(s){
                var arch = parseFloat((s.archanaTickets&&s.archanaTickets.amount)||0);
                var don  = parseFloat((s.donationBook&&s.donationBook.amount)||0);
                var hun  = parseFloat((s.hundi&&s.hundi.amount)||0);
                var inc  = arch + don + hun;
                var exp  = parseFloat((s.expenseVouchers&&s.expenseVouchers.amount)||0);
                var net  = inc - exp;
                running += net;
                var runSnap = running;
                return (
                  <tr key={s.id} className="border-b border-slate-50 hover:bg-slate-50 transition-colors">
                    <td className="px-4 py-2 font-medium text-slate-700 whitespace-nowrap">
                      {new Date(s.date).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"2-digit"})}
                    </td>
                    <td className="px-4 py-2 text-slate-400 whitespace-nowrap hidden md:table-cell">{s.rotaLead||"—"}</td>
                    <td className="px-3 py-2 text-right text-slate-600 whitespace-nowrap">{arch>0?fmt(arch):"—"}</td>
                    <td className="px-3 py-2 text-right text-slate-600 whitespace-nowrap hidden md:table-cell">{don>0?fmt(don):"—"}</td>
                    <td className="px-3 py-2 text-right text-slate-600 whitespace-nowrap hidden md:table-cell">{hun>0?fmt(hun):"—"}</td>
                    <td className="px-3 py-2 text-right font-semibold text-emerald-700 whitespace-nowrap">{fmt(inc)}</td>
                    <td className="px-3 py-2 text-right text-red-500 whitespace-nowrap">{exp>0?fmt(exp):"—"}</td>
                    <td className={"px-3 py-2 text-right font-semibold whitespace-nowrap "+(net>=0?"text-indigo-600":"text-amber-600")}>{fmt(net)}</td>
                    <td className={"px-4 py-2 text-right font-black whitespace-nowrap "+(runSnap>=0?"text-slate-800":"text-red-600")}>{fmt(runSnap)}</td>
                  </tr>
                );
              })}
              <tr className="bg-slate-50 border-t-2 border-slate-300">
                <td className="px-4 py-2.5 font-black text-slate-700" colSpan="2">Total</td>
                <td className="px-3 py-2.5 text-right font-black text-emerald-700 hidden md:table-cell">{fmt(totalArchana)}</td>
                <td className="px-3 py-2.5 text-right font-black text-emerald-700 hidden md:table-cell">{fmt(totalDonations)}</td>
                <td className="px-3 py-2.5 text-right font-black text-emerald-700 hidden md:table-cell">{fmt(totalHundi)}</td>
                <td className="px-3 py-2.5 text-right font-black text-emerald-700">{fmt(totalIncome)}</td>
                <td className="px-3 py-2.5 text-right font-black text-red-600">{fmt(totalExpenses)}</td>
                <td className={"px-3 py-2.5 text-right font-black "+(netRevenue>=0?"text-indigo-700":"text-amber-700")}>{fmt(netRevenue)}</td>
                <td className={"px-4 py-2.5 text-right font-black "+(netRevenue>=0?"text-slate-800":"text-red-600")}>{fmt(netRevenue)}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ── MD: Members ───────────────────────────────────────────────────────────────
function MDMembers({ members, upMembers, showToast }) {
  const blank = {name:"",email:"",phone:"",pin:"",area:"",city:"",role:"primary",isAdmin:false,notes:""};
  const [form, setForm]   = useState(blank);
  const [editId, setEditId] = useState(null);
  const [search, setSearch] = useState("");
  const [roleFilter, setRoleFilter] = useState("all");
  const [confirmDel, setConfirmDel] = useState(null);

  const filtered = members
    .filter(m => roleFilter==="all" || m.role===roleFilter)
    .filter(m => !search || (m.name+m.email+m.phone).toLowerCase().includes(search.toLowerCase()))
    .sort(function(a,b){ var pa = (a.approved===false||a.approved==="rejected") ? -1 : 1; var pb = (b.approved===false||b.approved==="rejected") ? -1 : 1; return pa - pb; });

  const save = () => {
    if (!form.name.trim()) return showToast("Name is required","error");
    if (editId) {
      const pinUpdate = form.pin && form.pin.trim().length >= 4 ? { pin: form.pin.trim() } : {};
      upMembers(members.map(m=>m.id===editId?{...m,...form,...pinUpdate}:m));
      showToast("Member updated"); setEditId(null);
    } else {
      if (members.find(m=>m.name.toLowerCase()===form.name.trim().toLowerCase()))
        return showToast("A member with this name already exists","error");
      upMembers([...members,{id:uid(),...form,name:form.name.trim()}]);
      showToast("Member added");
    }
    setForm(blank);
  };
  const remove = id => { upMembers(members.filter(m=>m.id!==id)); showToast("Member removed"); setConfirmDel(null); if(editId===id){setEditId(null);setForm(blank);} };
  const edit   = m  => { setEditId(m.id); setForm({name:m.name,email:m.email||"",phone:m.phone||"",pin:"",role:m.role,isAdmin:!!m.isAdmin,notes:m.notes||""}); };
  const cancel = () => { setEditId(null); setForm(blank); };
  const primary=members.filter(m=>m.role==="primary").length;
  const secondary=members.filter(m=>m.role==="secondary").length;

  return (
    <div className="grid md:grid-cols-5 gap-6">
      <div className="md:col-span-2">
        <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 sticky top-4 space-y-3">
          <div className="flex items-center justify-between">
            <h2 className="font-bold text-slate-800 text-base">{editId?"✏️ Edit Member":"➕ Add Member"}</h2>
            {editId && <button onClick={cancel} className="text-xs text-slate-400 hover:text-slate-600">✕ Cancel</button>}
          </div>
          <Field label="Full Name *"  value={form.name}  onChange={v=>setForm({...form,name:v})}  placeholder="e.g. Priya Sharma"/>
          <Field label="Email"        type="email" value={form.email} onChange={v=>setForm({...form,email:v})} placeholder="priya@example.com"/>
          <Field label="Phone"        value={form.phone} onChange={v=>setForm({...form,phone:v})} placeholder="+44 7700 900000"/>
          <Field label={"PIN " + (editId?"(leave blank to keep current)":"(min 4 digits)")} type="password" value={form.pin||""} onChange={v=>setForm({...form,pin:v})} placeholder="••••"/>
          <div>
            <label className="text-xs font-semibold text-slate-500 mb-1 block">Role / Access Level *</label>
            <p className="text-xs text-slate-400 mb-2">Role determines what the member can access when they sign in</p>
            <div className="flex gap-2 flex-wrap">
              {[["primary","🎯 Rota Lead"],["secondary","🟣 Secondary"],["volunteer","🙋 Volunteer"]].map(([r,l])=>(
                <button key={r} onClick={()=>setForm({...form,role:r})}
                  className={`flex-1 py-2 rounded-lg text-xs font-semibold border transition-colors ${form.role===r?(r==="primary"?"bg-indigo-600 text-white border-indigo-600":r==="secondary"?"bg-violet-600 text-white border-violet-600":"bg-emerald-600 text-white border-emerald-600"):"bg-white text-slate-600 border-slate-200 hover:bg-slate-50"}`}>
                  {l}
                </button>
              ))}
            </div>
          </div>
          <label className="flex items-start gap-2 p-3 rounded-lg border border-amber-200 bg-amber-50 cursor-pointer">
            <input type="checkbox" checked={!!form.isAdmin} onChange={e=>setForm({...form,isAdmin:e.target.checked})} className="mt-0.5"/>
            <span className="text-xs text-amber-800"><b>⚙️ Admin</b> — full access to everything (Admin, Rota and Volunteer). Keeps their rota role above.</span>
          </label>
          <div>
            <label className="text-xs font-semibold text-slate-500 mb-1 block">Notes</label>
            <textarea value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})}
              rows={2} placeholder="Any notes about this member…"
              className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 resize-none"/>
          </div>
          <button onClick={save} className="w-full bg-indigo-600 text-white rounded-lg py-2.5 text-sm font-bold hover:bg-indigo-700">
            {editId?"Save Changes":"Add Member"}
          </button>
          <div className="flex gap-2 pt-1 border-t border-slate-100">
            <div className="flex-1 bg-indigo-50 rounded-xl p-2 text-center"><div className="text-lg font-bold text-indigo-700">{primary}</div><div className="text-xs text-indigo-500">Rota Leads</div></div>
            <div className="flex-1 bg-violet-50 rounded-xl p-2 text-center"><div className="text-lg font-bold text-violet-700">{secondary}</div><div className="text-xs text-violet-500">Secondary</div></div>
            <div className="flex-1 bg-slate-50 rounded-xl p-2 text-center"><div className="text-lg font-bold text-slate-700">{members.length}</div><div className="text-xs text-slate-500">Total</div></div>
          </div>
        </div>
      </div>
      <div className="md:col-span-3 space-y-3">
        <div className="flex gap-2 flex-wrap items-center">
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search by name, email, phone…"
            className="flex-1 min-w-0 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300"/>
          <div className="flex bg-slate-100 rounded-lg p-0.5 gap-0.5">
            {[["all","All"],["primary","🎯 Rota Lead"],["secondary","🙋 Volunteer"]].map(([r,l])=>(
              <button key={r} onClick={()=>setRoleFilter(r)}
                className={`px-3 py-1.5 rounded-md text-xs font-semibold transition-colors ${roleFilter===r?"bg-white text-slate-700 shadow-sm":"text-slate-500 hover:text-slate-700"}`}>
                {l}
              </button>
            ))}
          </div>
          <span className="text-xs text-slate-400">{filtered.length}/{members.length}</span>
        </div>
        {filtered.length===0 ? (
          <div className="bg-white rounded-2xl border border-slate-200 p-14 text-center text-slate-400">
            <div className="text-5xl mb-3">👥</div>
            <p className="font-semibold">{members.length===0?"No members yet":"No results"}</p>
          </div>
        ) : (
          <div className="space-y-2">
            {filtered.map(m=>(
              <div key={m.id} className={`bg-white border rounded-2xl px-4 py-3 flex items-center gap-3 shadow-sm transition-all ${editId===m.id?"border-indigo-300 ring-1 ring-indigo-200":m.approved===false?"border-amber-300 bg-amber-50":m.approved==="rejected"?"border-red-200 bg-red-50":"border-slate-200 hover:shadow"}`}>
                <Avatar name={m.name}/>
                <div className="flex-1 min-w-0">
                  <div className="font-semibold text-slate-800 text-sm">{m.name}</div>
                  <div className="text-xs text-slate-400 truncate">{[m.email,m.phone].filter(Boolean).join(" · ")||"No contact info"}</div>
                  {m.notes&&<div className="text-xs text-slate-400 italic truncate mt-0.5">"{m.notes}"</div>}
                </div>
                {m.approved===false && <span className="text-xs bg-amber-100 text-amber-700 border border-amber-200 px-2 py-0.5 rounded-full font-bold flex-shrink-0">⏳ Pending</span>}
                {m.approved==="rejected" && <span className="text-xs bg-red-100 text-red-600 border border-red-200 px-2 py-0.5 rounded-full font-bold flex-shrink-0">✗ Declined</span>}
                {m.isAdmin && <span className="text-xs bg-amber-100 text-amber-700 border border-amber-200 px-2 py-0.5 rounded-full font-bold flex-shrink-0">⚙️ Admin</span>}
                <span className={`text-xs px-2.5 py-1 rounded-full font-semibold flex-shrink-0 ${m.role==="primary"?"bg-indigo-100 text-indigo-600":m.role==="secondary"?"bg-violet-100 text-violet-600":"bg-emerald-100 text-emerald-600"}`}>{roleLabel(m.role)}</span>
                <div className="flex gap-1 flex-shrink-0">
                  {m.approved===false && (
                    <button onClick={function(){ var updated=members.map(function(x){return x.id===m.id?{...x,approved:true}:x;}); upMembers(updated); showToast(m.name+" approved");}}
                      className="text-xs bg-emerald-50 border border-emerald-200 text-emerald-700 px-2.5 py-1.5 rounded-lg hover:bg-emerald-100 font-bold">✓ Approve</button>
                  )}
                  {m.approved===false && (
                    <button onClick={function(){ var updated=members.map(function(x){return x.id===m.id?{...x,approved:"rejected"}:x;}); upMembers(updated); showToast(m.name+" declined");}}
                      className="text-xs bg-red-50 border border-red-200 text-red-600 px-2.5 py-1.5 rounded-lg hover:bg-red-100 font-bold">✗ Decline</button>
                  )}
                  <button onClick={()=>edit(m)} className="text-xs bg-slate-50 border border-slate-200 text-slate-600 px-2.5 py-1.5 rounded-lg hover:bg-slate-100 font-medium">Edit</button>

                  <button onClick={()=>setConfirmDel(m)} className="text-xs bg-red-50 border border-red-200 text-red-500 px-2.5 py-1.5 rounded-lg hover:bg-red-100 font-medium">Delete</button>
                </div>

              <button onClick={()=>setConfirmDel(null)} className="flex-1 bg-slate-100 text-slate-600 rounded-xl py-2.5 font-semibold text-sm">Cancel</button>

  );
}
